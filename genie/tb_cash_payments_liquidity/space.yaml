# APAC Genie - Transactional Banking: Cash, Payments & Liquidity (brief §5.7, PLAN §8 / §9 / §10). Authored by G3
# (p07g3). Must-answer queries: metrics/_answers/tb_cash_payments_liquidity.sql. Caveats: scratch/genie_caveats.md §7.
slug: tb_cash_payments_liquidity
title: "APAC Genie - Transactional Banking: Cash, Payments & Liquidity"
description: >-
  Ask about operating deposits, CASA behaviour, payment flows and counterparties, liquidity structures (cash
  pooling) and digital channel adoption for SMBC's APAC clients. Figures are USD unless you ask for local currency;
  periods follow the Japanese fiscal year (Apr-Mar). Client names roll up to client groups; data is synthetic and
  as of 30 Sep 2026.

