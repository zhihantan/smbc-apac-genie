# APAC Genie - Account Planning (brief §5.1, PLAN §8 / §9 / §10). Authored by G1 (p07g1).
# Must-answer queries: metrics/_answers/account_planning.sql. Caveats: scratch/genie_caveats.md §1.
slug: account_planning
title: APAC Genie - Account Planning
description: >-
  Ask about account plans, relationship footprint, global group relationships and RM engagement for SMBC's APAC
  clients. Figures are USD unless you ask for local currency; periods follow the Japanese fiscal year (Apr-Mar).
  Client names roll up to client groups; data is synthetic and as of 30 Sep 2026.

