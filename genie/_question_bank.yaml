    job: >-
      Operating deposits and CASA behaviour, payment flows and counterparties, liquidity structures (pooling and
      sweeps) and digital channel adoption.
    knows: >-
      Month-end balances per deposit account (CASA and time deposits); every payment message (channel, direction,
      purpose, counterparty bank type, straight-through processing (STP) or repair); liquidity structures and their
      member accounts; and digital channel usage per client and month. For deposits and payments the booking
      country is the coverage office.
    starters:
      - {benchmark: Q1}
      - {benchmark: Q2}
      - {benchmark: Q3}
      - {benchmark: Q4b, also: [Q4]}
      - benchmark: Q5
        also: [Q5b]
        note: Genie answers both parts in one table - the single lowest channel and currency pair (FAST in MYR, 84.4%, with no minimum volume) and the top repair reasons per channel; the benchmark lists the 12 lowest pairs with at least 200 payments.
        note_sql: 90656b21c28ef817
      - {benchmark: Q6, also: [Q6b]}
      - {benchmark: Q8}
      - {benchmark: Q9, also: [Q9b]}
    themes:
