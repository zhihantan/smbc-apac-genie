  cashflow_forecasting:
    tier: AI-enabled
    audience: TB liquidity advisory, RMs, credit (the liquidity risk of borrowers) and the client-facing cash-forecast proposition.
    job: >-
      Client cash flows derived from transaction data, 7-, 30- and 90-day forecasts with P10 – P90 ranges,
      forecast accuracy, and predicted shortfalls and surpluses that create credit (RCF) and deposit opportunities.
    knows: >-
      Daily inflows and outflows per client and cash-flow category; forecasts per client, run date, horizon
      (7, 30 or 90 days) and model version (v1, and v2 from June 2026) with P10 / P90; monthly accuracy (MAPE,
      bias, interval coverage; 30-day horizon); and liquidity-need events (predicted shortfall or surplus, the
      action taken, days to action). "Go negative" means a material forecast shortfall. AI forecasting is disabled
      on this workspace, so forward projections use the deterministic seasonal fallback.
    starters:
      - {benchmark: Q1}
      - {benchmark: Q2}
      - {benchmark: Q3}
      - benchmark: Q4
        note: Genie adds up the same 13 unplaced surpluses per client (12 clients, with today's closing balance and the 30-day forecast); the benchmark lists each event with its month and status.
        note_sql: 93f642da2b4f96f3
      - {benchmark: Q5}
      - {benchmark: Q6}
      - {benchmark: Q7}
      - benchmark: Q8
        note: Genie gives one bias per booking country across both model versions; the benchmark splits model v1 and v2 and adds the MAPE.
        note_sql: 8a0871c3bb9eb747
    themes:
      - {name: Forecasts, keys: [Q1, Q1b, Q2, Q2b]}
      - {name: Forecast accuracy, keys: [Q3, Q3b, Q8]}
      - {name: "Shortfalls, surpluses and actions", keys: [Q4, Q6, Q6b]}
