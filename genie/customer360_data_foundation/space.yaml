      Rule Version: {entity_matching: true}
      Source System: {format_assistance: false}   # no value dictionary: its technical ALL value attracted whole-run filters
      Match Method: {entity_matching: true}
      Steward Decision: {entity_matching: true}
      Aging Bucket: {entity_matching: true}
      Client Group: {entity_matching: true}
      Segment: {entity_matching: true}
      Relationship Tier: {entity_matching: true}
      Industry: {entity_matching: true}
      Coverage Office: {entity_matching: true}
      Primary RM: {entity_matching: true}
      Steward Queue Open: {synonyms: [steward backlog, open steward items, steward queue aging]}
  - identifier: smbc_genie.metrics.mv_golden_record_coverage
    columns:
      Source System: {entity_matching: true}
      Client Group: {entity_matching: true}
      Segment: {entity_matching: true}
      Relationship Tier: {entity_matching: true}
      Industry: {entity_matching: true}
      Coverage Office: {entity_matching: true}
      Primary RM: {entity_matching: true}
