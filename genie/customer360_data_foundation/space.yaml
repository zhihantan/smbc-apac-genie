# APAC Genie - Customer 360 Data Foundation (brief §5.11, PLAN §8 / §10). Authoring source - format: genie/README.md.
# Owner: Genie content agent G4 (p07g4). Functions: genie/customer360_data_foundation/functions.sql.
# Caveats (scratch/genie_caveats.md §11): coverage and DQ are month-end snapshots (Month = DATE'2026-09-01'); the
# latest ER run is Is Latest Month (ER-20260930); "this month vs last" = Sep-2026 with the prior-month measures;
# unattributed ER exposure has no Client Group; precision / recall are never summed across sources.
slug: customer360_data_foundation
title: APAC Genie - Customer 360 Data Foundation
description: >-
  Ask about entity-resolution quality, golden-record coverage, data quality, Delta Sharing freshness and the
  exposure impact of entity resolution for SMBC's APAC clients. Figures are USD unless you ask for local currency;
  periods follow the Japanese fiscal year (Apr-Mar). Client names roll up to client groups; data is synthetic and
  as of 30 Sep 2026.

