  - identifier: smbc_genie.gold.vw_client_360
    include_columns: [golden_client_id, display_name, legal_name, short_name, aliases_text, lei_like_id,
                      country_of_incorporation, group_name, is_group_lead, segment, relationship_tier, coverage_office,
                      primary_rm_name, source_systems_text, n_source_records, golden_record_confidence,
                      sources_present, in_all_core_sources, is_missing_kyc_record, is_missing_credit_record,
                      attribute_completeness_pct, missing_attributes_text]
    columns:
      group_name: {entity_matching: true}
