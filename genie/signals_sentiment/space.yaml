# APAC Genie - Signals & Sentiment (brief §5.10, PLAN §8 / §10). Authoring source - format: genie/README.md.
# Owner: Genie content agent G4 (p07g4). Functions: genie/signals_sentiment/functions.sql.
# Caveats (scratch/genie_caveats.md §10): market measures are point-in-time (Date = DATE'2026-09-30'); the 30D / 90D
# sentiment, negative-trend and blind-spot measures are fixed to 30-Sep-2026; JP-shared rating actions = Source
# Region 'JP'; acknowledgement of non-CRM signals is a proxy.
slug: signals_sentiment
title: APAC Genie - Signals & Sentiment
description: >-
  Ask about news sentiment, RM-note sentiment, market signals on listed parents and the unified signal feed for
  SMBC's APAC clients. Figures are USD unless you ask for local currency; periods follow the Japanese fiscal year
  (Apr-Mar). Client names roll up to client groups; data is synthetic and as of 30 Sep 2026.

