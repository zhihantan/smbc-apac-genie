# APAC Genie - Cashflow Forecasting (brief §5.9, PLAN §8 / §9 / §10). Authored by G3 (p07g3).
# Must-answer queries: metrics/_answers/cashflow_forecasting.sql. Caveats: scratch/genie_caveats.md §9.
slug: cashflow_forecasting
title: APAC Genie - Cashflow Forecasting
description: >-
  Ask about client cash flows derived from payments, 7 / 30 / 90-day cash-flow forecasts with P10 / P90 ranges,
  forecast accuracy, and predicted shortfalls and surpluses that create RCF and deposit opportunities for SMBC's
  APAC clients. Figures are USD unless you ask for local currency; periods follow the Japanese fiscal year
  (Apr-Mar). Client names roll up to client groups; data is synthetic and as of 30 Sep 2026.

