instructions:
  domain:
    - "- Views: mv_cashflow_forecast = forward forecasts run on 30-Sep-2026 (7D, 30D, 90D) and monthly backtests; mv_forecast_accuracy = MAPE, bias and P10-P90 coverage by model version; mv_liquidity_events = predicted shortfalls / surpluses and the action that followed (RCF drawdown, TD placed); mv_client_cashflow = actual daily inflows / outflows, closing balance, volatility and seasonality."
    - "- Forecast measures return the latest run of the selection: always pick ONE `Horizon` ('7D', '30D' or '90D') and never add runs or horizons; 'next 30 days' = `Is Latest Forecast` AND `Horizon` = '30D'. Fiscal periods use the `Fiscal Year` / `Fiscal Half` labels ('FY2024' = Apr 2024-Mar 2025, 'FY2025' = Apr 2025-Mar 2026), never rebuilt from `Month`."
    - "- 'Forecast to go negative' = `Is Material Shortfall` (forecast net outflow >= 50% of the client's typical monthly gross flow; no client's deposits actually turn negative). `Clients Forecast Negative` counts any net outflow. RCF cover = `Has RCF` with `Undrawn RCF USD`."
    - "- Accuracy is backtested for the 30D horizon only; before vs after the model upgrade = `Model Version` 'v1' vs 'v2' (v2 from the June-2026 targets). Return MAPE %, Bias %, Interval Coverage % and CV exactly as the measures give them - fractions (0.11 = 11%), never multiplied by 100."
    - "- Liquidity events: `Event Type` = 'Predicted Shortfall' or 'Predicted Surplus'; `Month` is the event month (June-September 2026 = `Month` BETWEEN DATE'2026-06-01' AND DATE'2026-09-01'). Unplaced large surpluses = `Is Large Surplus` AND `Is Surplus Not Placed`; RCF follow-up = `Is RCF Drawdown Within 10D`."
    - "- mv_client_cashflow: `Closing Balance USD` is point-in-time on `Date` (the last date of the selection); seasonality = `Seasonality Index` by `Industry` and `Calendar Month` (3 = March, 9 = September); inflow volatility = `Inflow Volatility USD` and `Inflow Volatility CV %` by `Client` over 12 months (`Month` >= DATE'2025-10-01')."
    - "- Red / Amber clients today = `Current EWS Band` IN ('Red', 'Amber') in mv_client_cashflow (`EWS Band` is the band at each row's month-end). `Client Group` has a value dictionary: filter it with = on the exact group name; entity questions list `Client`; add no `IS NOT NULL` filters unless asked and LIMIT only for a top N."
    - "- Functions (STRING arguments): one group's forecast by entity and horizon = smbc_genie.gold.fn_cashflow_forecast_by_entity('<exact group name>'); material shortfalls of clients with an RCF = fn_cashflow_shortfalls_with_rcf('30D'); one group's liquidity snapshot by entity = fn_cashflow_group_liquidity('<exact group name>')."

example_sqls:
  - question: Next :horizon net cash-flow forecast for :client_group with P10 / P90
    usage_guidance: Use for "30-day cash forecast for <group>", "forecast inflows, outflows and net with the P10 / P90 range", "what does <group>'s cash look like next month / week / quarter".
    parameters:
      - {name: client_group, type: STRING, description: "Exact client group name (value dictionary), e.g. Kinokawa Precision", default: Kinokawa Precision}
      - {name: horizon, type: STRING, description: "Forecast horizon: 7D, 30D or 90D", default: 30D}
    sql: |
      SELECT `Client Group`,
             MEASURE(`Forecast Inflow USD`)  AS forecast_inflows_usd,
             MEASURE(`Forecast Outflow USD`) AS expected_outflows_usd,
             MEASURE(`Forecast Net USD`)     AS forecast_net_usd,
             MEASURE(`Forecast Net P10 USD`) AS forecast_net_p10_usd,
             MEASURE(`Forecast Net P90 USD`) AS forecast_net_p90_usd
      FROM smbc_genie.metrics.mv_cashflow_forecast
      WHERE `Is Latest Forecast` AND `Horizon` = :horizon AND `Client Group` = :client_group
      GROUP BY ALL
  - question: Forecast accuracy by horizon, segment and model version for target months since :from_month
    usage_guidance: Use for "forecast accuracy before vs after model v2", "MAPE / bias / interval coverage by segment", "did the model upgrade improve accuracy".
    parameters:
      - {name: from_month, type: DATE, description: "First target month as its first day; 2024-04-01 = all scored history", default: "2024-04-01"}
    sql: |
      SELECT `Horizon`, `Segment`, `Model Version`,
             MEASURE(`MAPE %`)              AS mape,
             MEASURE(`Bias %`)              AS bias,
             MEASURE(`Interval Coverage %`) AS p10_p90_coverage,
             MEASURE(`Scored Forecasts`)    AS scored_forecasts
      FROM smbc_genie.metrics.mv_forecast_accuracy
      WHERE `Month` >= :from_month
      GROUP BY ALL
      ORDER BY `Horizon`, `Segment`, `Model Version`
  - question: Which industries have March and September inflow peaks - seasonality index by industry for March, September and the highest other month, :from_month to :to_month
    usage_guidance: Use for "seasonality", "fiscal year-end / half-year inflow peaks", "which sectors peak in March or September", "seasonal cash-flow patterns by industry".
    parameters:
      - {name: from_month, type: DATE, description: "First month as its first day, e.g. 2024-04-01 (start of FY2024)", default: "2024-04-01"}
      - {name: to_month, type: DATE, description: "Last month as its first day, e.g. 2026-03-01 (end of FY2025)", default: "2026-03-01"}
    sql: |
      WITH s AS (
        SELECT `Industry`, `Calendar Month`, MEASURE(`Seasonality Index`) AS seasonality_index
        FROM smbc_genie.metrics.mv_client_cashflow
        WHERE `Month` BETWEEN :from_month AND :to_month
        GROUP BY ALL
      )
      SELECT `Industry`,
             max(CASE WHEN `Calendar Month` = 3 THEN seasonality_index END) AS march_index,
             max(CASE WHEN `Calendar Month` = 9 THEN seasonality_index END) AS september_index,
             max(CASE WHEN `Calendar Month` NOT IN (3, 9) THEN seasonality_index END) AS highest_other_month_index
      FROM s WHERE `Industry` IS NOT NULL
      GROUP BY `Industry`
      ORDER BY march_index + september_index DESC
  - question: Predicted shortfalls from :from_month to :to_month and how many were followed by an RCF drawdown within 10 days
    usage_guidance: Use for "shortfalls followed by an RCF drawdown", "did predicted shortfalls convert into RCF usage", "RCF follow-up within 10 days", "revenue from liquidity actions".
    parameters:
      - {name: from_month, type: DATE, description: "First event month as its first day, e.g. 2026-06-01", default: "2026-06-01"}
      - {name: to_month, type: DATE, description: "Last event month as its first day, e.g. 2026-09-01", default: "2026-09-01"}
    sql: |
      SELECT MEASURE(`Shortfall Events`)                     AS predicted_shortfalls,
             MEASURE(`Shortfalls Covered by RCF Within 10D`) AS followed_by_rcf_drawdown_within_10d,
             MEASURE(`Action Amount USD`)                    AS amount_drawn_usd,
             MEASURE(`Revenue from Actions USD`)             AS annual_revenue_from_actions_usd
      FROM smbc_genie.metrics.mv_liquidity_events
      WHERE `Month` BETWEEN :from_month AND :to_month AND `Event Type` = 'Predicted Shortfall'
  - question: Inflow volatility ranking of clients in the :band_1 or :band_2 EWS band today over the 12 months from :from_month
    usage_guidance: Use for "inflow volatility of Red / Amber clients", "most volatile receipts among watch names", "cash-flow volatility ranking"; uses today's band (Current EWS Band).
    parameters:
      - {name: band_1, type: STRING, description: "EWS band today: Red, Amber or Green", default: Red}
      - {name: band_2, type: STRING, description: "Second EWS band today: Red, Amber or Green", default: Amber}
      - {name: from_month, type: DATE, description: "First month of the 12-month window as its first day; 2025-10-01 = the last 12 months", default: "2025-10-01"}
    sql: |
      SELECT `Client`, `Current EWS Band`,
             MEASURE(`Average Monthly Inflow USD`) AS average_monthly_inflow_usd,
             MEASURE(`Inflow Volatility USD`)      AS inflow_stddev_usd,
             MEASURE(`Inflow Volatility CV %`)     AS inflow_coefficient_of_variation
      FROM smbc_genie.metrics.mv_client_cashflow
      WHERE `Month` >= :from_month AND `Current EWS Band` IN (:band_1, :band_2)
      GROUP BY ALL
      HAVING MEASURE(`Average Monthly Inflow USD`) >= 500000
      ORDER BY inflow_coefficient_of_variation DESC
  - question: Predicted surpluses above USD 20m not placed since :from_month, with each client's closing balance today and its next-30-day forecast
    usage_guidance: Use for "idle cash / deposit opportunities with today's balance and forecast", "unplaced surpluses vs current liquidity"; joins a liquidity-events CTE, a cash-flow CTE and a forecast CTE (metric views cannot be joined directly).
    parameters:
      - {name: from_month, type: DATE, description: "First event month as its first day, e.g. 2024-07-01 (all event history)", default: "2024-07-01"}
    sql: |
      WITH ev AS (
        SELECT `Client`, MEASURE(`Large Surpluses Not Placed`) AS unplaced_large_surpluses,
               MEASURE(`Predicted Amount USD`) AS unplaced_surplus_usd
        FROM smbc_genie.metrics.mv_liquidity_events
        WHERE `Is Large Surplus` AND `Is Surplus Not Placed` AND `Month` >= :from_month
        GROUP BY ALL
      ), bal AS (
        SELECT `Client`, MEASURE(`Closing Balance USD`) AS closing_balance_usd
        FROM smbc_genie.metrics.mv_client_cashflow
        WHERE `Date` = DATE'2026-09-30'
        GROUP BY ALL
      ), fc AS (
        SELECT `Client`, MEASURE(`Forecast Net USD`) AS forecast_net_30d_usd
        FROM smbc_genie.metrics.mv_cashflow_forecast
        WHERE `Is Latest Forecast` AND `Horizon` = '30D'
        GROUP BY ALL
      )
      SELECT ev.`Client`, ev.unplaced_large_surpluses, ev.unplaced_surplus_usd,
             bal.closing_balance_usd, fc.forecast_net_30d_usd
      FROM ev
      LEFT JOIN bal ON bal.`Client` = ev.`Client`
      LEFT JOIN fc ON fc.`Client` = ev.`Client`
      ORDER BY ev.unplaced_surplus_usd DESC

sql_functions:
  - smbc_genie.gold.fn_cashflow_forecast_by_entity
  - smbc_genie.gold.fn_cashflow_shortfalls_with_rcf
  - smbc_genie.gold.fn_cashflow_group_liquidity

sample_questions:
  - What is the 30-day net cash-flow forecast for Kinokawa Precision, with P10 and P90?
  - Which clients are forecast to go negative in the next 30 days, and how much undrawn RCF do they have?
  - How did forecast accuracy change by horizon and segment after model v2?
  - Which predicted surpluses above USD 20m have not been placed?
  - Which industries have March and September inflow peaks?
  - How many predicted shortfalls were followed by an RCF drawdown within 10 days?
  - Rank the Red and Amber EWS clients by inflow volatility.
  - What is the forecast bias by booking country?

benchmarks:
  - key: Q1
    question: What is the 30-day net cash-flow forecast for the Kinokawa Precision client group - forecast inflows, expected outflows, forecast net, and the net P10 and P90?
    answer: Q1
  - key: Q1-casual
    question: what's kinokawa precision looking like cash-wise over the next 30 days? inflows, outflows, net and the p10/p90 range
    variant_of: Q1
  - key: Q1b
    question: Show the latest Kinokawa Precision cash-flow forecast by entity and horizon (7, 30 and 90 days) - forecast net with its P10 and P90.
    answer: Q1b
  - key: Q2
    question: List the legal entities forecast to go negative in the next 30 days (a material shortfall) that have an RCF, with their segment, forecast net, net P10, deposits and undrawn RCF.
    answer: Q2
  - key: Q2-jargon
    question: RCF drawdown candidates - names with a material 30D cash shortfall and a revolver, with segment, forecast net, P10, deposits and undrawn RCF headroom
    variant_of: Q2
  - key: Q2b
    question: In the next 30 days, how many clients are forecast, how many are forecast net negative and how many have a material shortfall, split by whether they have an RCF, with their undrawn RCF?
    answer: Q2b
  - key: Q3
    question: Show forecast accuracy by horizon, segment and model version - MAPE, bias, P10-P90 interval coverage and the number of scored forecasts.
    answer: Q3
  - key: Q3b
    question: Overall, how did model v1 compare with model v2 - MAPE, P10-P90 interval coverage and number of scored forecasts?
    answer: Q3b
  - key: Q3b-abbrev
    question: MAPE v1 vs v2, w/ P10-P90 coverage and # scored forecasts
    variant_of: Q3b
  - key: Q4
    question: Which predicted surpluses above USD 20m were not placed in a time deposit? Show the entity, event month, event status and predicted surplus amount.
    answer: Q4
  - key: Q4-jargon
    question: Idle cash - unplaced surpluses over 20m with the entity, event month, status and surplus size
    variant_of: Q4
  - key: Q5
    question: Which industries have March and September inflow peaks? For Apr-2024 to Mar-2026 show each industry's seasonality index in March, in September and its highest index in any other month.
    answer: Q5
  - key: Q5-casual
    question: which industries peak in march and september? seasonality index for march, sept and their best other month, FY2024 to FY2025
    variant_of: Q5
  - key: Q6
    question: From June to September 2026, how many predicted shortfalls were there, how many were followed by an RCF drawdown within 10 days, how much was drawn on those shortfalls and what annual revenue did the actions bring?
    answer: Q6
  - key: Q6-typo
    question: how many predicted shortfals jun-sep 2026, how many got an RCF drawdown within 10 days, the amount drawn and the revenue from actions?
    variant_of: Q6
  - key: Q6b
    question: List the predicted shortfalls from June to September 2026 that were followed by an RCF drawdown within 10 days - entity, event month, predicted shortfall, days to drawdown and amount drawn.
    answer: Q6b
  - key: Q7
    question: Rank the clients in the Red or Amber EWS band today by inflow volatility over Oct-2025 to Sep-2026, for clients averaging at least USD 0.5m of inflows a month - show their band, average monthly inflow, inflow standard deviation and coefficient of variation.
    answer: Q7
  - key: Q7-abbrev
    question: inflow vol ranking, red/amber names today, last 12m, avg inflow >= 0.5m/month - band, avg inflow, stdev, CV
    variant_of: Q7
  - key: Q8
    question: What is the forecast bias by booking country for model v1 versus v2, with the MAPE?
    answer: Q8
  - key: Q8-casual
    question: is the forecast biased in some countries? bias and MAPE by booking country, v1 vs v2
    variant_of: Q8
