# APAC Genie - Transactional Banking: Trade & Supply Chain Finance (brief §5.8, PLAN §8 / §9 / §10). Authored by G3
# (p07g3). Must-answer queries: metrics/_answers/tb_trade_scf.sql. Caveats: scratch/genie_caveats.md §8.
# mv_tb_payments (space 7's view, also_in this space) answers the SCF anchor-candidate question (suppliers paid).
slug: tb_trade_scf
title: "APAC Genie - Transactional Banking: Trade & Supply Chain Finance"
description: >-
  Ask about trade finance issuance and outstanding by product and corridor, supply chain finance programme health,
  trade operations turnaround and document discrepancies, and trade-flow opportunities for SMBC's APAC clients.
  Figures are USD unless you ask for local currency; periods follow the Japanese fiscal year (Apr-Mar). Client
  names roll up to client groups; data is synthetic and as of 30 Sep 2026.

