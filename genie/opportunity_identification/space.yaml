# APAC Genie - Opportunity Identification (brief §5.2, PLAN §8 / §9 / §10). Authored by G1 (p07g1).
# Must-answer queries: metrics/_answers/opportunity_identification.sql. Caveats: scratch/genie_caveats.md §2.
slug: opportunity_identification
title: APAC Genie - Opportunity Identification
description: >-
  Ask about opportunity signals, next-best-product recommendations, the sales pipeline and product penetration vs
  peers for SMBC's APAC clients. Figures are USD unless you ask for local currency; periods follow the Japanese
  fiscal year (Apr-Mar). Client names roll up to client groups; data is synthetic and as of 30 Sep 2026.

