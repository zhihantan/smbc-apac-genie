# APAC Genie - Credit Memo & Financial Spreading (brief §5.3, PLAN §8-§10; format: genie/README.md). Author: G2.
# The quantitative credit memo pack: spread financials, ratios vs peers, facilities, covenants, collateral, current
# exposure and the credit review / spreading workflow. Caveats: scratch/genie_caveats.md §3.
slug: credit_memo_financial_spreading
title: APAC Genie - Credit Memo & Financial Spreading
description: >-
  Ask about spread financials, ratios vs peers, facilities, covenants, collateral and the credit review
  workflow (the credit memo pack) for SMBC's APAC clients. Figures are USD unless you ask for local currency;
  periods follow the Japanese fiscal year (Apr-Mar). Client names roll up to client groups; data is synthetic
  and as of 30 Sep 2026.

