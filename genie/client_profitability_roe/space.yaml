      Subsector: {entity_matching: true}
      Coverage Office: {entity_matching: true}
      Primary RM: {entity_matching: true}
      Primary RM Office: {entity_matching: true, description: "Office (ISO-2) where the primary RM sits - a location, not a person. Filter it for 'RMs in Hong Kong' (= 'HK'); when a question asks for the RM, show `Primary RM`."}
      Product Family: {entity_matching: true}
      Business Line: {entity_matching: true}
      Product Count Bucket: {entity_matching: true}
