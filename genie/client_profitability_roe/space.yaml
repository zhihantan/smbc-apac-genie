# APAC Genie - Client Profitability & ROE (brief §5.5, PLAN §8 / §9 / §10). Authored by G1 (p07g1).
# Must-answer queries: metrics/_answers/client_profitability_roe.sql. Caveats: scratch/genie_caveats.md §5.
slug: client_profitability_roe
title: APAC Genie - Client Profitability & ROE
description: >-
  Ask about relationship profitability, RoRWA, RAROC, ROE waterfalls and deal pricing vs hurdle for SMBC's APAC
  clients. Figures are USD unless you ask for local currency; periods follow the Japanese fiscal year (Apr-Mar).
  Client names roll up to client groups; data is synthetic and as of 30 Sep 2026.

