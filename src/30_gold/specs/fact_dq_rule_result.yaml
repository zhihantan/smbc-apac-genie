table: fact_dq_rule_result
domain: foundation
comment: >-
  Rule-level data-quality results of the DQ run (DQ-20260930, as of 30-Sep-2026): one row per DQ rule
  evaluated on a layer-qualified table (bronze, shared or silver) with the rule definition from the DQ
  catalogue, its dimension, severity, blocking flag and action, rows evaluated / failed, pass rate,
  threshold and status (pass / warn / fail). The drill-down behind fact_dq_score_monthly's latest month - e.g.
  pay_payment_message:key_unique on bronze: 3,966 replayed messages of batch PAY_20260617_R removed by
  de-duplication (storyline 12), silver passes.
grain: one row per DQ run per rule per layer
primary_key: [run_id, rule_id, layer]
foreign_keys:
  - {columns: [run_date], references: dim_date}
cluster_by: [run_date, table_name]
min_rows: 500
columns:
  run_id: {type: STRING, comment: "DQ run id DQ-yyyymmdd (the as-of date it evaluated)."}
  rule_id: {type: STRING, comment: "DQ rule id <table>:<rule>, e.g. pay_payment_message:key_unique, pay_payment_message:x:landing_ties_to_cash_flow."}
  layer: {type: STRING, comment: "Layer the rule was evaluated on: bronze, shared or silver."}
  run_date: {type: DATE, comment: As-of date of the DQ run (from the run id; the grain date).}
  month: {type: DATE, comment: First day of the month of the run (joins fact_dq_score_monthly.month).}
  table_name: {type: STRING, comment: "Layer-qualified table evaluated, e.g. bronze.pay_payment_message."}
  base_table_name: {type: STRING, comment: Table name without the layer.}
  column_name: {type: STRING, comment: "Column(s) the rule checks (comma-separated; * = row / cross-table rule)."}
  dimension: {type: STRING, comment: "DQ dimension: completeness, validity, uniqueness, timeliness or consistency."}
  rule_kind: {type: STRING, comment: "Rule kind, e.g. key_present, key_unique, required, valid_values, parent_exists, golden_key, freshness, cross_table."}
  rule_description: {type: STRING, comment: What the rule checks (DQ catalogue).}
  rule_expr: {type: STRING, comment: Rule expression as documented in the DQ catalogue.}
  rule_origin: {type: STRING, comment: "Where the rule came from: generated (from the table spec) or hand_written (cross-table consistency rule)."}
  rule_grain: {type: STRING, comment: "Grain the rule is evaluated at: row or table."}
  severity: {type: STRING, comment: "Rule severity: error, warn or info."}
  is_blocking: {type: BOOLEAN, comment: True for blocking rules - failing rows are quarantined out of silver.}
  action: {type: STRING, comment: "Action on failure: none, deduplicate (rows removed by business-key de-duplication) or flag (rows kept and flagged)."}
  total_rows: {type: BIGINT, comment: Rows evaluated by the rule.}
  failed_rows: {type: BIGINT, comment: Rows failing the rule (for deduplicate rules = duplicate rows removed).}
  passed_rows: {type: BIGINT, comment: total_rows - failed_rows.}
  deduplicated_rows: {type: BIGINT, comment: Rows removed by de-duplication (failed_rows of deduplicate rules; 0 otherwise).}
  pass_rate: {type: DOUBLE, comment: "Share of rows passing (fraction 0-1)."}
  threshold: {type: DOUBLE, comment: Failure rate tolerated before the rule fails (fraction; 0 = no failure tolerated).}
  status: {type: STRING, comment: "Result: pass, warn or fail."}
  is_failed: {type: BOOLEAN, comment: True when the status is warn or fail (Rules Failed).}
  is_hard_fail: {type: BOOLEAN, comment: True when the status is fail.}
  sample_keys_text: {type: STRING, comment: "Sample keys of failing rows, comma-separated (null when none)."}
  detail: {type: STRING, comment: "Extra detail as JSON text, e.g. {removed_by_batch: {PAY_20260617_R: 3966}}."}
  storyline_no: {type: INT, comment: Demo storyline the rule result belongs to (e.g. 12 = payments replay); null otherwise.}
  is_latest_run: {type: BOOLEAN, comment: True for the latest DQ run.}
checks:
  - name: payments_replay_dedup_rule    # storyline 12: 3,966 replayed messages removed on bronze, silver unique
    sql: >-
      SELECT abs(sum(CASE WHEN layer = 'bronze' THEN deduplicated_rows END) - 3966)
           + sum(CASE WHEN layer = 'silver' THEN failed_rows END) FROM ${table}
      WHERE rule_id = 'pay_payment_message:key_unique'
  - name: every_rule_in_catalogue
    sql: SELECT count_if(rule_description IS NULL) FROM ${table}
reconcile:
  - name: rows_vs_silver
    silver: SELECT count(*) FROM ${catalog}.silver.dq_results
  - name: failed_rows_vs_silver
    gold: SELECT sum(failed_rows) FROM ${table}
    silver: SELECT sum(failed_rows) FROM ${catalog}.silver.dq_results
