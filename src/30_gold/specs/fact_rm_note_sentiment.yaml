table: fact_rm_note_sentiment
domain: signals
comment: >-
  Internal qualitative signal: every RM call note (CRM activity note text, synthetic, at most 40 words) with
  its sentiment score -1..1 (synthetic, D18), the score label (Negative <= -0.2, Positive >= 0.2), the
  ai_analyze_sentiment label stored alongside (D36) and their agreement, keyword-extracted topics, the
  follow-up action status, and the client group's external news sentiment around the note - for the
  internal-vs-external divergence and blind-spot questions. Flow fact: count notes, average the
  sentiment (never sum it).
grain: one row per RM call note (CRM activity)
primary_key: [note_id]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [note_date], references: dim_date}
  - {columns: [employee_id], references: dim_employee}
  - {columns: [contact_id], references: dim_contact}
cluster_by: [note_date, golden_client_sk]
min_rows: 1000
columns:
  note_id: {type: STRING, comment: "Note id = the CRM activity id (ACT-nnnnnnn) the note was written on."}
  note_date: {type: DATE, comment: Date of the RM activity (meeting / call / e-mail / visit) the note records - the grain date.}
  month: {type: DATE, comment: First day of the calendar month of the note.}
  golden_client_sk: BIGINT
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: STRING
  crm_account_id: STRING
  rm_code: {type: STRING, comment: CRM code (RM001-RM120) of the RM who wrote the note.}
  employee_id: {type: STRING, comment: Employee id of the RM who wrote the note; join gold.dim_employee for name and office.}
  contact_id: {type: STRING, comment: Client contact met (CRM contact id); join gold.dim_contact.}
  activity_type: {type: STRING, comment: "Activity type: Meeting, Call, Video Call, Email or Site Visit."}
  purpose: {type: STRING, comment: "Purpose of the activity: Signal Follow-up, Deal Progress, Relationship Review, Product Discussion, Service Review, Market Update, Account Planning, Courtesy Visit or Credit Review."}
  subject: {type: STRING, comment: Activity subject line as recorded in CRM.}
  product_discussed: {type: STRING, comment: "Product discussed, e.g. Cash Pooling, FX Forward Programme (null when none)."}
  product_family: STRING
  note_text: {type: STRING, comment: Synthetic RM note text (at most 40 words; fictional entities only).}
  raw_tone: {type: STRING, comment: "Tone tag the CRM stored with the note: Positive, Neutral or Negative."}
  sentiment_score: {type: DOUBLE, comment: "Note sentiment score -1 (very negative) .. +1 (very positive): template tone plus noise, deterministic (D18). Average it, never sum."}
  sentiment_label: {type: STRING, comment: "Label from the score: Negative (<= -0.2), Positive (>= 0.2) or Neutral - the label used by the flags and signals."}
  ai_sentiment_label: {type: STRING, comment: "Label returned by Databricks ai_analyze_sentiment(note_text) at build time: Positive, Negative, Neutral or Mixed (null if the function returned none). Stored alongside the score (D18 / D36); not used for storyline numbers."}
  ai_label_source: {type: STRING, comment: "Where ai_sentiment_label came from: ai_analyze_sentiment, or not returned (the function gave no label for this note)."}
  ai_agrees_with_score: {type: BOOLEAN, comment: True when the AI label equals the score label (Mixed never agrees); null when no AI label - use for the AI vs synthetic agreement rate.}
  is_negative: {type: BOOLEAN, comment: True when the note sentiment score is <= -0.2.}
  is_positive: {type: BOOLEAN, comment: True when the note sentiment score is >= 0.2.}
  note_topic: {type: STRING, comment: "Primary topic extracted from the note text by keyword rules (first match): Credit & Liquidity, Pricing, Competition, Service Quality, Market & FX, Relationship, New Business, else General."}
  topics_text: {type: STRING, comment: "All topics extracted from the note text, comma-separated in the same order (e.g. Competition, New Business)."}
  action_required: {type: BOOLEAN, comment: True when the note records a follow-up action for the RM.}
  next_action: {type: STRING, comment: "Follow-up action agreed, e.g. Send indicative term sheet (null when none)."}
  next_action_due_date: {type: DATE, comment: Due date of the follow-up action.}
  next_action_status: {type: STRING, comment: "Status of the follow-up action at the as-of date: Completed, Open or Overdue (null when no action)."}
  is_action_open: {type: BOOLEAN, comment: True when the follow-up action is still Open or Overdue at 30-Sep-2026 (Actions Open).}
  is_action_overdue: {type: BOOLEAN, comment: True when the follow-up action is Overdue at 30-Sep-2026.}
  related_signal_id: {type: STRING, comment: "CRM opportunity signal the activity followed up (fact_signal_event.signal_event_id), when any."}
  related_opportunity_id: {type: STRING, comment: "Pipeline opportunity the activity relates to (CRM opportunity id), when any."}
  duration_minutes: {type: INT, comment: Duration of the activity in minutes.}
  days_before_as_of: {type: INT, comment: "Days between the note date and the as-of date 30-Sep-2026; last N days = days_before_as_of < N."}
  is_last_90d: {type: BOOLEAN, comment: True for notes dated in the 90 days to 30-Sep-2026 (3-Jul-2026 .. 30-Sep-2026).}
  group_news_sentiment_90d: {type: DOUBLE, comment: "External context: average sentiment of the client group's news in the 90 days up to the note date (null = no news)."}
  group_news_items_90d: {type: INT, comment: News items on the client group in the 90 days up to the note date.}
  sentiment_divergence: {type: DOUBLE, comment: "Internal minus external sentiment = note sentiment - group news sentiment of the 90 days to the note (positive = the RM is more upbeat than the news); null when no news. Average it."}
  is_blind_spot_note: {type: BOOLEAN, comment: True when the note is Positive (>= 0.2) while the group's news sentiment over the 90 days to the note is Negative (<= -0.2).}
  group_news_sentiment_last_90d: {type: DOUBLE, comment: "Group attribute as of 30-Sep-2026 (same on every row of the group): average news sentiment of the group in the last 90 days (3-Jul .. 30-Sep-2026)."}
  group_news_sentiment_prior_90d: {type: DOUBLE, comment: "Group attribute as of 30-Sep-2026: average news sentiment of the group in the prior 90 days (4-Apr .. 2-Jul-2026)."}
  group_note_sentiment_last_90d: {type: DOUBLE, comment: "Group attribute as of 30-Sep-2026: average RM-note sentiment of the group in the last 90 days."}
  is_blind_spot_group: {type: BOOLEAN, comment: "Blind spot as of 30-Sep-2026: the group's external sentiment turned negative (last-90-day news average <= -0.2 and the prior 90 days not <= -0.2) while its RM notes stayed positive (last-90-day note average >= 0.2). Same on every row of the group; count distinct groups."}
checks:
  - name: ai_labels_returned      # D36: the AI function must have labelled (almost) every note
    sql: SELECT count_if(ai_sentiment_label IS NULL) FROM ${table}
    max: 60
  - name: label_matches_score
    sql: >-
      SELECT count_if((sentiment_label = 'Negative') <> (sentiment_score <= -0.2)
                   OR (sentiment_label = 'Positive') <> (sentiment_score >= 0.2)) FROM ${table}
reconcile:
  - name: rows_vs_silver
    silver: >-
      SELECT count(*) FROM ${catalog}.silver.crm_activity WHERE note_text IS NOT NULL
      AND golden_client_id IS NOT NULL AND activity_date <= DATE'${as_of_date}'
  - name: sentiment_sum_vs_silver
    gold: SELECT round(sum(sentiment_score), 3) FROM ${table}
    silver: >-
      SELECT round(sum(sentiment_score), 3) FROM ${catalog}.silver.crm_activity WHERE note_text IS NOT NULL
      AND golden_client_id IS NOT NULL AND activity_date <= DATE'${as_of_date}'
    tolerance: 0.01
