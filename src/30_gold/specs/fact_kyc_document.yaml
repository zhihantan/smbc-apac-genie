table: fact_kyc_document
domain: onboarding
comment: >-
  KYC / CDD documents requested in onboarding cases (brief 5.6, PLAN 7): one row per document request with
  document type (e.g. Certificate of Incorporation, Board Resolution, UBO Declaration, AML/CTF Questionnaire),
  mandatory flag, requested / received dates, status (Received, Outstanding, Waived, Cancelled), days to
  receive, days outstanding at 30-Sep-2026 and the case context (case status and stage, KYC Docs days, stuck
  in KYC Docs for more than 15 days, booking country, segment, owner). Documents are requested when the case
  enters KYC Docs.
grain: one row per document requested in an onboarding case
primary_key: [document_id]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [requested_date], references: dim_date}
  - {columns: [booking_country], references: dim_booking_entity}
  - {columns: [owner_id], references: dim_employee}
cluster_by: [requested_date, golden_client_sk]
min_rows: 2000
columns:
  document_id: {type: STRING, comment: "Document request id (ONB-nnnnn-Dnn)."}
  case_id: {type: STRING, comment: "Onboarding case (ONB-nnnnn); join to fact_onboarding_case."}
  kyc_id: {type: STRING, comment: "KYC customer record (live cases); null for applicants."}
  golden_client_sk: {type: BIGINT, comment: "dim_client version of the onboarded client at the request date (null for applicants that never went live)."}
  golden_client_id: {type: STRING, comment: "Golden client of the case (null for applicants that never went live)."}
  client_group_id: {type: STRING, comment: "Client group of the case (ER group, else the intake group link)."}
  document_type: {type: STRING, comment: "KYC document type: Certificate of Incorporation, Constitutional Documents, Board Resolution, Register of Directors, UBO Declaration, Authorised Signatory List, Audited Financial Statements, Tax Self-Certification (FATCA/CRS), Banking Licence, AML/CTF Questionnaire, Group Structure Chart or Government Mandate Letter."}
  is_mandatory: {type: BOOLEAN, comment: "True when the document is mandatory for onboarding."}
  requested_date: {type: DATE, comment: "Date the document was requested (KYC Docs stage entry)."}
  received_date: {type: DATE, comment: "Date the document was received; null if not received."}
  status: {type: STRING, comment: "Received, Outstanding (still awaited on an open case), Waived or Cancelled (case closed before receipt)."}
  is_outstanding: {type: BOOLEAN, comment: "True for documents still outstanding at the as-of date."}
  is_received: {type: BOOLEAN, comment: "True for received documents."}
  days_to_receive: {type: INT, comment: "Days from request to receipt (received documents)."}
  days_outstanding: {type: INT, comment: "Days the document has been outstanding at the as-of date (outstanding documents)."}
  case_status: {type: STRING, comment: "Status of the case: Open, Live, Withdrawn or Rejected."}
  case_current_stage: {type: STRING, comment: "Stage the case is in / ended in."}
  case_kyc_docs_days: {type: INT, comment: "Days the case has spent in KYC Docs (to the as-of date if still there)."}
  case_stuck_in_kyc_docs_15d: {type: BOOLEAN, comment: "True when the case is open in KYC Docs for more than 15 days (dim_threshold KYC_DOCS_STUCK_DAYS)."}
  booking_country: {type: STRING, comment: "Booking location of the case (ISO-2)."}
  segment: {type: STRING}
  owner_id: {type: STRING, comment: "Onboarding officer owning the case (employee_id)."}
  request_date: {type: DATE, comment: "Request date of the case."}
checks:
  - name: outstanding_only_on_open_cases
    sql: SELECT count_if(is_outstanding AND case_status <> 'Open') FROM ${table}
reconcile:
  - name: rows_vs_silver
    silver: SELECT count(*) FROM ${catalog}.silver.kyc_document
  - name: outstanding_vs_case_counts
    gold: SELECT count_if(is_outstanding) FROM ${table}
    silver: SELECT sum(documents_outstanding) FROM ${catalog}.silver.kyc_case
