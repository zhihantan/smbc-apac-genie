table: fact_tb_fee_income_monthly
domain: tb
comment: >-
  Monthly transaction-banking fee income per client from Apr-2024 to Sep-2026, by fee type, product and booking
  country (shared by the Cash & Payments and the Trade & SCF spaces). Fee lines booked by the finance engine
  (account maintenance, portal / host-to-host / API channel fees, liquidity-structure fees; local billing currency)
  plus the fees derived in gold from the transactions with the bank's tariff - payment processing (USD 3 per
  payment message), cross-border payment commission (10 bps of cross-border value), trade-finance commissions per
  instrument, and FX margin income (Markets, flagged is_tb_fee = false). Derived lines reconcile with the
  finance engine's client revenue. SCF discount income is not a fee (see fact_scf_programme_drawdown). All
  amounts are monthly flows (additive).
grain: one row per golden client per month per fee type per product per booking country per fee currency
primary_key: [fee_line_id]
foreign_keys:
  - {columns: [fee_month], references: dim_date}
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [booking_country], references: dim_booking_entity}
  - {columns: [product_id], references: dim_product}
  - {columns: [fee_currency], references: dim_currency}
cluster_by: [fee_month, golden_client_sk]
min_rows: 10000
columns:
  fee_line_id: {type: STRING, comment: "Fee line key = golden client | yyyy-MM | fee type | product | booking country | currency."}
  fee_month: {type: DATE, comment: "First day of the month the fee was earned."}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  booking_country: {type: STRING, comment: "Booking location of the fee (ISO-2): the account's / instrument's / deal's booking country; the client's coverage office for account-level fees."}
  fee_type: {type: STRING, comment: "Account Maintenance, Channel - Portal, Channel - Host-to-Host, Channel - API, Liquidity Structure, Payment Processing, Cross-Border Payment Commission, Trade Commission or FX Margin."}
  fee_source: {type: STRING, comment: "Where the line comes from: finance engine fee ledger (silver.fin_tb_fee) or derived from payments / trade instruments / FX deals with the bank tariff."}
  product_id: {type: STRING, comment: "Product earning the fee where identifiable (e.g. PRD-IMPORT-LC, PRD-CROSS-BORDER-PAYMENTS, PRD-FX-SPOT); null for account-level fees (maintenance, portal, liquidity structure)."}
  product_family: {type: STRING, comment: "Cash, Payments, Liquidity, Trade Finance or FX."}
  business_line: {type: STRING, comment: "Transaction Banking (all fee types except FX Margin) or Markets (FX Margin)."}
  is_tb_fee: {type: BOOLEAN, comment: "True for transaction-banking fees (business line Transaction Banking); false for FX margin (Markets). TB fee income = SUM(fee_usd) WHERE is_tb_fee."}
  fee_currency: {type: STRING, comment: "Currency of fee_lcy: the client's billing currency for ledger fees, USD for derived fees."}
  fee_lcy: {type: DOUBLE, comment: "Fee amount in fee_currency (flow)."}
  fee_usd: {type: DOUBLE, comment: "Fee income in USD (flow, additive across months and clients)."}
  activity_count: {type: BIGINT, comment: "Transactions behind derived fees (payments, instruments issued, FX deals); null for ledger fees."}
  activity_volume_usd: {type: DOUBLE, comment: "USD volume behind derived fees (payment value, instrument amount, FX notional; cross-border value for the commission); null for ledger fees. Fee yield bps = 10000 x SUM(fee_usd) / SUM(activity_volume_usd)."}
checks:
  - name: non_negative_fees
    sql: SELECT count_if(fee_usd < 0 OR fee_usd IS NULL) FROM ${table}
reconcile:
  - name: ledger_fees_vs_silver
    gold: SELECT round(sum(fee_usd)) FROM ${table} WHERE fee_source LIKE 'finance engine%'
    silver: SELECT round(sum(fee_amount_usd)) FROM ${catalog}.silver.fin_tb_fee
    tolerance: 1
  - name: trade_commission_vs_silver
    gold: SELECT round(sum(fee_usd)) FROM ${table} WHERE fee_type = 'Trade Commission'
    silver: SELECT round(sum(commission_usd)) FROM ${catalog}.silver.trade_finance_txn WHERE txn_date >= DATE'2024-04-01'
    tolerance: 1
  - name: fx_margin_vs_silver
    gold: SELECT round(sum(fee_usd)) FROM ${table} WHERE fee_type = 'FX Margin'
    silver: SELECT round(sum(revenue_usd)) FROM ${catalog}.silver.tsy_fx_deal WHERE deal_date >= DATE'2024-04-01'
    tolerance: 1
  - name: payment_fees_vs_payment_fact
    gold: SELECT round(sum(fee_usd)) FROM ${table} WHERE fee_type IN ('Payment Processing', 'Cross-Border Payment Commission')
    silver: >-
      SELECT round(sum(3.0 + CASE WHEN is_cross_border THEN amount_usd * 10.0 / 10000.0 ELSE 0.0 END))
      FROM ${catalog}.silver.pay_payment_message WHERE payment_date >= DATE'2024-04-01'
    tolerance: 1
