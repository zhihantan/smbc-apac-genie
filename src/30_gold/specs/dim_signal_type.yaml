table: dim_signal_type
domain: hub
comment: >-
  Catalogue of every signal code in the Customer 360: CRM opportunity signals (e.g. DEPOSIT_SURPLUS,
  FX_FLOW_VIA_OTHER_BANK, TRADE_CORRIDOR_GROWTH, SCF_ANCHOR_CANDIDATE, CAPEX_NEWS), EWS risk triggers
  (e.g. UTIL_HIGH, COV_BREACH, DPD_30) and the derived news, market, rating and RM-note signals of the
  unified signal feed (NEWS_*, MARKET_*, EXT_RATING_*, PARENT_RATING_*, RM_NOTE_*), with polarity,
  source quadrant, source system, the consuming workflow and a default weight.
grain: one row per signal code
primary_key: [signal_code]
cluster_by: [polarity]
min_rows: 30
columns:
  signal_code: {type: STRING, comment: "Signal code (upper snake case), e.g. DEPOSIT_SURPLUS, UTIL_HIGH, NEWS_ESG_CONTROVERSY."}
  signal_name: {type: STRING, comment: Signal name.}
  signal_category: {type: STRING, comment: "Category, e.g. Wallet Leakage, Growth, Liquidity, Credit, News, Market, Rating, Internal Sentiment."}
  polarity: {type: STRING, comment: "Opportunity (positive / sales), Risk (negative / early warning) or Neutral (direction from the item's sentiment)."}
  source_quadrant: {type: STRING, comment: "Data quadrant: Internal Quantitative, Internal Qualitative, External Quantitative or External Qualitative."}
  source_system: {type: STRING, comment: "Producing engine / feed: crm_signal_engine, news_alerts, ews_engine, news_vendor, market_data, rating_agency, jp_share or crm_notes."}
  consumed_by: {type: STRING, comment: "Workflow that acts on it: Opportunity Identification, Early Warning or Both."}
  default_weight: {type: DOUBLE, comment: Default strength / weight 0-1 used when ranking a unified signal feed.}
  description: {type: STRING, comment: How the signal is detected.}
  is_derived_in_gold: {type: BOOLEAN, comment: True for signal types derived in gold from news / market / rating / RM-note data (not emitted by a source engine).}
  signals_recorded: {type: BIGINT, comment: Signals of this code recorded by the source engine to the as-of date (0 for gold-derived codes).}
checks:
  - name: covers_crm_and_ews_codes
    sql: >-
      SELECT count(*) FROM (SELECT DISTINCT signal_code AS c FROM ${catalog}.silver.crm_signal
      UNION SELECT trigger_code FROM ${catalog}.silver.ews_trigger_catalog) s LEFT ANTI JOIN ${table} d ON d.signal_code = s.c
