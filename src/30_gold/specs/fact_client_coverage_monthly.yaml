table: fact_client_coverage_monthly
domain: rm
comment: >-
  RM coverage of every golden client at every month-end (Account Planning, mv_rm_engagement; Apr-2024 to Sep-2026,
  from the month the relationship started): the primary RM and relationship tier in force, activities in the
  month and in the trailing 90 days, distinct contacts met, average note sentiment, the last contact date and
  the touched / not-touched-in-90-days flags. Rows exist for clients with no activity at all, so "Strategic
  clients with no RM contact in the last 90 days" is a filter on the latest month (is_latest_month) and
  is_strategic_not_touched_90d. The 90-day counts are trailing windows: never sum them across months.
grain: one row per golden client x month-end (dense from the relationship start)
primary_key: [golden_client_id, month]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [month], references: dim_date}
  - {columns: [primary_rm_id], references: dim_employee}
cluster_by: [month, golden_client_sk]
min_rows: 50000
columns:
  month: {type: DATE, comment: "First day of the month of the month-end snapshot."}
  month_end_date: {type: DATE, comment: "Month-end the coverage is measured at (90-day windows end here)."}
  fiscal_year: {type: INT}
  fiscal_year_label: {type: STRING}
  fiscal_quarter_label: {type: STRING}
  fiscal_half_label: {type: STRING}
  is_latest_month: {type: BOOLEAN, comment: "True for Sep-2026, the month of the as-of date - use it for today's coverage."}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  primary_rm_id: {type: STRING, comment: "Primary RM (employee_id) of the client at the month-end (dim_client as-was); null when uncovered."}
  primary_rm_code: {type: STRING, comment: "CRM code of the primary RM at the month-end."}
  primary_rm_office: {type: STRING, comment: "Office (APAC booking location) of the primary RM."}
  relationship_tier: {type: STRING, comment: "Relationship tier at the month-end: Strategic, Core or Transactional."}
  is_strategic: {type: BOOLEAN, comment: "True when the client is Strategic tier at the month-end."}
  has_crm_account: {type: BOOLEAN, comment: "True when the client has a CRM account (is covered in the CRM platform)."}
  activities_in_month: {type: BIGINT, comment: "RM activities with the client in the calendar month (additive across months)."}
  in_person_in_month: {type: BIGINT, comment: "Meetings and site visits in the month (additive across months)."}
  activities_90d: {type: BIGINT, comment: "RM activities in the 90 days to the month-end (trailing window)."}
  contacts_touched_90d: {type: BIGINT, comment: "Distinct client contacts met in the 90 days to the month-end."}
  rms_engaged_90d: {type: BIGINT, comment: "Distinct RMs who logged an activity with the client in the 90 days to the month-end."}
  sentiment_sum_90d: {type: DOUBLE, comment: "Sum of note sentiment over the trailing 90 days (with sentiment_count_90d gives a weighted average)."}
  sentiment_count_90d: {type: BIGINT, comment: "Activities with a sentiment score in the trailing 90 days."}
  avg_sentiment_90d: {type: DOUBLE, comment: "Average note sentiment over the trailing 90 days (-1..1); null without activity."}
  last_activity_date: {type: DATE, comment: "Date of the latest RM activity on or before the month-end; null when never contacted."}
  days_since_last_activity: {type: INT, comment: "Days from last_activity_date to the month-end; null when never contacted."}
  is_touched_90d: {type: BOOLEAN, comment: "True when the client had at least one RM activity in the 90 days to the month-end."}
  is_not_touched_90d: {type: BOOLEAN, comment: "True when the client had no RM activity in the 90 days to the month-end (incl. never contacted) - dim_threshold NO_RM_CONTACT_DAYS."}
  is_strategic_not_touched_90d: {type: BOOLEAN, comment: "True for Strategic-tier clients not touched in the 90 days to the month-end - Strategic Clients Not Touched 90D."}
  open_next_actions: {type: BIGINT, comment: "Follow-up actions logged up to the month-end that are still open at the as-of date (meaningful for the latest month)."}
checks:
  - name: dense_at_latest_month
    sql: >-
      SELECT (SELECT count(*) FROM ${catalog}.gold.dim_client WHERE is_current AND (relationship_start_date IS NULL
      OR relationship_start_date <= DATE'${as_of_date}')) - count(*) FROM ${table} WHERE is_latest_month
reconcile:
  - name: activities_vs_silver
    gold: SELECT sum(activities_in_month) FROM ${table}
    silver: SELECT count(*) FROM ${catalog}.silver.crm_activity
