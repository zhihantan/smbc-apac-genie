table: fact_product_holding_monthly
domain: rm
comment: >-
  Relationship footprint (Account Planning, brief 5.1): which products each golden client holds or uses with
  SMBC APAC at every month-end from Apr-2023 to Sep-2026. Held products are deposit accounts (month-end
  balance), credit facilities (drawn and limit), live trade-finance instruments, cash-management structures
  (header or participant) and SCF programmes (anchor); flow products (trade, FX, payments) count as used when
  the client transacted in the trailing 12 months. Rows are dense per client x product from the month of first
  use, so lapsed products stay visible (is_active = false). Balances and limits are point-in-time and 12-month
  volumes are trailing windows: never sum them across months - take the latest month (or one month). Client-
  month attributes (products held, deposit-only, single-product lending, peer median) repeat on every product
  row of the client-month: count them on is_client_month_primary_row only.
grain: one row per golden client x product x month (dense from the first month of use to Sep-2026)
primary_key: [golden_client_id, product_id, month]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [month], references: dim_date}
  - {columns: [product_id], references: dim_product}
  - {columns: [booking_country], references: dim_booking_entity}
  - {columns: [peer_group_id], references: dim_peer_group}
cluster_by: [month, golden_client_sk]
min_rows: 100000
columns:
  month: {type: DATE, comment: "First day of the month of the month-end snapshot (Apr-2023 to Sep-2026)."}
  month_end_date: {type: DATE, comment: "Month-end date the holding is observed at."}
  fiscal_year: {type: INT}
  fiscal_year_label: {type: STRING}
  fiscal_quarter_label: {type: STRING}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  booking_country: {type: STRING, comment: "APAC booking location of the client relationship (the client's coverage office at the month-end, ISO-2, e.g. SG); join to gold.dim_booking_entity."}
  product_id: {type: STRING}
  product_name: {type: STRING, comment: "Product name (gold.dim_product.product_name), e.g. Current Account, Term Loan, Import LC, FX Forward, Notional Pooling."}
  product_family: {type: STRING}
  business_line: {type: STRING}
  is_active: {type: BOOLEAN, comment: "True when the client holds the product at the month-end or used it in the trailing 12 months - the products-held definition."}
  is_held_at_month_end: {type: BOOLEAN, comment: "True when the product is held at the month-end (open account with a balance record, live facility, live trade instrument, structure membership or SCF programme); false for flow-only usage."}
  is_lapsed: {type: BOOLEAN, comment: "True when the client used the product before but neither holds it nor used it in the trailing 12 months (= NOT is_active)."}
  holding_basis: {type: STRING, comment: "How the holding is evidenced: Account balance, Facility limit, Live instrument, Structure membership, Programme or 12M usage (flow products only)."}
  balance_usd: {type: DOUBLE, comment: "Month-end balance in USD: deposit balance for accounts, drawn amount for facilities, face value of live trade instruments; null for structures, programmes and flow-only usage. Point-in-time - do not sum across months."}
  limit_usd: {type: DOUBLE, comment: "Committed limit in USD at the month-end (credit facilities, SCF programme limit); null otherwise. Point-in-time."}
  deposit_balance_usd: {type: DOUBLE, comment: "Month-end deposit balance in USD (deposit products only, else 0) - Deposits USD in the footprint. Point-in-time."}
  lending_drawn_usd: {type: DOUBLE, comment: "Month-end drawn amount of credit facilities in USD (facility products only, else 0) - Lending Drawn USD. Point-in-time."}
  volume_month_usd: {type: DOUBLE, comment: "Transaction value in the month in USD (trade issuance, FX notional, payment value); 0 for balance products. Additive across months."}
  txn_count_month: {type: BIGINT, comment: "Transactions in the month (trade instruments issued, FX deals, payments); additive across months."}
  volume_12m_usd: {type: DOUBLE, comment: "Transaction value over the trailing 12 months to the month-end in USD (flow products; history starts Apr-2023 for trade and Apr-2024 for FX and payments). Trailing window - do not sum across months."}
  txn_count_12m: {type: BIGINT, comment: "Transactions over the trailing 12 months to the month-end. Trailing window - do not sum across months."}
  tb_volume_12m_usd: {type: DOUBLE, comment: "Trailing 12-month transaction-banking volume in USD (payments and trade finance products, else 0) - TB Volume 12M USD."}
  fx_notional_12m_usd: {type: DOUBLE, comment: "Trailing 12-month FX notional in USD (FX products, else 0) - FX Notional 12M USD."}
  n_instruments: {type: BIGINT, comment: "Accounts, facilities, live trade instruments, structures or programmes behind the holding at the month-end (0 for flow-only usage)."}
  first_use_date: {type: DATE, comment: "First time the client used the product with SMBC (account opening, facility origination, first transaction or structure start; may predate Apr-2023)."}
  last_use_date: {type: DATE, comment: "Latest use up to the month-end: the month-end itself when held, else the last transaction or holding date."}
  months_since_last_use: {type: INT, comment: "Whole months from last_use_date to the month-end (0 when held at the month-end)."}
  is_family_primary_row: {type: BOOLEAN, comment: "True on one row per client x product family x month (the family's largest holding) - the row that carries revenue_12m_usd."}
  revenue_12m_usd: {type: DOUBLE, comment: "Trailing 12-month revenue of the whole product family in USD (product feeds, history from Apr-2024), carried only on is_family_primary_row (null elsewhere) - family-level, not per product."}
  is_client_month_primary_row: {type: BOOLEAN, comment: "True on exactly one row per client x month - filter on it to count clients or average client-month attributes (products held, flags) without double counting."}
  products_held_count: {type: BIGINT, comment: "Products the client holds or used in the trailing 12 months at this month-end (client-month value, repeated on every row of the client-month)."}
  product_families_held_count: {type: BIGINT, comment: "Product families among the active products (client-month value)."}
  holds_deposits: {type: BOOLEAN, comment: "Client-month flag: holds at least one deposit product (current, savings, time deposit, money market)."}
  holds_lending: {type: BOOLEAN, comment: "Client-month flag: holds a live credit facility at the month-end."}
  holds_tb_services: {type: BOOLEAN, comment: "Client-month flag: uses transaction-banking services beyond deposits (payments, trade finance, cash-management structures, SCF)."}
  holds_fx: {type: BOOLEAN, comment: "Client-month flag: used FX products in the trailing 12 months."}
  holds_trade_finance: {type: BOOLEAN, comment: "Client-month flag: holds or used trade-finance products."}
  is_deposit_only: {type: BOOLEAN, comment: "Client-month flag: every active product is a deposit product (the entity holds nothing but deposits)."}
  is_single_product_lending: {type: BOOLEAN, comment: "Client-month flag: every active product is a credit facility (loans only - no deposits, payments, trade, FX or cash management)."}
  peer_group_id: {type: STRING}
  peer_median_products_held: {type: DOUBLE, comment: "Median products held in the month by clients of the same peer group (industry subsector) holding at least one product."}
  products_held_vs_peer_median: {type: DOUBLE, comment: "products_held_count - peer_median_products_held (negative = fewer products than the typical peer)."}
checks:
  - name: one_primary_row_per_client_month
    sql: >-
      SELECT count(*) FROM (SELECT golden_client_id, month FROM ${table} GROUP BY 1, 2
      HAVING count_if(is_client_month_primary_row) <> 1)
  - name: one_family_primary_row
    sql: >-
      SELECT count(*) FROM (SELECT golden_client_id, month, product_family FROM ${table} GROUP BY 1, 2, 3
      HAVING count_if(is_family_primary_row) <> 1)
  - name: deposits_tie_to_silver_at_as_of
    sql: >-
      SELECT abs((SELECT sum(deposit_balance_usd) FROM ${table} WHERE month_end_date = DATE'${as_of_date}')
      - (SELECT sum(balance_usd) FROM ${catalog}.silver.core_deposit_balance_monthly WHERE balance_date = DATE'${as_of_date}'))
    max: 1
  - name: drawn_ties_to_silver_at_as_of
    sql: >-
      SELECT abs((SELECT sum(lending_drawn_usd) FROM ${table} WHERE month_end_date = DATE'${as_of_date}')
      - (SELECT sum(drawn_usd) FROM ${catalog}.silver.core_facility_balance_monthly WHERE balance_date = DATE'${as_of_date}'))
    max: 1
  - name: deposit_only_flag_consistent
    sql: SELECT count_if(is_deposit_only AND (holds_lending OR holds_fx OR holds_tb_services)) FROM ${table}
reconcile:
  - name: fx_notional_vs_silver
    gold: SELECT sum(volume_month_usd) FROM ${table} WHERE product_family = 'FX'
    silver: SELECT sum(notional_usd) FROM ${catalog}.silver.tsy_fx_deal
    tolerance: 1
  - name: payment_count_vs_silver
    gold: SELECT sum(txn_count_month) FROM ${table} WHERE product_family = 'Payments'
    silver: SELECT count(*) FROM ${catalog}.silver.pay_payment_message
