table: fact_rating_migration
domain: ews
comment: >-
  Internal rating actions and migrations (brief 5.4), Apr-2023 to Sep-2026: one row per rating event of a
  credit obligor - Initial, Affirm, Upgrade or Downgrade - with grade from -> to (1 best .. 10 default),
  notches (positive = worse), IFRS 9 stage from -> to, migration flags (downgrade, upgrade, stage change,
  Stage 3 entry), notches vs origination, reason, rating model, approver, the linked credit review and the EWS
  triggers that fired in the 90 days before the action. Sunda's 12-Jun-2026 downgrade 7 -> 9 into Stage 3 is
  here. Count downgrades with is_downgrade; rating actions are events (additive counts).
grain: one row per internal rating event
primary_key: [rating_event_id]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [effective_date], references: dim_date}
  - {columns: [approver_id], references: dim_employee}
cluster_by: [effective_date, golden_client_sk]
min_rows: 2000
columns:
  rating_event_id: {type: STRING, comment: "Rating event id (RTG-nnnnnn)."}
  obligor_id: {type: STRING, comment: "Credit obligor record rated."}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  effective_date: {type: DATE, comment: "Date the rating action took effect."}
  rating_action: {type: STRING, comment: "Initial (first rating), Affirm, Upgrade or Downgrade."}
  grade_from: {type: INT, comment: "Internal grade before the action (1 best .. 10 default); null for Initial."}
  grade_to: {type: INT, comment: "Internal grade after the action (1-10)."}
  notch_change: {type: INT, comment: "Notches moved: grade_to - grade_from (positive = downgrade / worse, negative = upgrade)."}
  rating_equivalent_to: {type: STRING, comment: "External-scale equivalent of the new grade (e.g. BB-, CCC)."}
  stage_from: {type: INT, comment: "IFRS 9 stage before the action (1, 2, 3); null for Initial."}
  stage_to: {type: INT, comment: "IFRS 9 stage after the action: 1 performing, 2 significant deterioration, 3 credit-impaired / default."}
  grade_migration: {type: STRING, comment: "Grade move as text, e.g. 7 -> 9."}
  stage_migration: {type: STRING, comment: "Stage move as text, e.g. Stage 2 -> Stage 3."}
  is_downgrade: {type: BOOLEAN, comment: "True for downgrades (grade worsened)."}
  is_upgrade: {type: BOOLEAN, comment: "True for upgrades (grade improved)."}
  is_stage_change: {type: BOOLEAN, comment: "True when the IFRS 9 stage changed."}
  is_stage3_entry: {type: BOOLEAN, comment: "True when the client moved into Stage 3 (default) from Stage 1 or 2."}
  is_stage_deterioration: {type: BOOLEAN, comment: "True when the IFRS 9 stage worsened (1 -> 2, 2 -> 3, 1 -> 3)."}
  origination_grade: {type: INT, comment: "Grade at origination of the relationship (reference for significant deterioration)."}
  notches_vs_origination: {type: INT, comment: "grade_to - origination_grade (positive = worse than at origination; >= 3 notches indicates Stage 2)."}
  action_reason: {type: STRING, comment: "Reason recorded for the rating action, e.g. Annual review, Unlikely to pay: missed RCF payment and covenant breach."}
  rating_model: {type: STRING, comment: "Rating model / scorecard used."}
  approver_id: {type: STRING, comment: "Credit approver (employee_id) who approved the rating; join to gold.dim_employee."}
  review_id: {type: STRING, comment: "Credit review (CRV-...) that produced the rating action; see fact_credit_review_workflow.workflow_item_id."}
  n_triggers_prior_90d: {type: INT, comment: "Distinct EWS triggers that fired for the client in the 90 days before the action (month-end evaluations)."}
  triggers_prior_90d: {type: STRING, comment: "Those triggers as a comma-separated list, e.g. COV_BREACH, DPD_30, UTIL_HIGH."}
checks:
  - name: storyline1_sunda_june_downgrade_7_to_9_stage3
    sql: >-
      SELECT abs(count(*) - 1) FROM ${table} r JOIN ${catalog}.gold.dim_client d ON d.golden_client_sk = r.golden_client_sk
      WHERE d.display_name LIKE 'Sunda Energi Nusantara (Jakarta)%' AND r.effective_date BETWEEN DATE'2026-06-01' AND DATE'2026-06-30'
      AND r.grade_from = 7 AND r.grade_to = 9 AND r.stage_to = 3
reconcile:
  - name: rows_vs_silver_in_window
    silver: >-
      SELECT count(*) FROM ${catalog}.silver.core_rating_history
      WHERE effective_date BETWEEN DATE'${history_start}' AND DATE'${as_of_date}'
