table: fact_fx_deal
domain: tb
comment: >-
  One row per client FX deal booked with SMBC APAC treasury from 1-Apr-2024 to 30-Sep-2026: product (FX spot,
  forward, swap), currency pair, direction, USD notional, margin and revenue, hedge vs trading purpose, tenor and
  value date, booking location. Notional and revenue are flows (additive). FX flows that clients route through
  other banks are visible in fact_payment_transaction (FX_FLOW_VIA_OTHER_BANK signals).
grain: one row per FX deal (deal_id)
primary_key: [deal_id]
foreign_keys:
  - {columns: [deal_date], references: dim_date}
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [product_id], references: dim_product}
  - {columns: [booking_country], references: dim_booking_entity}
  - {columns: [non_usd_currency], references: dim_currency}
cluster_by: [deal_date, golden_client_sk]
min_rows: 10000
columns:
  deal_id: {type: STRING, comment: "Treasury FX deal id."}
  deal_date: {type: DATE, comment: "Trade date of the deal."}
  month: {type: DATE, comment: "First day of the month of deal_date."}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  cpty_id: {type: STRING, comment: "Treasury counterparty id (source identity record) of the client."}
  product_type: {type: STRING, comment: "FX Spot, FX Forward or FX Swap."}
  product_id: {type: STRING, comment: "PRD-FX-SPOT, PRD-FX-FORWARD or PRD-FX-SWAP; join gold.dim_product."}
  ccy_pair: {type: STRING, comment: "Currency pair in market convention, e.g. USD/SGD, AUD/USD."}
  base_currency: {type: STRING, comment: "Base (first) currency of the pair."}
  quote_currency: {type: STRING, comment: "Quote (second) currency of the pair."}
  non_usd_currency: {type: STRING, comment: "The non-USD leg of the pair (every pair is against USD), e.g. SGD for USD/SGD."}
  direction: {type: STRING, comment: "Client Buys USD or Client Sells USD."}
  notional_usd: {type: DOUBLE, comment: "Deal notional in USD (flow)."}
  margin_bps: {type: DOUBLE, comment: "Client margin over the market rate in basis points of notional."}
  revenue_usd: {type: DOUBLE, comment: "FX revenue (margin income) of the deal in USD (flow) - the FX line of client revenue."}
  hedge_type: {type: STRING, comment: "Hedge (hedging a commercial exposure) or Trading."}
  is_hedge: {type: BOOLEAN, comment: "True for hedging deals."}
  tenor_days: {type: INT, comment: "Days from trade date to value date (2 for spot)."}
  tenor_bucket: {type: STRING, comment: "Spot (T+2), Up to 1 month, 1-3 months, 3-6 months or Over 6 months."}
  value_date: {type: DATE, comment: "Settlement (value) date of the deal (forwards may settle after the as-of date)."}
  is_unsettled_at_as_of: {type: BOOLEAN, comment: "True when the value date is after 30-Sep-2026 (open forward / swap position)."}
  booking_country: {type: STRING, comment: "APAC treasury booking location of the deal (ISO-2)."}
reconcile:
  - name: rows_vs_silver
    silver: SELECT count(*) FROM ${catalog}.silver.tsy_fx_deal
  - name: revenue_vs_silver
    gold: SELECT round(sum(revenue_usd)) FROM ${table}
    silver: SELECT round(sum(revenue_usd)) FROM ${catalog}.silver.tsy_fx_deal
    tolerance: 1
