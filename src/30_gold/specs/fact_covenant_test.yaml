table: fact_covenant_test
domain: credit
comment: >-
  Financial covenant tests (brief 5.3 / 5.4): one row per facility x covenant (Net Debt/EBITDA leverage
  maximum, ICR interest-cover minimum) x test date from FY2023 (quarterly tests plus annual tests on the
  spread, e.g. Sunda's FY2025 test on 15-May-2026), with threshold, actual, headroom %, headroom bucket,
  breach / waiver flags, the previous test and the facility balance at the test month-end. is_latest_test
  marks the latest test of each facility covenant on or before 30-Sep-2026 - filter on it for 'at the latest
  test' questions (e.g. clients breaching or within 10% headroom on a leverage covenant). Headroom is a
  fraction: (threshold - actual) / threshold for maximum covenants, (actual - threshold) / threshold for
  minimum covenants; negative = breached.
grain: one row per facility x covenant type x test date
primary_key: [facility_id, covenant_type, test_date]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [test_date], references: dim_date}
cluster_by: [test_date, golden_client_sk]
min_rows: 7000
columns:
  facility_id: {type: STRING, comment: "Credit facility id (FAC-nnnnnn) carrying the covenant; join to fact_facility_terms."}
  covenant_type: {type: STRING, comment: "Covenant: Net Debt/EBITDA (leverage, a maximum) or ICR (interest cover, a minimum)."}
  test_date: {type: DATE, comment: "Covenant test date (quarter-end for quarterly tests; the spread date for annual tests)."}
  obligor_id: {type: STRING, comment: "Credit-system obligor id (CRD-nnnnnn) of the borrower."}
  golden_client_sk: {type: BIGINT}
  golden_client_id: {type: STRING, not_null: true}
  client_group_id: {type: STRING}
  test_basis: {type: STRING, comment: "Basis of the test: Quarterly (management accounts) or FY<year> Annual (audited annual spread, e.g. FY2025 Annual)."}
  covenant_category: {type: STRING, comment: "Covenant family: Leverage (Net Debt/EBITDA) or Interest Cover (ICR)."}
  covenant_direction: {type: STRING, comment: "Maximum (actual must stay at or below the threshold, e.g. leverage 4.0x) or Minimum (actual must stay at or above, e.g. ICR 2.5x)."}
  threshold: {type: DOUBLE, comment: "Covenant level in the ratio's unit (x), e.g. 4.0 for Net Debt/EBITDA <= 4.0x."}
  actual: {type: DOUBLE, comment: "Tested ratio value (x), e.g. 4.6 for Net Debt/EBITDA of 4.6x."}
  headroom_pct: {type: DOUBLE, comment: "Covenant headroom as a fraction of the threshold (0.08 = 8% headroom; negative = breached)."}
  headroom_bucket: {type: STRING, comment: "Headroom band: Breached, 0-10% (tight), 10-20%, 20-30% or 30%+."}
  is_breached: {type: BOOLEAN, comment: "True when the test breached the covenant."}
  is_tight_headroom: {type: BOOLEAN, comment: "True when not breached and headroom is below the 10% warning level (0 <= headroom < 0.10, dim_threshold COVENANT_HEADROOM_WARN)."}
  is_waived: {type: BOOLEAN, comment: "True when a waiver was granted for the test."}
  is_latest_test: {type: BOOLEAN, comment: "True for the latest test of this facility covenant on or before the as-of date 30-Sep-2026 (one per facility x covenant)."}
  prior_test_date: {type: DATE, comment: "Date of the previous test of the same facility covenant."}
  prior_actual: {type: DOUBLE, comment: "Actual at the previous test (x)."}
  actual_change_vs_prior: {type: DOUBLE, comment: "actual - prior_actual (x); positive = the ratio rose since the previous test."}
  prior_headroom_pct: {type: DOUBLE, comment: "Headroom at the previous test (fraction)."}
  test_fiscal_year: {type: INT, comment: "Japanese fiscal year of the test date (FY2026 = Apr 2026 - Mar 2027)."}
  test_fiscal_quarter_label: {type: STRING, comment: "Japanese fiscal quarter of the test date, e.g. FY2026-Q2."}
  is_current_fy_test: {type: BOOLEAN, comment: "True for tests in the current fiscal year (FY2026, from 1-Apr-2026)."}
  facility_type: {type: STRING, comment: "Facility type of the tested facility (e.g. Term Loan, Revolving Credit Facility)."}
  facility_status: {type: STRING, comment: "Current facility status: Active, Matured or Prepaid."}
  is_facility_active: {type: BOOLEAN, comment: "True when the facility is active at the as-of date."}
  drawn_usd_at_test: {type: DOUBLE, comment: "Facility drawn balance at the test month-end, USD (the exposure the test relates to)."}
  limit_usd_at_test: {type: DOUBLE, comment: "Facility limit at the test month-end, USD."}
  client_on_watchlist_as_of: {type: BOOLEAN, comment: "True when the client is on the credit watchlist at the as-of date 30-Sep-2026 (today's status, for 'tight covenant but not on the watchlist')."}
checks:
  - name: one_latest_test_per_facility_covenant
    sql: >-
      SELECT count(*) FROM (SELECT facility_id, covenant_type FROM ${table} GROUP BY facility_id, covenant_type
      HAVING count_if(is_latest_test) > 1)
  - name: latest_flag_matches_silver
    sql: >-
      SELECT count(*) FROM ${table} g JOIN ${catalog}.silver.credit_covenant_test s
      ON s.facility_id = g.facility_id AND s.covenant_type = g.covenant_type AND s.test_date = g.test_date
      WHERE s.is_latest_test <> g.is_latest_test
  - name: storyline11_tight_leverage_clients_is_5
    sql: >-
      SELECT abs(count(DISTINCT golden_client_id) - 5) FROM ${table}
      WHERE is_latest_test AND covenant_type = 'Net Debt/EBITDA' AND is_tight_headroom
  - name: storyline11_leverage_breach_clients_is_1
    sql: >-
      SELECT abs(count(DISTINCT golden_client_id) - 1) FROM ${table}
      WHERE is_latest_test AND covenant_type = 'Net Debt/EBITDA' AND is_breached
reconcile:
  - name: rows_vs_silver_in_window
    silver: >-
      SELECT count(*) FROM ${catalog}.silver.credit_covenant_test
      WHERE test_date BETWEEN DATE'${history_start}' AND DATE'${as_of_date}'
