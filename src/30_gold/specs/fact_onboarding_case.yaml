table: fact_onboarding_case
domain: onboarding
comment: >-
  Client onboarding cases (brief 5.6), Apr-2024 to Sep-2026: one row per onboarding request with booking
  country, segment, products requested, current stage and status (Open, Live, Withdrawn, Rejected), blocker,
  documents outstanding, owner and RM, the group match (match_timing At Intake / After Account Opening / New
  Group), go-live date (end of Account Open) and days to live, first transaction and its lag after go-live
  (transacted_within_60d), SLA position (over SLA now for open cases), the KYC-migration period of the request
  (storyline 7: Feb-2026 workflow migration) and the post-live survey score. Live cases are new clients and
  carry their golden client; applicants that never went live have no golden client (golden_client_id null;
  applicant_id identifies them). Medians of days_to_live use live cases only.
grain: one row per onboarding case
primary_key: [case_id]
foreign_keys:
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [request_date], references: dim_date}
  - {columns: [booking_country], references: dim_booking_entity}
  - {columns: [primary_product_id], references: dim_product}
  - {columns: [current_stage_no], references: dim_onboarding_stage}
  - {columns: [owner_id], references: dim_employee}
  - {columns: [rm_employee_id], references: dim_employee}
cluster_by: [request_date, golden_client_sk]
min_rows: 300
columns:
  case_id: {type: STRING, comment: "Onboarding case id (ONB-nnnnn)."}
  applicant_id: {type: STRING, comment: "Applicant id of the request (APP-nnnnn) - the provisional id before a golden client exists."}
  kyc_id: {type: STRING, comment: "KYC customer record created at go-live (KYC-...); null for applicants that never went live."}
  golden_client_sk: {type: BIGINT, comment: "dim_client version of the new client valid at the request date (live cases; null for applicants without a golden client)."}
  golden_client_id: {type: STRING, comment: "Golden client of the onboarded entity (live cases); null for applicants that never went live."}
  client_group_id: {type: STRING, comment: "Client group of the onboarded client (entity resolution), else the group the applicant was linked to at intake; null when no group identified."}
  applicant_name: {type: STRING, comment: "Legal name of the applicant entity as requested (fictional)."}
  booking_country: {type: STRING, comment: "SMBC booking location of the request (ISO-2, e.g. SG, HK); join to gold.dim_booking_entity."}
  segment: {type: STRING}
  products_requested: {type: STRING, comment: "Products requested, '; '-separated (e.g. Current Account; Payments; Time Deposit)."}
  n_products_requested: {type: INT, comment: "Number of products requested."}
  primary_product: {type: STRING, comment: "First / anchor product requested: Current Account (corporates) or Correspondent Account (financial institutions)."}
  primary_product_id: {type: STRING, comment: "Product key of the primary product; join to gold.dim_product."}
  request_date: {type: DATE, comment: "Date the RM submitted the onboarding request (grain date)."}
  request_fiscal_year: {type: INT, comment: "Japanese fiscal year of the request (FY2026 = Apr 2026 - Mar 2027)."}
  request_fiscal_year_label: {type: STRING, comment: "Fiscal year label of the request, e.g. FY2026."}
  kyc_migration_period: {type: STRING, comment: "Request period vs the Feb-2026 KYC workflow migration: Pre-migration (before Feb-2026), Migration (Feb-2026), Backlog peak (Mar-May 2026), Recovery (from Jun-2026)."}
  is_after_kyc_migration: {type: BOOLEAN, comment: "True for requests made on or after 1-Feb-2026 (the KYC workflow migration)."}
  current_stage: {type: STRING, comment: "Stage the case is in or ended in: Request, KYC Docs, Screening, Risk Assessment, Credit/Product Approval, Account Open, First Transaction, or Complete (live and transacted)."}
  current_stage_no: {type: INT, comment: "Stage number 1-7 of current_stage (null for Complete); join to gold.dim_onboarding_stage."}
  status: {type: STRING, comment: "Case status: Open (in progress), Live (accounts opened), Withdrawn or Rejected."}
  status_date: {type: DATE, comment: "Date the status was reached (go-live date for Live; closure date for Withdrawn / Rejected; null while open)."}
  is_open: {type: BOOLEAN, comment: "True for open cases (in progress at the as-of date)."}
  is_live: {type: BOOLEAN, comment: "True for cases that went live (client onboarded)."}
  is_withdrawn: {type: BOOLEAN, comment: "True for withdrawn cases."}
  is_rejected: {type: BOOLEAN, comment: "True for rejected cases."}
  blocker_reason: {type: STRING, comment: "Why an open case is stuck (e.g. awaiting documents, KYC workflow migration backlog); null otherwise."}
  outcome_reason: {type: STRING, comment: "Reason for a withdrawal or rejection."}
  documents_outstanding: {type: INT, comment: "KYC documents still outstanding on the case at the as-of date."}
  owner_id: {type: STRING, comment: "Onboarding officer owning the case (employee_id); join to gold.dim_employee."}
  rm_code: {type: STRING, comment: "CRM code of the RM who requested the onboarding (RM001-RM120)."}
  rm_employee_id: {type: STRING, comment: "Requesting RM as employee_id; join to gold.dim_employee."}
  intake_group_match: {type: BOOLEAN, comment: "True when the request was linked to an existing client group at intake."}
  intake_group_ref: {type: STRING, comment: "Client group the request was linked to at intake (null when not matched)."}
  match_timing: {type: STRING, comment: "When the new entity was matched to an existing client group: At Intake, After Account Opening (found later by entity resolution) or New Group (no existing group identified)."}
  matched_existing_group: {type: BOOLEAN, comment: "True when the case belongs to an existing client group (match_timing At Intake or After Account Opening)."}
  go_live_date: {type: DATE, comment: "Go-live date = end of the Account Open stage (first account open); null when not live."}
  go_live_fiscal_year: {type: INT, comment: "Japanese fiscal year of the go-live (e.g. 2026 = onboarded in FY2026)."}
  days_to_live: {type: INT, comment: "Calendar days from request to go-live (live cases only) - use MEDIAN / P90 over live cases."}
  is_over_sla_to_live: {type: BOOLEAN, comment: "True when days_to_live exceeds the cumulative SLA of stages 1-6 (request to account open)."}
  first_transaction_date: {type: DATE, comment: "Date of the client's first transaction (end of the First Transaction stage); null when not yet transacted."}
  first_transaction_lag_days: {type: INT, comment: "Days from go-live to the first transaction (activation lag); null when not yet transacted."}
  transacted_within_60d: {type: BOOLEAN, comment: "Live cases: true when the first transaction came within 60 days of go-live (dim_threshold FIRST_TRANSACTION_DAYS); false = slow or not yet activated; null for cases not live."}
  days_open: {type: INT, comment: "Open cases: days since the request at the as-of date."}
  days_in_current_stage: {type: INT, comment: "Open cases: days spent so far in the current stage."}
  current_stage_sla_days: {type: INT, comment: "Open cases: SLA days of the current stage."}
  is_over_sla: {type: BOOLEAN, comment: "True for open cases whose current stage has run longer than its SLA (over SLA right now)."}
  kyc_docs_days: {type: INT, comment: "Days the case spent in the KYC Docs stage (to the as-of date if still there)."}
  is_stuck_in_kyc_docs_15d: {type: BOOLEAN, comment: "True for open cases in the KYC Docs stage for more than 15 days (dim_threshold KYC_DOCS_STUCK_DAYS)."}
  n_stages_over_sla: {type: INT, comment: "Stages of the case that ran over their SLA."}
  n_stages_entered: {type: INT, comment: "Stages the case has entered (1-7)."}
  satisfaction_score: {type: INT, comment: "Post-onboarding survey score 1-5 (5 = very satisfied); null when no response."}
  feedback_theme: {type: STRING, comment: "Theme of the survey comment, e.g. Turnaround Time, Relationship Manager, Document Requests."}
checks:
  - name: storyline3_meridian_th_after_account_opening
    sql: >-
      SELECT abs(count(*) - 1) FROM ${table} WHERE client_group_id = 'SYN-G-0005' AND booking_country = 'TH'
      AND match_timing = 'After Account Opening'
  - name: storyline7_median_days_to_live_before_19_23
    sql: >-
      SELECT CASE WHEN percentile(days_to_live, 0.5) BETWEEN 19 AND 23 THEN 0 ELSE 1 END FROM ${table}
      WHERE is_live AND request_date < DATE'2026-02-01'
  - name: storyline7_median_days_to_live_peak_36_40
    sql: >-
      SELECT CASE WHEN percentile(days_to_live, 0.5) BETWEEN 36 AND 40 THEN 0 ELSE 1 END FROM ${table}
      WHERE is_live AND request_date BETWEEN DATE'2026-03-01' AND DATE'2026-05-31'
  - name: live_cases_have_golden_client
    sql: SELECT count_if(is_live AND (golden_client_id IS NULL OR go_live_date IS NULL)) FROM ${table}
  - name: slow_activation_tail_exists   # D43: ~20% of new clients transact after more than 60 days
    sql: >-
      SELECT CASE WHEN avg(CASE WHEN transacted_within_60d THEN 0.0 ELSE 1.0 END) BETWEEN 0.10 AND 0.30 THEN 0 ELSE 1 END
      FROM ${table} WHERE is_live
reconcile:
  - name: rows_vs_silver
    silver: SELECT count(*) FROM ${catalog}.silver.kyc_case
  - name: live_vs_silver
    gold: SELECT count_if(is_live) FROM ${table}
    silver: SELECT count(*) FROM ${catalog}.silver.kyc_case WHERE status = 'Live'
