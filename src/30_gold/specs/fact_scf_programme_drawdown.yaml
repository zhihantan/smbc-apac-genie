table: fact_scf_programme_drawdown
domain: trade
comment: >-
  Supply-chain-finance invoices from Apr-2024: one row per approved supplier invoice uploaded to an SCF programme
  (payables / receivables finance) with the anchor buyer (golden client), the supplier (name, country, onboarding,
  whether it banks elsewhere, spend segment), invoice / approval / due dates, invoice amount, and - when the supplier
  drew down (is_financed) - the financing date, financed amount, advance rate, discount rate, days financed,
  discount (financing income) and net proceeds. Amounts are flows by their dates (additive). Yield bps =
  10000 x SUM(discount_amount_usd) / SUM(financed_usd_days / 365). Suppliers are not bank clients (no golden id);
  golden_client_* is the anchor.
grain: one row per SCF invoice (invoice_id)
primary_key: [invoice_id]
foreign_keys:
  - {columns: [programme_id], references: dim_scf_programme}
  - {columns: [invoice_date], references: dim_date}
  - {columns: [golden_client_sk], references: dim_client}
  - {columns: [client_group_id], references: dim_client_group}
  - {columns: [product_id], references: dim_product}
  - {columns: [anchor_country], references: dim_booking_entity}
  - {columns: [supplier_country], references: dim_country}
cluster_by: [invoice_date, golden_client_sk]
min_rows: 10000
columns:
  invoice_id: {type: STRING, comment: "SCF invoice id."}
  programme_id: {type: STRING, comment: "SCF programme id; join gold.dim_scf_programme."}
  programme_type: {type: STRING, comment: "Payables Finance (buyer-led) or Receivables Finance (seller-led)."}
  product_id: {type: STRING, comment: "PRD-PAYABLES-FINANCE or PRD-RECEIVABLES-FINANCE; join gold.dim_product."}
  golden_client_sk: {type: BIGINT, comment: "dim_client version of the anchor valid on the invoice date (as-was, D11)."}
  golden_client_id: {type: STRING, not_null: true, comment: "Golden client id of the programme anchor (buyer for payables finance)."}
  client_group_id: {type: STRING}
  anchor_party_id: {type: STRING, comment: "Trade-platform party id of the anchor."}
  anchor_country: {type: STRING, comment: "Coverage office of the anchor (ISO-2)."}
  supplier_id: {type: STRING, comment: "SCF supplier id (supplier of the anchor; not a bank client)."}
  supplier_name: {type: STRING, comment: "Supplier name (fictional)."}
  supplier_country: {type: STRING, comment: "Supplier country (ISO-2)."}
  supplier_segment: {type: STRING, comment: "Supplier spend segment within its programme by invoice value Oct-2025 to Sep-2026: Strategic (top 20%), Core (next 30%) or Long tail (bottom 50%)."}
  is_supplier_onboarded: {type: BOOLEAN, comment: "True when the supplier is onboarded to the programme (able to finance) at the as-of date."}
  supplier_onboarded_date: {type: DATE, comment: "Date the supplier was onboarded (null = not onboarded)."}
  supplier_routes_to_other_bank: {type: BOOLEAN, comment: "True when the supplier's own payments route to another bank (an account-opening opportunity)."}
  supplier_invoice_no: {type: STRING, comment: "Supplier's invoice number."}
  invoice_date: {type: DATE, comment: "Invoice date (the grain date)."}
  invoice_month: {type: DATE, comment: "First day of the month of invoice_date."}
  approval_date: {type: DATE, comment: "Date the anchor approved the invoice for payment / financing."}
  due_date: {type: DATE, comment: "Invoice due date (the anchor pays the bank / supplier then)."}
  currency: {type: STRING, comment: "Invoice currency (ISO 4217)."}
  invoice_amount_usd: {type: DOUBLE, comment: "Approved invoice amount in USD (flow)."}
  is_financed: {type: BOOLEAN, comment: "True when the supplier drew down (financed the invoice early) - a drawdown."}
  financing_date: {type: DATE, comment: "Drawdown date (null when not financed)."}
  financing_month: {type: DATE, comment: "First day of the month of financing_date (null when not financed) - use for Financed USD by month."}
  financed_amount_usd: {type: DOUBLE, comment: "Amount advanced to the supplier in USD (0 when not financed; flow at financing_date)."}
  advance_rate: {type: DOUBLE, comment: "Share of the invoice advanced (0-1)."}
  discount_rate_pct: {type: DOUBLE, comment: "Annual discount rate charged (% p.a.)."}
  days_financed: {type: INT, comment: "Days from financing to the due date (null when not financed). Average Days Financed = SUM(days_financed) / count_if(is_financed)."}
  financed_usd_days: {type: DOUBLE, comment: "financed_amount_usd x days_financed (USD-days, for the annualised yield)."}
  discount_amount_usd: {type: DOUBLE, comment: "Discount (financing income to the bank) in USD (0 when not financed)."}
  net_proceeds_usd: {type: DOUBLE, comment: "Cash paid to the supplier = financed amount - discount (USD)."}
  status: {type: STRING, comment: "Approved (awaiting due date), Financed (drawn, not yet due), Settled (financed and repaid) or Paid at Maturity (not financed)."}
  is_outstanding_at_as_of: {type: BOOLEAN, comment: "True when financed on / before 30-Sep-2026 and not yet due (counts in the programme's drawn amount)."}
checks:
  - name: financed_amount_when_financed
    sql: SELECT count_if(is_financed AND (financed_amount_usd <= 0 OR financing_date IS NULL)) + count_if(NOT is_financed AND financed_amount_usd <> 0) FROM ${table}
reconcile:
  - name: rows_vs_silver
    silver: SELECT count(*) FROM ${catalog}.silver.trade_scf_invoice
  - name: financed_vs_silver
    gold: SELECT round(sum(financed_amount_usd)) FROM ${table}
    silver: SELECT round(sum(coalesce(financed_amount_usd, 0))) FROM ${catalog}.silver.trade_scf_invoice
    tolerance: 1
  - name: as_of_drawn_vs_programmes
    gold: SELECT round(sum(financed_amount_usd)) FROM ${table} WHERE is_outstanding_at_as_of
    silver: SELECT round(sum(drawn_usd)) FROM ${catalog}.silver.scf_programme
    tolerance: 10
