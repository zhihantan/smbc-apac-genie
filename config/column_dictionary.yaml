    subsidiary_country: "ISO country code of the supported APAC subsidiary."
    subsidiary_lei: "LEI-format identifier of the subsidiary; null when not recorded."
    beneficiary_booking_entity: "SMBC APAC booking entity (country code) whose lending the letter supports."
    parent_ownership_pct: "JP parent's ownership of the subsidiary, % (0-100)."
