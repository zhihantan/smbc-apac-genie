# Column dictionary (DECISIONS D25): one source of column descriptions for every silver table, reused
# by gold. Lookup order for <table>.<column>: tables.<table>.<column>, then columns.<column>.
# Silver table comments for the standardised tables come from config/table_specs.yaml (`comment`);
# table_comments below covers the tables built by the silver runner itself.
version: 1

columns:
  # bronze lineage metadata (carried into silver)
  _source_system: "Source system that delivered the row to bronze, e.g. core_banking, payments_hub, crm_platform, credit_workflow."
  _source_file: "Name of the landed source file the row came from."
  _batch_id: "Bronze landing batch id the row arrived in (the surviving delivery after de-duplication)."
  _ingest_ts: "Timestamp the row was ingested into bronze."
  # Delta Sharing metadata (shared tables, D27)
  source_region: "Lakehouse region that published the row via Delta Sharing. Values: JP, EMEA, AMER."
  ingest_method: "How the row arrived in this lakehouse. Values: delta_sharing."
  _share_name: "Delta Share the table is published in, e.g. jp_head_office_share, emea_regional_share."
  _provider_version: "Provider table version of the row's last refresh (Delta Sharing version number)."
  _shared_at: "Timestamp the provider last shared this row version."
  # conformed keys added by silver
  golden_client_id: "Golden client id (durable Customer 360 key) resolved by entity resolution from the row's own identity key via silver.xref_client_source; null only where the row has no client (e.g. prospects)."
  country_name: "Country name (e.g. Singapore, Hong Kong, Vietnam)."
  client_group_id: "Client group (global group-master key SYN-G-nnnn) of the golden client, or the row's own mastered group key on group-grain and shared rows."
  # quarantine tables
  _dq_rule_id: "First blocking DQ rule the row failed (ops.dq_rules.rule_id); the reason it was quarantined."
  _dq_rule_ids: "All blocking DQ rules the row failed."
  _dq_reason: "Description of the first failed blocking rule."
  _dq_run_id: "Silver DQ run that quarantined the row (DQ-yyyymmdd of the as-of date)."
  _quarantined_at: "Timestamp of the silver run that quarantined the row."
  # DQ outputs
  run_id: "Silver DQ run id, DQ-yyyymmdd of the as-of date (one run per as-of date)."
  rule_id: "DQ rule id from ops.dq_rules: <table>:<check> for generated rules, <table>:x:<name> for hand-written ones."
  layer: "Layer the result was measured on. Values: bronze / shared (the raw landing, before de-duplication and quarantine), silver (the published table)."
  dimension: "DQ dimension. Values: completeness, validity, uniqueness, timeliness, consistency."

table_comments:
  dq_results: "Data-quality rule results of the silver run: per rule and layer (bronze / shared landing before cleaning, silver after) the rows evaluated and failed, pass rate vs threshold, status and sample keys. Grain: run x rule x layer."
  dq_score_history: "Monthly DQ score per layer, table and dimension, Apr-2023 to the as-of month: simulated history (with the payments replay, KYC migration and JP share outage incidents) ending in the current run's actual results. Grain: month x layer x table x dimension."
  dq_table_reconciliation: "Silver load reconciliation per table: bronze rows = silver + quarantined + de-duplicated, with the dedup batches, quarantine rules, landing dirtiness and golden-key coverage. Grain: run x table."
  golden_record_coverage_monthly: "Golden-record coverage: for every golden client and month, whether each of the 7 identity source systems holds a record for it (by record availability, latest ER resolution). Grain: golden client x month x source system."
  golden_attribute_completeness: "Key-attribute completeness per current golden client: survived legal name, LEI, tax id, country, group, segment, tier, RM, rating and KYC risk, where each came from, and the share populated. Grain: one golden client."

tables:
  # ---- silver runner outputs ----------------------------------------------------------------------
  dq_results:
    run_ts: "Timestamp the silver DQ run executed."
    table_name: "Table the rule was evaluated on (schema.table): bronze.<t> / shared.<t> for the landing, silver.<t> for the published table."
    column_name: "Column(s) the rule checks, comma-separated; * for row-level or multi-column rules."
    rule_kind: "Check type, e.g. key_present, key_unique, golden_key, valid_values, date_order, freshness, cross_table, identity, share_freshness."
    severity: "Rule severity. Values: error (status fail when over threshold), warn, info (measured, never fails)."
    is_blocking: "True when failing rows are quarantined (never published to silver)."
    action: "What happened to failing rows. Values: quarantine, deduplicate, flag, none (no failures)."
    total_rows: "Rows (or checks) the rule evaluated."
    failed_rows: "Rows that failed the rule; for key_unique on the landing, the duplicate rows removed."
    pass_rate: "1 - failed_rows / total_rows, fraction 0-1."
    threshold: "Maximum failure fraction for status pass (0 = no failures allowed)."
    status: "Values: pass (failure rate within threshold), warn, fail (severity error over threshold)."
    sample_keys: "Up to five business keys of failing rows (sorted), for drill-down."
    detail: "JSON detail: failures per part of a composite rule, or removed_by_batch for de-duplication."
    storyline: "Storyline number (brief §6.4) the rule evidences, e.g. 12 for the payments replay; null otherwise."
  dq_score_history:
    month: "Month of the DQ measurement (first day of the month), Apr-2023 to the as-of month."
    table_name: "Table scored (schema.table), as in dq_results."
    score: "DQ score: mean pass rate of the table's rules in the dimension, fraction 0-1 (0.985 = 98.5%)."
    rules_evaluated: "Rules of the table and dimension measured that month."
    rules_failed: "Of those, rules not in status pass."
    rows_evaluated: "Rows evaluated across those rules (estimated for simulated months)."
    rows_failed: "Rows failing across those rules (estimated for simulated months)."
    basis: "Values: actual (the current run's results, latest month), simulated (deterministic history), incident (a configured DQ incident)."
    incident_key: "DQ incident affecting the month, e.g. payments_replay_landing, kyc_migration_backlog, jp_share_outage; null otherwise."
    incident_note: "Explanation of the incident behind the month's score."
    storyline: "Storyline number of the incident (7 KYC migration, 12 payments replay, 13 Delta Share staleness); null otherwise."
  dq_table_reconciliation:
    table_name: "Silver table loaded (schema.table)."
    source_table: "Bronze or shared table it was standardised from."
    domain: "Subject area of the table, e.g. deposits, payments, lending, credit, crm, onboarding, trade, shared."
    bronze_rows: "Rows in the landing table."
    deduplicated_rows: "Rows removed as later deliveries of an existing business key."
    quarantined_rows: "Rows that failed a blocking rule and went to silver.quarantine_<table>."
    silver_rows: "Rows published to the silver table."
    reconciles: "True when bronze_rows = silver_rows + quarantined_rows + deduplicated_rows (and the quarantine table holds them)."
    dedup_by_batch: "De-duplicated rows by the landing batch they came from, e.g. {PAY_20260617_R: 4100}."
    quarantine_by_rule: "Quarantined rows by failed blocking rule id (a row can fail several)."
    landing_dirty_rows: "Landing rows failing at least one generated DQ rule (incl. duplicates and blocking failures)."
    landing_dirty_pct: "landing_dirty_rows / bronze_rows, fraction 0-1."
    client_rows_in_scope: "Silver rows that must carry a golden client (client-grain tables; prospects excluded)."
    client_rows_resolved: "Of those, rows with a golden_client_id."
    golden_key_coverage: "client_rows_resolved / client_rows_in_scope, fraction 0-1."
    landing_resolution_rate: "Share of in-scope landing rows whose identity key resolved to a golden client, fraction 0-1."
    n_columns: "Columns in the silver table."
    undeclared_columns: "Landing columns not declared in config/table_specs.yaml (carried with an inferred type)."
    missing_columns: "Optional spec columns absent from the landing."
    loaded_at: "Timestamp of the silver run."
  golden_record_coverage_monthly:
    month: "Month (first day); one row per golden client, month and source system from the client's first record onwards."
    month_end_date: "Last day of the month: a source counts as present if a record existed by this date."
    source_system: "Identity source system. Values: ext_company_master, kyc_customer, credit_obligor, core_customer, crm_account, trade_party, tsy_counterparty."
    is_present: "True when the source system held at least one record of the golden client by month-end."
    n_records: "Records of the golden client in the source system by month-end (> 1 = within-source duplicates)."
    first_available_date: "Date the earliest of those records became available."
    last_record_added_date: "Date the latest of those records became available."
    source_field_completeness: "Share of identity fields (name, country, parent, LEI, tax id; as the source carries them) populated in the best record, fraction 0-1; null when absent."
    is_core_source: "True for the core sources (core_customer, crm_account, kyc_customer)."
    n_sources_present: "Source systems holding the golden client in the month (0-7)."
    in_all_core_sources: "True when all core sources (core banking, CRM, KYC) hold the client in the month."
    months_present: "Months, up to this one, in which the source held the client."
  golden_attribute_completeness:
    n_source_records: "Source records resolved to the golden client (latest ER run)."
    source_systems_present: "Source systems holding the client (ER priority order)."
    legal_name: "Survived legal name (entity-resolution survivorship)."
    legal_name_source: "Where legal_name came from (golden_identity = entity-resolution survivorship)."
    has_legal_name: "True when a legal name is populated."
    lei_like_id: "Survived LEI-like id (SYNLEI...)."
    lei_like_id_source: "Where lei_like_id came from."
    has_lei: "True when an LEI-like id is populated."
    tax_id: "Tax id from the highest-priority source record holding one (ext > KYC > credit > core > CRM > trade > treasury)."
    tax_id_source: "Source system the tax id came from."
    has_tax_id: "True when a tax id is populated."
    country_of_incorporation: "Survived ISO-2 country of incorporation."
    country_of_incorporation_source: "Where the country came from."
    has_country: "True when a country is populated."
    client_group_id_source: "Where the client group came from (entity-resolution majority vote over the records' parents)."
    has_group: "True when a client group is populated."
    segment: "Client segment: the CRM segment label, else the latest on CRM opportunities / relationship P&L, else the group's most common segment."
    segment_source: "Source of segment: crm_account, crm_opportunity, fin_relationship_pnl or client_group (inherited)."
    has_segment: "True when a segment is populated (directly or inherited from the group)."
    relationship_tier: "Relationship tier (Strategic, Core, Transactional): latest on CRM opportunities or relationship P&L, else the group's most common tier."
    relationship_tier_source: "Source of the tier: crm_opportunity, fin_relationship_pnl or client_group (inherited)."
    has_tier: "True when a relationship tier is populated (directly or inherited from the group)."
    primary_rm_code: "Primary RM code (RM001-RM120) from the client's CRM account record."
    primary_rm_code_source: "Source of the RM code (crm_account)."
    has_rm: "True when a primary RM is populated."
    internal_rating_grade: "Internal rating grade 1 (best) to 10 (default): credit-obligor master, else the latest rating action."
    internal_rating_grade_source: "Source of the grade: credit_obligor or core_rating_history."
    has_rating: "True when an internal rating is populated."
    kyc_risk_rating: "KYC risk rating (Low, Medium, High) from the KYC customer record."
    kyc_risk_rating_source: "Source of the KYC risk rating (kyc_customer)."
    has_kyc_risk: "True when a KYC risk rating is populated."
    n_attributes_populated: "Key attributes populated (of n_attributes)."
    n_attributes: "Key attributes assessed: legal name, LEI, tax id, country, group, segment, tier, RM, rating, KYC risk (10)."
    attribute_completeness_pct: "n_attributes_populated / n_attributes, fraction 0-1."
    missing_attributes: "Key attributes not populated, e.g. [lei, tax_id]."
  # ---- deposits, payments, liquidity, cash flow --------------------------------------------------------
  core_account:
    cust_no: "Core-banking customer number (CORE-nnnnnn) of the account holder; resolves to golden_client_id."
    account_id: "Core-banking account number (ACC-nnnnnnn); one row per account. Joins to deposit balances, time deposits, payments and liquidity-structure participants."
    account_type: "Deposit product. Values: Current Account, Savings Account, Time Deposit, Money Market Deposit. Current and Savings form CASA; the other two form the TD class."
    currency: "ISO currency code the account is held in; balance_lcy amounts use it. Mostly the booking country's currency, about a quarter USD."
    open_date: "Date the account was opened in core banking."
    status: "Core-banking account status. Values: ACTIVE (DORMANT and CLOSED are valid codes, currently unused)."
  core_deposit_balance_daily:
    account_id: "Core-banking account number; joins to core_account.account_id. One row per account per calendar day."
    cust_no: "Core-banking customer number (CORE-nnnnnn) of the account holder."
    balance_date: "Date of the end-of-day balance; every calendar day from 2025-12-01 to the 2026-09-30 as-of date."
    currency: "Account currency (ISO code); balance_lcy is in this currency."
    balance_lcy: "Point-in-time end-of-day balance in the account currency. Do not sum across dates."
    balance_usd: "Point-in-time end-of-day balance in USD at that day's FX rate. Do not sum across dates; take one date or average."
    deposit_class: "Values: CASA (current and savings accounts), TD (time and money-market deposits). Basis of the CASA ratio."
  core_deposit_balance_monthly:
    account_id: "Core-banking account number; joins to core_account.account_id. One row per account per month-end."
    cust_no: "Core-banking customer number (CORE-nnnnnn) of the account holder."
    balance_date: "Calendar month-end date of the balance snapshot, from 2023-04-30 to the as-of month-end."
    currency: "Account currency (ISO code); balance_lcy is in this currency."
    balance_lcy: "Point-in-time month-end balance in the account currency. Never sum across months."
    balance_usd: "Point-in-time month-end balance in USD at the month-end FX rate. Never sum across months; use avg_balance_usd for average balances."
    avg_balance_usd: "Average daily balance over the calendar month, USD."
    deposit_class: "Values: CASA (current and savings accounts), TD (time and money-market deposits). Basis of the CASA ratio."
  core_time_deposit:
    placement_id: "Core-banking time-deposit placement id (TDP-<account digits>-<sequence>); one row per placement. The sequence numbers successive placements and rollovers on the account."
    account_id: "Core-banking account number of the Time Deposit or Money Market Deposit account holding the placement; joins to core_account.account_id."
    cust_no: "Core-banking customer number (CORE-nnnnnn) of the depositor."
    currency: "Placement currency (ISO code), same as the account; principal_lcy and interest_at_maturity_lcy are in it."
    placement_date: "Date the deposit was placed (start of the term)."
    maturity_date: "Date the placement matures: placement_date plus tenor_months."
    tenor_months: "Term of the placement in months. Values: 1, 3, 6, 12."
    principal_lcy: "Principal placed, in the placement currency."
    principal_usd: "Principal placed, in USD."
    interest_rate_pct: "Annual interest rate on the placement, in percent (3.5 = 3.5% p.a.)."
    interest_at_maturity_lcy: "Simple interest payable at maturity in the placement currency: principal_lcy x interest_rate_pct/100 x days/365."
    maturity_instruction: "What happens at maturity. Values: Auto Rollover - Principal + Interest, Auto Rollover - Principal, Credit to Current Account."
    funding_source: "How the placement was funded. Values: New Funds (first placement on the account), Rollover (the previous placement maturing), Transfer from Current Account."
    funding_account_id: "Core-banking current account debited when funding_source is Transfer from Current Account; null otherwise. Joins to core_account.account_id."
    status: "Values: Active (matures after the 2026-09-30 as-of date), Matured."
  core_liquidity_structure:
    structure_id: "Core-banking liquidity structure id (LQS-nnnn); one row per structure. Joins to core_liquidity_structure_participant.structure_id."
    structure_name: "Display name: client group name, scope (Domestic or APAC) and structure type."
    structure_type: "Cash-management structure type. Values: Notional Pooling, Physical Pooling, Interest Optimisation, Sweep (single-country)."
    group_master_id: "Global group master id (SYN-G-nnnn) of the client group that owns the structure; same id space as client_group_id."
    header_cust_no: "Core-banking customer number of the header entity, the client that owns the structure; resolves to golden_client_id."
    header_account_id: "Core-banking account number of the header (master) account, the header entity's main current account; joins to core_account.account_id."
    header_country: "Booking country (ISO 2-letter code) of the header entity, usually SG or HK."
    pooling_currency: "Currency the structure pools in, i.e. the header account's currency (ISO code)."
    sweep_frequency: "How often balances are swept or pooled. Values: Daily, Intraday, Weekly, Monthly, Daily (Notional)."
    is_cross_border: "True when the member entities are booked in more than one country."
    interest_benefit_bps: "Estimated interest benefit to the client from the structure, in basis points (bps)."
    monthly_fee_usd: "Monthly fee charged for the structure, USD; billed as Liquidity Structure lines in fin_tb_fee."
    start_date: "Date the structure went live."
    end_date: "Date the structure was terminated; null while active."
    status: "Structure status. Values: Active, Terminated (end_date set)."
  core_liquidity_structure_participant:
    structure_id: "Core-banking liquidity structure id; joins to core_liquidity_structure.structure_id. One row per structure and member account."
    participant_account_id: "Core-banking account number of the member account (the entity's main current account); joins to core_account.account_id."
    participant_cust_no: "Core-banking customer number of the member entity; resolves to golden_client_id."
    participant_country: "Booking country (ISO 2-letter code) of the member entity."
    participant_currency: "Currency of the member account (ISO code); target_balance_lcy is in this currency."
    role: "Values: Header (the structure's master account), Participant."
    sweep_direction: "How funds move between the account and the header. Values: Two-way, Concentration only, Notional (no movement); null for the Header row."
    target_balance_lcy: "Balance left in the account after each sweep, in participant_currency (0 = zero-balancing). Set only for Sweep-structure participants; otherwise null."
    join_date: "Date the account joined the structure."
    leave_date: "Date the account left the structure; null while still a member."
  pay_payment_message:
    payment_id: "Payments-hub payment reference (PAY-nnnnnnnnn); one row per payment. Joins to pay_repair_queue.payment_id."
    cust_no: "Core-banking customer number of the SMBC client making or receiving the payment."
    account_id: "Core-banking account number of the client's account debited (outbound) or credited (inbound); joins to core_account.account_id."
    payment_date: "Date the payment was processed; history from 2024-04-01."
    direction: "Values: Outbound (paid by the client), Inbound (received by the client)."
    channel: "Channel or rail the payment went through. Values: ISO 20022, SWIFT MT, Host-to-Host, Payments API, Portal, RTGS, FAST."
    payment_purpose: "Business purpose. Values: Supplier, Intercompany, Payroll, Trade Settlement, Tax, Loan Service, Dividend. Loan Service paid to an Other Bank indicates borrowing held with a competitor."
    debtor_country: "Booking country (ISO 2-letter code) of the client's SMBC account; despite the name, it is the client's side for both inbound and outbound payments."
    counterparty_country: "Country (ISO 2-letter code) of the counterparty: beneficiary for outbound, payer for inbound. Equals debtor_country when is_cross_border is false."
    is_cross_border: "True when the payments hub flags the payment as cross-border (counterparty outside the client's booking country)."
    counterparty_bank_type: "Type of the counterparty's bank. Values: SMBC, Other Bank (a competitor), Intercompany (payment with a group entity)."
    counterparty_bank_name: "Counterparty's bank: SMBC, Intercompany or one of eight competitor banks. Joins to pay_counterparty_bank.bank_name."
    amount_usd: "Payment amount in USD, always positive; use direction for the sign."
    counterparty_ref: "Client-scoped counterparty reference (<cust_no>-CPnnn) identifying the supplier or trade partner; set only for Supplier and Trade Settlement payments, otherwise null."
    stp_flag: "True when the payment was processed straight-through, with no manual repair."
    repair_reason: "Why the payment needed manual repair; null for STP payments. Values: Invalid BIC, Missing beneficiary, Sanctions hold, Format error, Duplicate instruction, FX cover missing."
    processing_seconds: "End-to-end processing time in seconds; STP payments take seconds, repaired payments 30 minutes to about a day."
  pay_repair_queue:
    payment_id: "Payments-hub payment reference; joins to pay_payment_message.payment_id. One row per payment that needed manual repair (stp_flag false)."
    cust_no: "Core-banking customer number of the client whose payment was repaired."
    payment_date: "Date of the payment, as in pay_payment_message."
    repair_reason: "Why the payment needed manual repair. Values: Invalid BIC, Missing beneficiary, Sanctions hold, Format error, Duplicate instruction, FX cover missing."
    processing_seconds: "End-to-end processing time including the repair, in seconds (about 0.5 to 24.5 hours)."
    repaired: "True when the repair was completed and the payment released (all current rows are true)."
  pay_channel_usage:
    usage_month: "Month of activity (first day of the month), from Apr-2024. One row per month, customer and channel."
    cust_no: "Core-banking customer number of the client."
    channel: "Banking channel or payment rail. Values: Portal, Host-to-Host, ISO 20022, Payments API, SWIFT MT, RTGS, FAST."
    active_users: "Active e-banking portal users in the month (count); Portal rows only, 0 for other channels."
    logins: "Portal logins in the month (count); Portal rows only, 0 for other channels."
    payments_initiated: "Outbound payments initiated through this channel in the month (count)."
    payments_value_usd: "Total value of the outbound payments initiated through this channel in the month, USD."
    stp_payments: "Of payments_initiated, the count processed straight-through (no manual repair)."
    manual_instructions: "Of payments_initiated, the count received as manual (fax or paper) instructions keyed by operations; only on SWIFT MT, RTGS, FAST and ISO 20022 rows."
    digital_payments: "Payments submitted digitally: payments_initiated minus manual_instructions (count)."
    api_calls: "Payments API calls in the month (count); Payments API rows only, 0 for other channels."
    files_transmitted: "Host-to-host payment files transmitted in the month (count); Host-to-Host rows only, 0 for other channels."
  pay_counterparty_bank:
    bank_name: "Counterparty bank name, one row per bank: SMBC, Intercompany and eight competitor banks. Joins to pay_payment_message.counterparty_bank_name."
    bank_type: "Values: SMBC, Other Bank (a competitor), Intercompany."
  fin_tb_fee:
    fee_id: "Finance-engine fee line id, <cust_no>-<yyyyMM>-<code> (AMF, CHP, CHH, CHA, LQS by fee type); one row per customer, month and fee type."
    cust_no: "Core-banking customer number of the billed client."
    fee_month: "Month the fee was charged for (first day of the month), from Apr-2024."
    fee_type: "Fee line type. Values: Account Maintenance, Channel - Portal, Channel - Host-to-Host, Channel - API, Liquidity Structure."
    product_family: "Product family the fee is booked under. Values: Cash (account maintenance), Payments (channel fees), Liquidity (liquidity structures)."
    fee_currency: "Client's local billing currency (ISO code); fee_amount_lcy is in it."
    fee_amount_lcy: "Fee amount in fee_currency, converted at the month-end FX rate."
    fee_amount_usd: "Fee amount in USD."
  cf_actual_monthly:
    cust_no: "Core-banking customer number of the client; one row per client and month."
    month: "Calendar month of the payments (first day of the month), from Apr-2024."
    inflows_usd: "Total inbound payments received in the month, USD."
    outflows_usd: "Total outbound payments made in the month, USD (positive number)."
    net_cf_usd: "Net cash flow: inflows_usd minus outflows_usd, USD; negative means net outflow."
    n_payments: "Number of inbound and outbound payments in the month (count)."
  cf_forecast:
    cust_no: "Core-banking customer number of the client."
    forecast_run_date: "Date the one-month-ahead forecast was run: first day of the month before target_month."
    target_month: "Month being forecast (first day of the month), Apr-2024 to Sep-2026."
    model_version: "Forecast model. Values: v1 (target months up to May-2026), v2 (from Jun-2026, lower error)."
    forecast_inflows_usd: "Forecast gross inflows (collections) for target_month, USD."
    actual_inflows_usd: "Realised inflows for target_month, USD; equals cf_actual_monthly.inflows_usd."
    abs_pct_error: "Absolute forecast error as a fraction of actual inflows (0-1; 0.11 = 11%). Average it to get MAPE."
  cf_projection:
    segment: "Client segment projected. Values: Japanese Corporate, Non-Japanese Large Corporate, Financial Institution, Sponsor & Structured Finance, Public Sector."
    target_month: "Future month projected (first day of the month): Oct-2026 to Mar-2027, the rest of FY2026."
    projected_inflows_usd: "Projected total inflows of the segment for target_month, USD."
    lower_usd: "Lower bound of the projection range, USD (about 90% of the baseline)."
    upper_usd: "Upper bound of the projection range, USD (about 110% of the baseline)."
    method: "Projection method. Values: seasonal."
  cf_event:
    event_id: "Cash-flow event id (CFE-nnnnn) from the cash-flow forecasting service; one row per predicted shortfall or surplus."
    cust_no: "Core-banking customer number of the client the event concerns."
    event_type: "Values: Predicted Shortfall (forecast inflows below expected outflows), Predicted Surplus (inflows above expected outflows)."
    event_date: "Date of the predicted shortfall or surplus (a business day in the target month); days_to_action and the 30-day action window count from it."
    forecast_run_date: "Run date of the forecast that raised the event (first day of the month before the target month)."
    forecast_target_month: "Month the forecast covers (first day of the month); with cust_no and forecast_run_date, joins to cf_forecast.target_month."
    model_version: "Forecast model that produced the prediction. Values: v1, v2 (v2 for target months from Jun-2026)."
    horizon_days: "Days from forecast_run_date to event_date, i.e. how far ahead the event was predicted."
    forecast_inflows_usd: "Forecast gross inflows for the target month, USD; null for 3 surplus events raised without a model figure."
    expected_outflows_usd: "Expected outflows for the target month, USD: average monthly outflows of the 3 months before the forecast run. Null for 3 events."
    predicted_net_usd: "Predicted net cash flow, USD: forecast_inflows_usd minus expected_outflows_usd. Negative = shortfall, positive = surplus."
    predicted_amount_usd: "Size of the predicted shortfall or surplus, USD (absolute value of predicted_net_usd)."
    severity_ratio: "predicted_amount_usd divided by the client's average gross monthly flow (inflows + outflows over the 6 months before the run); a ratio, not a percent. Null for 3 events."
    has_rcf: "True when the client has a revolving credit facility (RCF) with SMBC."
    undrawn_rcf_usd: "Undrawn RCF headroom (limit minus drawn) at the month-end before the target month, USD; 0 when no RCF."
    action_taken: "Action that followed the event. Values: None, RCF Drawdown, TD Placed ('None' is a literal value, not NULL)."
    action_date: "Date of the RCF drawdown or TD placement; null when no action was taken."
    days_to_action: "Days from event_date to action_date; null when no action was taken."
    action_amount_usd: "Amount drawn on the RCF or placed in time deposits, USD; null when no action was taken."
    linked_facility_id: "Credit-system facility id (FAC-nnnnnn) of the RCF drawn; joins to credit_facility_terms.facility_id. Null unless action_taken is RCF Drawdown."
    linked_schedule_event_id: "Core-banking loan-schedule event id (LSE-nnnnnnn) of the drawdown; joins to core_loan_schedule.schedule_event_id. Null unless action_taken is RCF Drawdown."
    est_action_revenue_usd: "Estimated annual revenue from the action, USD: amount drawn x facility margin, or TD amount x deposit spread. Null when no action."
    event_status: "Values: Open (no action yet, within 30 days of event_date), Actioned, Closed - No Action."
  fx_rate_daily:
    currency_code: "ISO currency code; 17 currencies including USD (rate 1.0). One row per currency per calendar day."
    date: "Calendar date the rate applies to; every day 2023-04-01 to 2027-03-31, so filter date <= 2026-09-30 (as-of) for the latest rate."
    rate_per_usd: "Units of the currency per 1 USD; multiply a USD amount by it to get local currency."
    usd_per_unit: "USD per 1 unit of the currency (1 / rate_per_usd); multiply a local-currency amount by it to get USD."

  # ---- lending, credit, profitability ------------------------------------------------------------------
  core_facility_balance_monthly:
    facility_id: "Credit facility id issued by the credit workflow (e.g. FAC-000123); joins credit_facility_terms. One row per facility per month-end."
    obligor_id: "Obligor id issued by the credit workflow (e.g. CRD-000123); identifies the borrower."
    balance_date: "Month-end date of the balance snapshot. Point-in-time: do not sum balances across months."
    currency: "Facility currency (ISO code): USD or the booking country's local currency; drawn_lcy is in this currency."
    limit_usd: "Committed facility limit at month-end, USD."
    drawn_usd: "Drawn (outstanding) balance at month-end, USD."
    drawn_lcy: "Drawn balance at month-end in the facility currency (currency column), converted at the month-end FX rate."
    utilisation_pct: "Drawn / limit at month-end as a fraction (0.85 = 85%), not a percent; above 1 means drawn over the limit."
  core_dpd:
    facility_id: "Credit facility in arrears (credit-workflow facility id); joins credit_facility_terms. One row per facility per day past due."
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    dpd_date: "Calendar date of the observation; the facility is past due on this day."
    days_past_due: "Days since the missed instalment's due date, as at dpd_date (1 or more)."
    dpd_bucket: "Days-past-due band. Values: 1-29, 30-59, 60-89, 90+."
    overdue_amount_lcy: "Amount overdue on dpd_date in the facility currency; grows by one instalment for each further 30 days past due."
    overdue_amount_usd: "Amount overdue on dpd_date in USD, at that day's FX rate."
    currency: "Facility currency (ISO code) of overdue_amount_lcy."
    arrears_episode_id: "Arrears episode id issued by core banking (e.g. ARR-00123); groups the daily rows from a missed payment to its cure."
    due_date: "Due date of the missed instalment that opened the arrears episode."
    cure_date: "Date the arrears episode was cured (overdue amount cleared); null if never cured. Dates after 2026-09-30 are expected cure dates."
    is_cured: "True when the episode has a cure date (cleared, or expected to clear after 2026-09-30); false for never-cured, defaulted episodes."
  core_loan_schedule:
    schedule_event_id: "Loan schedule event id issued by core banking (e.g. LSE-0001234); one row per event. Referenced by cf_event.linked_schedule_event_id."
    facility_id: "Credit facility the event belongs to (credit-workflow facility id); joins credit_facility_terms."
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    event_type: "Type of balance movement. Values: Drawdown, Repayment, Prepayment, Maturity."
    event_date: "Date the movement settled, or is scheduled to occur if after 2026-09-30."
    amount_lcy: "Event amount in the facility currency (currency column)."
    amount_usd: "Event amount in USD, always positive: Drawdown adds to the drawn balance; Repayment, Prepayment and Maturity reduce it."
    currency: "Facility currency (ISO code) of amount_lcy."
    drawn_after_usd: "Facility drawn balance immediately after the event, USD; 0 for future scheduled events."
    is_contractual: "True when the movement is contractual (scheduled amortisation or maturity); false for drawdowns, voluntary repayments and prepayments."
    status: "Values: Settled (event date on or before 2026-09-30), Scheduled (future event)."
    purpose: "Reason for the movement, e.g. Initial drawdown, Utilisation request, Scheduled amortisation, Voluntary repayment, Final repayment at maturity, Refinanced with another bank."
  core_rating_history:
    rating_event_id: "Rating action id issued by core banking (e.g. RTG-000123); one row per rating action."
    obligor_id: "Obligor id issued by the credit workflow; identifies the rated borrower."
    effective_date: "Date the rating action took effect."
    rating_action: "Values: Initial, Affirm, Upgrade, Downgrade."
    previous_grade: "Internal grade before this action, 1 (best) to 10 (default); null for the initial rating."
    internal_grade: "Internal grade after this action, 1 (best) to 10 (default)."
    notch_change: "internal_grade minus previous_grade: positive = downgrade, negative = upgrade, 0 for affirmations and initial ratings. Values: -2, -1, 0, 1, 2."
    rating_equivalent: "Letter-scale equivalent of internal_grade: 1 AAA, 2 AA+, 3 AA, 4 A+, 5 A, 6 BBB+, 7 BBB, 8 BB+, 9 BB, 10 B."
    origination_grade: "Grade at origination (initial recognition); the IFRS 9 baseline, where 3+ notches worse means Stage 2."
    ifrs9_stage: "IFRS 9 stage after the action. Values: 1 (performing), 2 (3+ notches below origination, grade 8+ or over 30 DPD), 3 (credit-impaired: over 90 DPD or unlikely to pay)."
    previous_stage: "IFRS 9 stage (1-3) before this action; null for the initial rating."
    action_reason: "Reason for the action, e.g. Annual review; Interim watchlist review: deterioration; Default: payment more than 90 days past due; Initial rating at onboarding (new-money approval)."
    rating_model: "Rating model applied (by segment). Values: Corporate Scorecard v3, FI Scorecard v2, Public Sector Scorecard v1, Project & Sponsor Model v1."
    review_id: "Credit review behind the action (joins credit_review.review_id); null for ratings carried in at history start and for default downgrades."
    approver_id: "Employee id of the credit approver who approved the rating action."
  credit_collateral:
    appraised_value_usd: "Appraised value of the collateral at its last valuation, USD."
    collateral_id: "Collateral item id issued by the credit workflow (e.g. COL-000123); one row per item."
    collateral_type: "Values: Real Estate, Fixed Assets, Receivables, Inventory, Cash."
    facility_id: "Credit facility the collateral secures (credit-workflow facility id); joins credit_facility_terms."
    last_valuation_date: "Date of the most recent appraisal of the collateral."
    ltv_pct: "Loan-to-value: drawn exposure / appraised value, as a fraction (0.70 = 70%), not a percent."
    obligor_id: "Credit-workflow obligor id of the borrower whose facility the collateral secures (added by silver from credit_facility_terms); the identity the row resolves through."
  credit_covenant_test:
    actual: "Covenant ratio measured at the test, in x (Net Debt/EBITDA or ICR, per covenant_type)."
    breached: "True when the test fails: Net Debt/EBITDA above, or ICR below, the threshold."
    covenant_type: "Financial covenant tested. Values: Net Debt/EBITDA (maximum leverage), ICR (minimum interest cover)."
    facility_id: "Credit facility carrying the covenant (credit-workflow facility id); joins credit_facility_terms."
    headroom_pct: "Headroom to the threshold as a fraction of it (0.20 = 20%); negative = breached. Leverage: (threshold - actual) / threshold; ICR: (actual - threshold) / threshold."
    is_latest_test: "True when this is the most recent test of the facility and covenant type."
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    test_basis: "Values: Quarterly (quarter-end test), FY2025 Annual (test on the FY2025 annual accounts)."
    test_date: "Date of the covenant test (quarter-end for quarterly tests)."
    threshold: "Covenant limit in x: maximum Net Debt/EBITDA (3.5, 4.0 or 4.5) or minimum ICR (2.5)."
    waiver: "True when lenders granted a waiver for this test result."
  credit_facility_terms:
    closed_date: "Date the facility was closed before maturity (prepaid or refinanced away); null otherwise."
    currency: "Facility currency (ISO code): USD or the booking country's local currency."
    facility_id: "Credit facility id issued by the credit workflow (e.g. FAC-000123); one row per facility."
    facility_type: "Values: Term Loan, Revolving Credit Facility, Bilateral Loan, Syndicated Loan, Overdraft, Trade Loan."
    guarantor_type: "Third-party credit support. Values: None (no guarantor), Parent Guarantee, Corporate Guarantee, Keepwell, Sponsor Support."
    has_covenant: "True when the facility carries financial covenants (tested in credit_covenant_test)."
    limit_usd: "Committed facility limit, USD."
    margin_bps: "Credit margin over the base rate, bps per annum."
    maturity_date: "Contractual final maturity date."
    obligor_id: "Obligor id issued by the credit workflow (e.g. CRD-000123); identifies the borrower."
    origination_date: "Date the facility was originated (signed)."
    security_type: "Security held. Values: Unsecured, Real Estate, Fixed Assets, Receivables, Inventory, Cash."
    status: "Facility status as of 2026-09-30. Values: Active, Matured, Prepaid."
  credit_financial_statement:
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower whose statements these are."
    fiscal_year: "Client's own statement fiscal year (2023-2025): FY2025 ends Dec-2025, or Mar-2026 for March year-end (Japanese) clients."
    fiscal_year_label: "Statement fiscal year label. Values: FY2023, FY2024, FY2025."
    fiscal_year_end: "Statement period-end date: 31 March for March year-end clients, otherwise 31 December."
    statement_type: "Values: P&L, Balance Sheet, Cash Flow."
    line_item: "Statement line, e.g. Revenue, EBITDA, Net Income, Cash, Total Debt, Equity, Cash Flow from Operations, Free Cash Flow."
    amount_usd: "Line amount in USD. Expense and outflow lines are positive; negative values are losses or negative cash flow."
    amount_lcy: "Line amount in the client's reporting currency (currency column)."
    currency: "Client's reporting currency (ISO code) for amount_lcy."
    is_audited: "True when the fiscal-year statements are audited; false = unaudited management accounts."
    is_spread: "True when the statement has been spread in the credit workflow; false = still awaiting spreading (FY2025 backlog)."
    spread_date: "Date the statement was spread; null if not yet spread."
  credit_ratio:
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    fiscal_year: "Client's own statement fiscal year (2023-2025): FY2025 ends Dec-2025, or Mar-2026 for March year-end (Japanese) clients."
    fiscal_year_label: "Statement fiscal year label. Values: FY2023, FY2024, FY2025."
    fiscal_year_end: "Statement period-end date: 31 March for March year-end clients, otherwise 31 December."
    ratio_name: "Client's financial ratio computed from its spread statements, e.g. Net Debt/EBITDA, ICR, DSCR, Current Ratio, Gross Margin, ROE, DSO, Free Cash Flow."
    ratio_value: "Unit depends on ratio: x (leverage, coverage, liquidity), fraction (margins, ROE, ROA, growth), days (DSO, DIO, DPO, Cash Conversion Cycle), USD (Free Cash Flow). Null for FY2023 Revenue YoY Growth."
    peer_group_id: "Industry peer group of the obligor (one per subsector, e.g. PG-012); joins ext_peer_benchmark and ref_industry_peer."
  credit_review:
    review_id: "Credit review id issued by the credit workflow (e.g. CRV-000123); one row per review. Referenced by core_rating_history.review_id."
    obligor_id: "Obligor id issued by the credit workflow; identifies the reviewed borrower."
    facility_id: "Credit facility the review concerns (new-money and amendment reviews); null for annual and watchlist reviews."
    review_type: "Values: Annual, New Money, Amendment, Watchlist."
    review_fiscal_year: "Client fiscal year of the financials an annual review covers (2022-2025); null for other review types."
    due_date: "Date the annual review is due; null for other review types."
    preparation_start_date: "Date the analyst started preparing the review; null if not yet started."
    submitted_date: "Date the review was submitted for approval; null if not yet submitted."
    approved_date: "Date of the approval decision (approved or declined); null while undecided."
    status: "Review status as of 2026-09-30. Values: Not Started, In Preparation, Overdue, Submitted - Awaiting Approval, Approved, Declined."
    days_late: "Days submitted after due_date (to 2026-09-30 if overdue and unsubmitted); 0 if on time; null if no due date or not yet due."
    days_in_preparation: "Days from preparation start to submission, or to 2026-09-30 if not yet submitted; null if not started."
    submission_count: "Number of submissions; 2 means returned for rework and resubmitted. Null if not yet submitted."
    outcome: "Decision outcome. Values: Approved, Approved with Conditions, Declined; null while undecided."
    blocker_reason: "What blocks submission, e.g. 'Awaiting FY2025 financial spreading'; null if not blocked."
    current_grade: "Internal grade in force before the review, 1 (best) to 10 (default)."
    recommended_grade: "Internal grade recommended in the submitted review, 1 (best) to 10 (default); null if not yet submitted."
    approved_grade: "Internal grade approved by the approver, 1 (best) to 10 (default); null unless approved."
    requested_amount_usd: "New-money amount requested, USD; null for other review types."
    proposed_margin_bps: "Margin proposed for the new money, bps per annum; null for other review types."
    is_pricing_exception: "True when the new-money deal was priced below its standalone RoRWA hurdle margin; null for other review types."
    exception_reason: "Reason recorded for approving below-hurdle pricing on a new-money review. Values: Relationship, Strategic Client, Competitive Pricing, Cross-sell Commitment."
    analyst_id: "Employee id of the credit analyst responsible for the review."
    approver_id: "Employee id of the credit approver who decided the review; null while undecided."
    memo_excerpt: "Short excerpt of the credit memo (about 40 words or fewer); null if not yet submitted."
    memo_tone: "Tone of the memo. Values: Positive, Neutral, Negative; null if not yet submitted."
    memo_sentiment_score: "Memo sentiment score from -1 (negative) to +1 (positive); null if not yet submitted."
  credit_spreading_task:
    task_id: "Spreading task id issued by the credit workflow, one per obligor and statement fiscal year (e.g. SPR-000123-FY2025)."
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    fiscal_year: "Client's statement fiscal year being spread (2023-2025): FY2025 ends Dec-2025, or Mar-2026 for March year-end (Japanese) clients."
    fiscal_year_label: "Statement fiscal year label. Values: FY2023, FY2024, FY2025."
    fiscal_year_end: "Statement period-end date: 31 March for March year-end clients, otherwise 31 December."
    statement_basis: "Basis of the statements received. Values: Audited, Unaudited / Management."
    received_date: "Date the client's statements were received for spreading."
    due_date: "Spreading due date: 21 days after receipt (SLA)."
    spread_date: "Date the statements were spread; null if not yet spread."
    checked_date: "Date a second analyst checked the spread; null if not yet checked."
    analyst_id: "Employee id of the credit analyst who spreads the statements."
    checker_id: "Employee id of the second analyst who checks the spread (four-eyes); null if not yet spread."
    status: "Spreading status as of 2026-09-30. Values: Received - Not Started, In Progress, Checked."
    days_to_spread: "Days from receipt to spreading; null if not yet spread."
    days_overdue: "Days past due_date when spread, or to 2026-09-30 if still unspread; 0 if within SLA."
    is_overdue: "True when the statements are still unspread and due_date has passed."
  ext_peer_benchmark:
    peer_group_id: "Industry peer group id (one per subsector, e.g. PG-012); joins credit_ratio.peer_group_id and ref_industry_peer."
    ratio_name: "Ratio benchmarked; same names and units as credit_ratio, e.g. Net Debt/EBITDA, ICR, EBITDA Margin, Current Ratio, DSO."
    fiscal_year: "Client statement fiscal year benchmarked (2023-2025), as in credit_ratio.fiscal_year."
    p25: "25th percentile of the ratio across the peer group for the fiscal year, in the ratio's unit (as credit_ratio.ratio_value)."
    p50: "Median (50th percentile) of the ratio across the peer group for the fiscal year, in the ratio's unit."
    p75: "75th percentile of the ratio across the peer group for the fiscal year, in the ratio's unit."
    n_clients: "Number of companies in the peer sample behind the percentiles (count)."
  fin_capital_allocation:
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower. One row per obligor per month."
    month: "Snapshot month (first day of the month). Balances are point-in-time: do not sum them across months."
    as_of_date: "Month-end date the figures are measured at."
    fiscal_year: "Bank fiscal year (April-March) of the month; FY2026 = Apr-2026 to Mar-2027."
    fiscal_quarter: "Bank fiscal quarter. Values: 1 (Apr-Jun), 2 (Jul-Sep), 3 (Oct-Dec), 4 (Jan-Mar)."
    internal_grade: "Internal grade in force at month-end, 1 (best) to 10 (default)."
    rating_equivalent: "Letter-scale equivalent of internal_grade (1 = AAA through 10 = B)."
    ifrs9_stage: "IFRS 9 stage at month-end. Values: 1 (performing), 2 (significant increase in credit risk), 3 (credit-impaired)."
    days_past_due_max: "Highest days past due across the obligor's facilities at month-end; 0 = current."
    dpd_bucket: "Band of days_past_due_max. Values: Current, 1-29, 30-59, 60-89, 90+."
    drawn_usd: "Total drawn balance of the obligor's facilities at month-end, USD."
    limit_usd: "Total committed limit of the obligor's facilities at month-end, USD."
    ead_usd: "Exposure at default: drawn + ccf * undrawn limit, USD."
    ccf: "Credit conversion factor applied to the undrawn limit in EAD, fraction (0.5)."
    risk_weight: "Risk weight on EAD by internal grade, fraction (0.25 at grade 1 to 1.25 at grade 10)."
    rwa_usd: "Risk-weighted assets: ead_usd * risk_weight, USD."
    pd_12m: "12-month probability of default for the grade, fraction 0-1; 1.0 in Stage 3."
    pd_lifetime: "Lifetime probability of default over the remaining tenor, 1 - (1 - pd_12m)^remaining_tenor_years, fraction 0-1; 1.0 in Stage 3."
    lgd: "Loss given default, limit-weighted across the obligor's facilities by security type, fraction 0-1."
    remaining_tenor_years: "Drawn-weighted remaining life of the obligor's facilities in years, bounded 1 to 7."
    ecl_12m_usd: "12-month expected credit loss: pd_12m * lgd * ead_usd, USD."
    ecl_lifetime_usd: "Lifetime expected credit loss: pd_lifetime * lgd * ead_usd, USD."
    ecl_usd: "IFRS 9 loss allowance, USD: ecl_12m_usd in Stage 1, ecl_lifetime_usd in Stages 2 and 3."
    ecl_change_usd: "Change in ecl_usd from the previous month-end, USD; positive = allowance build (impairment charge)."
    expected_loss_usd: "Monthly expected loss: grade PD * lgd * ead_usd / 12, USD."
    economic_capital_usd: "Economic (unexpected-loss) capital: ead_usd * grade-based capital rate, USD."
    book_equity_usd: "Book equity allocated to the obligor: 9% of ead_usd, USD."
    allocated_capital_usd: "Capital allocated at the 12.5% CET1 target: rwa_usd * 0.125, USD."
    cost_of_capital_usd: "Monthly charge on allocated capital at the 10% cost of equity: allocated_capital_usd * 0.10 / 12, USD."
    is_individually_assessed: "True when the Stage 3 ECL is individually assessed (workout LGD) rather than model-calculated."
  fin_deal_pricing:
    facility_id: "Credit facility id issued by the credit workflow; one row per facility, priced at signing. Joins credit_facility_terms."
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower."
    signing_date: "Date the deal was signed (facility origination date)."
    signing_quarter: "Bank fiscal quarter of signing (April-March year), e.g. FY2025-Q4 = Jan-Mar 2026."
    product: "Facility type. Values: Term Loan, Revolving Credit Facility, Bilateral Loan, Syndicated Loan, Overdraft, Trade Loan."
    amount_usd: "Facility limit signed, USD."
    internal_grade: "Internal grade used to price the deal, 1 (best) to 10 (default)."
    ead: "Exposure at default at signing: expected drawn amount plus 50% of the undrawn limit, USD."
    rwa: "Risk-weighted assets at signing: ead * grade risk weight, USD."
    lgd: "Loss given default by security type, fraction. Values: 0.18 Cash, 0.30 Real Estate, 0.35 Receivables or Fixed Assets, 0.40 Inventory, 0.45 Unsecured."
    priced_margin_bps: "Margin the facility is priced at, bps per annum over the base rate."
    hurdle_margin_bps: "Drawn margin needed for lending revenue alone to clear the 1.2% RoRWA hurdle after cost and expected loss, bps per annum."
    margin_gap_bps: "priced_margin_bps minus hurdle_margin_bps, bps; negative = priced below the standalone hurdle."
    standalone_rorwa: "Lending-only RoRWA at the priced margin: (margin and commitment-fee revenue - cost - expected loss) / RWA, fraction (0.012 = 1.2%)."
    meets_standalone_hurdle: "True when the priced margin is at or above the hurdle margin, i.e. standalone RoRWA of at least 1.2%."
    pricing_status: "Band of margin_gap_bps. Values: Above hurdle (+25 bps or more), At hurdle (-25 to +25 bps), Below hurdle (below -25 bps)."
    origination_raroc: "RAROC at signing including the deal's share of client ancillary revenue, fraction (0.12 = 12%), capped -0.25 to 1.0; hurdle 12%."
    approved_below_hurdle: "True when the deal was approved with origination RAROC below the 12% hurdle (a pricing exception)."
    realised_raroc: "Average relationship RAROC over up to four quarters after signing (history from FY2024), fraction; null if fewer than two quarters."
    caught_up: "True when an exception deal's realised RAROC has reached the 12% hurdle; null if not an exception or not yet seasoned."
    exception_approver: "Authority that approved the below-hurdle pricing. Values: Credit Committee, Regional CRO, Head of Coverage, Deputy CCO; null if no exception."
    exception_reason: "Reason for approving below-hurdle pricing. Values: Relationship, Strategic Client, Competitive Pricing, Cross-sell Commitment; null if no exception."
  fin_relationship_pnl:
    obligor_id: "Obligor id issued by the credit workflow; identifies the borrower. One row per obligor per fiscal quarter."
    fiscal_year: "Bank fiscal year (April-March); FY2026 = Apr-2026 to Mar-2027."
    fiscal_quarter: "Bank fiscal quarter. Values: 1 (Apr-Jun), 2 (Jul-Sep), 3 (Oct-Dec), 4 (Jan-Mar)."
    fiscal_quarter_label: "Bank fiscal quarter label, e.g. FY2026-Q2 = Jul-Sep 2026."
    segment: "Client segment. Values: Japanese Corporate, Non-Japanese Large Corporate, Sponsor & Structured Finance, Financial Institution, Public Sector."
    relationship_tier: "Relationship coverage tier. Values: Strategic, Core, Transactional."
    industry_sector: "Client industry sector, e.g. Automotive, Energy, Materials, Real Estate, Technology, Trading Houses."
    industry_subsector: "Client industry subsector (defines the credit peer group), e.g. Advanced Materials."
    ead: "Average exposure at default over the quarter: drawn plus 50% of the undrawn limit, USD."
    rwa: "Risk-weighted assets for the quarter: ead * grade risk weight, USD."
    economic_capital: "Economic (unexpected-loss) capital for the quarter: ead * grade-based capital rate, USD."
    book_equity: "Book equity allocated to the relationship: 9% of ead, USD."
    internal_grade: "Internal grade applied for the quarter (quarter average, rounded), 1 (best) to 10 (default); drives PD, risk weight and capital."
    rev_lending: "Quarterly lending revenue: margin income on drawn balances plus commitment and amortised arrangement fees, USD."
    rev_deposits: "Quarterly deposit revenue: net interest spread earned on CASA and term-deposit balances, USD."
    rev_payments: "Quarterly payments revenue: per-payment fees plus fees on cross-border payment value, USD."
    rev_other: "Quarterly other transaction-banking and advisory revenue, including structuring and agency fees for Sponsor & Structured Finance, USD."
    revenue_total: "Total quarterly revenue: rev_lending + rev_deposits + rev_payments + rev_other, USD."
    cost_to_serve: "Quarterly cost to serve: tier-based coverage cost plus per-account and per-payment costs, USD."
    expected_loss: "Quarterly expected loss: PD * LGD * ead / 4, USD."
    net_profit: "Quarterly net profit: revenue_total - cost_to_serve - expected_loss, USD."
    net_profit_annualised: "Annualised net profit (net_profit * 4), USD; numerator of rorwa, raroc and roe."
    rorwa: "Return on RWA: net_profit_annualised / rwa, fraction (0.012 = 1.2%), capped at -0.25 and 1.0. Hurdle 1.2%."
    raroc: "Risk-adjusted return on capital: net_profit_annualised / economic_capital, fraction, capped at -0.25 and 1.0. Hurdle 12%."
    roe: "Relationship return on equity: net_profit_annualised / book_equity, fraction, capped at -0.25 and 1.0. Hurdle 10%."
    below_rorwa_hurdle: "True when RoRWA, before capping, is below the 1.2% hurdle."
    below_raroc_hurdle: "True when RAROC, before capping, is below the 12% hurdle."
    below_roe_hurdle: "True when ROE, before capping, is below the 10% hurdle."
  fin_client_revenue:
    client_source_system: "System of the client record that books all of the client's revenue. Values: credit_obligor (borrowers), core_customer, tsy_counterparty, trade_party, in that priority."
    client_source_id: "Client id issued by client_source_system (obligor_id, cust_no, cpty_id or party_id) for the record booking the revenue."
    month: "Revenue month (first day of the month)."
    fiscal_year: "Bank fiscal year (April-March) of the month; FY2026 = Apr-2026 to Mar-2027."
    fiscal_quarter: "Bank fiscal quarter. Values: 1 (Apr-Jun), 2 (Jul-Sep), 3 (Oct-Dec), 4 (Jan-Mar)."
    business_line: "Values: Lending (Corporate Lending), Transaction Banking (Cash, Liquidity, Payments, Trade Finance), Markets (FX)."
    product_family: "Values: Corporate Lending, Cash (CASA deposits), Liquidity (term deposits), Payments, Trade Finance, FX."
    nii_usd: "Net interest income for the month, USD: lending margin on drawn balances, or deposit spread on Cash and Liquidity balances."
    fee_usd: "Fee income for the month, USD: lending commitment and arrangement fees, payment fees or trade finance commissions."
    trading_usd: "FX trading revenue for the month, USD; 0 for other product families."
    total_revenue_usd: "Total revenue for the month: nii_usd + fee_usd + trading_usd, USD."
    activity_basis_usd: "Volume behind the revenue, USD: drawn balance (lending), deposit balance, FX notional or trade amount; for Payments it is the number of payments, not USD."
    is_pnl_reconciled: "True when the row is allocated so the obligor's quarterly lending, deposit and payment revenue ties exactly to fin_relationship_pnl."
  fin_cost_allocation:
    client_source_system: "System of the client record that books the client's revenue and cost. Values: credit_obligor (borrowers), core_customer, tsy_counterparty, trade_party, in that priority."
    client_source_id: "Client id issued by client_source_system (obligor_id, cust_no, cpty_id or party_id) for the record bearing the cost."
    month: "Cost month (first day of the month)."
    fiscal_year: "Bank fiscal year (April-March) of the month; FY2026 = Apr-2026 to Mar-2027."
    fiscal_quarter: "Bank fiscal quarter. Values: 1 (Apr-Jun), 2 (Jul-Sep), 3 (Oct-Dec), 4 (Jan-Mar)."
    product_family: "Product family the cost is allocated to. Values: Corporate Lending, Cash, Liquidity, Payments, Trade Finance, FX."
    direct_cost_usd: "Direct product-desk cost allocated to the product family by revenue share, USD."
    rm_cost_usd: "Relationship-manager coverage cost allocated to the product family by revenue share, USD."
    operations_cost_usd: "Operations cost, USD: account maintenance (mainly on Cash and Liquidity) and payment processing (mainly on Payments)."
    ho_allocation_usd: "Head-office overhead allocated to the product family by revenue share, USD."
    total_cost_usd: "Total monthly cost to serve for the product family: direct + RM + operations + head-office allocation, USD."
    is_pnl_reconciled: "True when the client-month cost is allocated to reconcile exactly with the obligor's quarterly fin_relationship_pnl.cost_to_serve."

  # ---- early warning, external data, reference ---------------------------------------------------------
  ews_override:
    override_id: "Unique id of the analyst override on an obligor's EWS band, issued by the early-warning system (e.g. EWS-OVR-0013)."
    obligor_id: "Credit-workflow obligor id (e.g. CRD-000123) whose model band was overridden; joins ews_score.obligor_id."
    override_date: "Date the override was recorded; it applies from this date until expiry_date."
    analyst: "Credit analyst who recorded the override. Values: K. Watanabe, R. Sharma, M. Tan, A. Reddy, S. Goh, J. Park, L. Mehta, H. Ito."
    system_band: "Model EWS band computed from the composite score when the override was made. Values: Green, Amber, Red."
    override_band: "Band set by the analyst; replaces the model band in ews_score.final_band while the override is in force. Values: Green, Amber, Red."
    direction: "Effect on the model band. Values: Escalate (to a riskier band), Affirm (model band confirmed), Soften (to a less risky band)."
    lead_category: "Score component contributing most to the model score at the time of override. Values: Credit, Liquidity, Behavioural, External."
    rationale: "Free-text analyst justification for the override, e.g. model alert affirmed on review, or parent support confirmed from Japan head-office data."
    expiry_date: "Date the override lapses, after which the model band applies again; typically 90 days after override_date."
    status: "Override state. Values: Active (in force), Superseded (replaced by a later override for the same obligor)."
    source_data_stale: "True when a source feed the override relied on, such as the Tokyo parent-rating share, was stale on the override date."
    evidence_ref: "Id of the supporting document, e.g. a Tokyo parent support letter (joins share_jp_support_letters.letter_id); null when none is cited."
  ews_score:
    obligor_id: "Credit-workflow obligor id (e.g. CRD-000123) of the scored borrower; joins other EWS and credit tables on obligor_id."
    score_date: "Calendar date of the score; one row per obligor per day, weekends included, from 2025-04-01 to the as-of date."
    composite_score: "Early-warning composite score 0-100 (higher = riskier) blending credit health, utilisation, covenant headroom, deposit outflow and wallet leakage. Green < 40, Amber 40-69, Red >= 70."
    band: "Model band from composite_score before analyst overrides: Green < 40, Amber 40-69, Red >= 70. Values: Green, Amber, Red."
    final_band: "Band after any analyst override in force on score_date (otherwise equals band); use for watchlist reporting. Values: Green, Amber, Red."
    is_overridden: "True when an analyst override (ews_override) is in force on score_date, so final_band comes from the override."
    credit_component: "Credit sub-score 0-100 (higher = riskier) from credit health (50%), facility utilisation (30%) and covenant headroom (20%); monthly value repeated daily."
    liquidity_component: "Liquidity sub-score 0-100 from month-on-month deposit outflow: 0 with no outflow, 100 at a fall of 25% or more; monthly value repeated daily."
    behavioural_component: "Behavioural sub-score 0-100 from the share of payment value routed to other banks: 0 at 30% or below, 100 at 70% or above."
    external_component: "External sub-score 0-100 from average monthly news sentiment: 0 when neutral or positive, 100 at -0.6 or worse. Informational; not part of composite_score."
    prev_day_band: "Model band (band) on the previous day; null on the first day of the obligor's series. Values: Green, Amber, Red."
    score_30d_delta: "Change in composite_score versus 30 days earlier, in points (positive = deteriorating); null for the first 30 days of the series."
    is_watchlisted: "True when final_band is Amber or Red, i.e. the obligor is on the EWS watchlist that day."
  ews_signal:
    obligor_id: "Credit-workflow obligor id (e.g. CRD-000123) for which the trigger fired; joins ews_score.obligor_id."
    signal_month: "Month in which the trigger fired (first day of month); triggers are evaluated monthly."
    trigger_code: "Code of the trigger that fired, e.g. UTIL_HIGH, COV_BREACH, DPD_30; joins ews_trigger_catalog.trigger_code."
    category: "Score component the trigger belongs to. Values: Credit, Liquidity, Behavioural, External."
    signal_value: "Observed metric; unit depends on trigger_code: fraction (utilisation, covenant headroom, deposit change with negative = outflow, wallet share, health drop), days past due, news sentiment -1..1 or grade notches."
    severity: "Severity of this trigger hit. Values: Low, Medium, High."
    points_contributed: "Approximate points the trigger adds to the 0-100 composite score (up to 20); 0 for informational triggers such as days past due and adverse news."
    detail: "Plain-English explanation of the hit with the observed value, e.g. 'Utilisation 99% of committed limit.'"
  ews_trigger_catalog:
    trigger_code: "Unique code of the early-warning trigger rule, e.g. UTIL_HIGH; joins ews_signal.trigger_code."
    trigger_name: "Display name of the trigger including its threshold, e.g. 'Facility utilisation >= 90%'."
    category: "Score component the trigger feeds. Values: Credit, Liquidity, Behavioural, External."
    default_severity: "Severity assigned when the trigger fires. Values: Low, Medium, High."
    threshold_desc: "Firing rule in plain text: the metric and threshold tested, with ratios as decimals (0.90 = 90%)."
    description: "One-line plain-English meaning of the trigger, e.g. 'Severe deposit flight.'"
    is_active: "True when the trigger is live in the rule book and evaluated; inactive triggers never fire."
  ews_watchlist:
    obligor_id: "Credit-workflow obligor id (e.g. CRD-000123) of the borrower on the watchlist; joins ews_score.obligor_id."
    as_of_date: "Snapshot date of the watchlist (the as-of date, 2026-09-30)."
    band: "Final watchlist band after analyst overrides. Values: Amber, Red."
    model_band: "Band from the model composite score before overrides; Green where an analyst escalated the name onto the watchlist. Values: Green, Amber, Red."
    composite_score: "Model composite EWS score 0-100 (higher = riskier) for the as-of month."
    lead_category: "Score component contributing most to the composite score. Values: Credit, Liquidity, Behavioural, External."
    lead_reason: "Plain-English reason matching lead_category. Values: Credit deterioration (health / utilisation / covenant), Deposit outflow, Wallet migration to competitors, Adverse external news."
    months_on_watch: "Consecutive months, including the as-of month, with an Amber or Red final band; history starts Apr-2024, so the maximum is 30."
    owner_rm: "Code of the relationship manager who owns the watchlist follow-up (RM001-RM120); same code set as CRM rm_code."
    review_date: "Next scheduled watchlist review date, 30 days after as_of_date."
    status: "Watchlist status. Values: New (first month on watch), Active (on watch two months or more)."
  ews_watchlist_event:
    event_id: "Unique watchlist event id issued by the early-warning system (e.g. WLE-000123)."
    obligor_id: "Credit-workflow obligor id (e.g. CRD-000123) whose final band changed; joins ews_score.obligor_id."
    event_date: "Date the watchlist change was recorded, in the first week of the month in which the final band changed."
    event_type: "Type of watchlist change. Values: Added (Green to Amber/Red), Removed (back to Green), Escalated (Amber to Red), De-escalated (Red to Amber)."
    band_from: "Final band before the event. Values: Green, Amber, Red."
    band_to: "Final band after the event. Values: Green, Amber, Red."
    composite_score: "Model composite EWS score 0-100 (higher = riskier) for the month of the event."
    lead_category: "Score component contributing most at the time of the event. Values: Credit, Liquidity, Behavioural, External."
    lead_reason: "Plain-English reason matching lead_category. Values: Credit deterioration (health / utilisation / covenant), Deposit outflow, Wallet migration to competitors, Adverse external news."
    owner_rm: "Code of the relationship manager who owns the follow-up (RM001-RM120); same code set as CRM rm_code."
    action_type: "Follow-up action required. Values: Watchlist credit review (Added), Recovery / exit plan (Escalated), Monitoring update (De-escalated); null for Removed events."
    action_due_date: "Due date of the follow-up action: 30 days after event_date, 21 days for a recovery / exit plan; null when no action is required."
    action_completed_date: "Date the follow-up action was completed; null when it is still open or no action is required."
    action_status: "Follow-up status at the as-of date. Values: Completed, Open (not yet due), Overdue (past due, not completed); null when no action is required."
    days_overdue: "Days an uncompleted action is past action_due_date at the as-of date (2026-09-30); 0 when completed, not yet due or no action."
  ext_issuer:
    issuer_id: "Market-data vendor issuer id (e.g. SYN-ISS-0001) of a listed or rated client-group parent; joins ext_rating, ext_market_daily and ext_news on issuer_id."
    issuer_name: "Issuer name as carried by the vendor, including legal form (e.g. KK, Ltd, Berhad)."
    parent_company_id: "Global group id (e.g. SYN-G-0001) of the client group this issuer heads; matches ext_company_master.parent_company_id and share_jp_group_master.global_group_id."
    hq_country: "ISO 3166 alpha-2 code of the group's headquarters country, e.g. JP, SG."
    industry_sector: "Industry sector of the issuer's group, e.g. Materials, Technology; same taxonomy as ref_industry_peer.industry_sector."
    issuer_type: "Issuer classification. Values: Listed Parent (exchange-listed), Rated Issuer (rated but not listed)."
    is_listed: "True when the issuer's shares are exchange-listed; only listed issuers have ticker, listing details and daily market data."
    ticker: "Exchange ticker with venue suffix (e.g. SYN0001.TK); joins ext_market_daily.ticker; null for unlisted issuers."
    listing_venue: "Stock exchange where the shares are listed, named by city (e.g. Tokyo, Singapore); null for unlisted issuers."
    listing_currency: "ISO 4217 code of the currency the shares trade in; null for unlisted issuers."
    shares_outstanding: "Number of shares outstanding (count); null for unlisted issuers."
    listing_date: "Date the shares were first listed on the exchange; null for unlisted issuers."
    is_cds_reference: "True when the issuer is a CDS reference entity with a daily spread in ext_market_daily.cds_spread_bps; currently all listed issuers."
  ext_market_daily:
    issuer_id: "Vendor issuer id of the listed parent; joins ext_issuer.issuer_id."
    ticker: "Exchange ticker of the listed parent (e.g. SYN0001.TK); joins ext_issuer.ticker."
    trade_date: "Trading date (Monday to Friday) from 2025-04-01 to the as-of date; one row per issuer per day."
    currency: "ISO 4217 listing currency of close_price, high_52w, low_52w and market_cap_lcy."
    close_price: "Closing share price in the listing currency."
    daily_return: "Close-to-close return versus the previous trading day, as a fraction (0.01 = +1%)."
    volatility_30d: "Annualised volatility of daily returns over the last 21 trading days (about 30 calendar days), as a fraction (0.25 = 25%)."
    volume: "Number of shares traded on the day."
    market_cap_lcy: "Market capitalisation (close_price x shares outstanding) in the listing currency."
    market_cap_usd: "Market capitalisation in USD, converted at the day's FX rate."
    cds_spread_bps: "CDS-style credit spread on the issuer in basis points; higher = riskier."
    high_52w: "Highest closing price over the last 252 trading days (52 weeks), in the listing currency."
    low_52w: "Lowest closing price over the last 252 trading days (52 weeks), in the listing currency."
  ext_news:
    news_id: "News vendor item id (e.g. NWS-0000001), unique per article."
    published_date: "Date the item was published."
    published_ts: "Date and time the item was published."
    company_id: "External company-master id (e.g. EXT-000001) of the APAC company the item is about; joins ext_company_master.company_id."
    issuer_id: "Vendor issuer id of the company's listed or rated group parent; joins ext_issuer.issuer_id; null when the group has no issuer record."
    outlet: "Publication or feed that carried the item, e.g. Pacific Business Wire, RegWatch Asia."
    source_type: "Type of source. Values: Business Press, Newswire, Company Filing, Trade Press, Regulatory Notice."
    headline: "Headline of the news item."
    summary: "Short summary of the news item, up to about 40 words."
    topic: "Main news topic. Values: Earnings, Expansion, M&A, Regulatory, Management Change, Rating Action, Litigation, ESG Controversy, Supply-Chain Disruption."
    subtopic: "Finer topic label, e.g. Coal Regulation, AI Demand; for Rating Action items the agency action, e.g. Upgrade, Downgrade."
    raw_sentiment: "Vendor sentiment score from -1 (very negative) to +1 (very positive); 0 = neutral. A company's monthly average <= -0.3 fires the NEWS_NEGATIVE trigger."
    relevance: "Vendor relevance of the item to the company, 0-1 (higher = more specifically about it); sector round-ups score lowest."
    region: "ISO 3166 alpha-2 code of the APAC country where the company is booked, e.g. SG, HK."
    language: "Language of the item. Values: en."
  ext_rating:
    rating_id: "Rating-agency feed id of the rating action (e.g. RTG-000001); one row per issuer, agency and action."
    issuer_id: "Vendor issuer id of the rated parent; joins ext_issuer.issuer_id."
    agency: "Rating agency. Values: Kestrel Ratings, Tsubame Credit Research, Cendana Ratings."
    rating_type: "Type of rating. Values: Long-Term Issuer."
    rating: "Long-term issuer rating after the action, on the AAA to D scale (e.g. A+, BBB-)."
    rating_rank: "Numeric rank of rating: 1 = AAA, 2 = AA+, ..., 10 = BBB-, 22 = D; higher = worse."
    previous_rating: "Rating before this action; equals rating for affirmations, outlook revisions and new ratings."
    outlook: "Rating outlook after the action. Values: Stable, Negative, Positive."
    previous_outlook: "Rating outlook before the action. Values: Stable, Negative, Positive."
    action: "Type of rating action. Values: Affirmed, Outlook Revised, Downgrade, Upgrade, New Rating."
    action_date: "Date the agency announced the rating action."
    notch_change: "Notches moved by the action: positive = upgrade, negative = downgrade, 0 = rating unchanged."
    is_investment_grade: "True when the rating after the action is BBB- or better (rating_rank <= 10)."
    rationale: "Agency's one-sentence reason for the action, e.g. 'Weaker earnings and higher leverage.'"
  ext_trade_statistics:
    record_id: "Trade-statistics vendor record id built from origin, destination, HS chapter and month (e.g. TS-CNVN-85-202604)."
    period_month: "Month the trade flow refers to (first day of month)."
    origin_country: "ISO 3166 alpha-2 code of the exporting (origin) country."
    destination_country: "ISO 3166 alpha-2 code of the importing (destination) country."
    flow_type: "Flow direction, reported as imports into destination_country. Values: Import."
    hs_chapter: "Two-digit Harmonized System chapter code of the goods (text), e.g. 85 = electrical machinery, 27 = mineral fuels."
    hs_description: "Name of the HS chapter, e.g. Machinery and mechanical appliances."
    trade_value_usd: "Value of goods shipped from origin to destination in the month, in USD."
    data_status: "Revision status of the figure. Values: Final, Preliminary (three months before the as-of month), Flash Estimate (as-of month)."
    release_date: "Vendor release date of the figure, about 35 days after month-end (flash estimates: the as-of date); can fall after the as-of date for the latest preliminary month."
    vendor: "Trade-statistics data vendor. Values: Harbourline Trade Analytics."
  ref_booking_entity:
    booking_entity_id: "SMBC booking entity code: ISO country code for the 13 APAC entities (e.g. SG; matches booking_country / booking_location elsewhere) or JP, EMEA, AMER for non-APAC regions."
    city: "City of the booking entity, e.g. Singapore, Mumbai; null for the JP, EMEA and AMER regions."
    country_name: "Country name of the booking location (e.g. Singapore, Hong Kong, Vietnam). Null for the JP, EMEA and AMER provider regions."
    is_apac: "True when the entity is one of the 13 APAC booking entities; false for the JP (Tokyo head office), EMEA and AMER regions."
    is_hub: "True when the booking entity is the APAC regional hub (Singapore)."
    local_currency: "ISO 4217 code of the booking entity's local currency, e.g. SGD; null for the JP, EMEA and AMER regions."
    region_cluster: "Regional grouping of the entity. Values: APAC, JP, EMEA, AMER."
    regulator: "Abbreviation of the local banking regulator, e.g. MAS, HKMA, RBI; null for the JP, EMEA and AMER regions."
  ref_calendar:
    date: "Calendar date; one row per day from 2023-04-01 to 2027-03-31 (FY2023 to FY2026). Join key for date columns."
    day: "Day of the month, 1-31."
    days_before_as_of: "Days from this date to the as-of date 2026-09-30: positive = past, 0 = as-of date, negative = future."
    fiscal_half: "Japanese fiscal half-year. Values: H1 (Apr-Sep), H2 (Oct-Mar)."
    fiscal_month_no: "Month number within the Japanese fiscal year: 1 = April through 12 = March."
    fiscal_quarter: "Japanese fiscal quarter 1-4: Q1 = Apr-Jun, Q2 = Jul-Sep, Q3 = Oct-Dec, Q4 = Jan-Mar."
    fiscal_quarter_label: "Fiscal year and quarter label, e.g. FY2026-Q2 (Jul-Sep 2026)."
    fiscal_year: "Japanese fiscal year (April-March) named by its starting calendar year: 2026 = Apr-2026 to Mar-2027."
    fiscal_year_label: "Fiscal year label. Values: FY2023, FY2024, FY2025, FY2026 (FY2026 = Apr-2026 to Mar-2027)."
    is_business_day_sg: "True when the date is a Singapore business day (Monday to Friday; public holidays are not excluded)."
    is_fytd: "True when the date is in the current fiscal year FY2026 up to the as-of date, i.e. 2026-04-01 to 2026-09-30."
    is_latest_closed_month: "True when the date falls in the latest closed month, the as-of month (September 2026)."
    is_month_end: "True when the date is the last calendar day of its month."
    month: "Calendar month number, 1 = January to 12 = December."
    year: "Calendar year."
  ref_country:
    city: "Main SMBC booking city in the country, e.g. Singapore, Mumbai; Tokyo for JP."
    country_code: "ISO 3166 alpha-2 country code: the 13 APAC booking countries plus JP (Japan, head office)."
    is_apac: "True when the country is one of the 13 APAC booking locations; false for Japan (JP)."
    local_currency: "ISO 4217 code of the country's local currency, e.g. SGD; joins ref_currency.currency_code."
    region_cluster: "Regional grouping. Values: APAC, JP."
    regulator: "Abbreviation of the country's banking regulator, e.g. MAS (Singapore), HKMA (Hong Kong), FSA (Japan)."
  ref_currency:
    currency_code: "ISO 4217 currency code, e.g. JPY, SGD; joins currency columns and fx_rate_daily.currency_code."
    fx_base_per_usd: "Reference FX rate in units of the currency per 1 USD (e.g. 150 for JPY, 1 for USD); daily rates are in fx_rate_daily."
    is_base: "True when the currency is the reporting base currency (USD)."
  ref_industry_peer:
    industry_sector: "Top-level industry sector, e.g. Materials, Financial Institution; groups several subsectors."
    industry_subsector: "Industry subsector, one per row (e.g. Shipping, Semiconductors); the level at which peer groups are defined."
    is_carbon_intensive: "True when the subsector is classified carbon-intensive, e.g. oil, gas and coal, steel, shipping, chemicals."
    peer_group_id: "Internal peer group id (e.g. PG-001), one per industry subsector; joins credit_ratio.peer_group_id and ext_peer_benchmark.peer_group_id."
    sector_limit_usd: "Portfolio concentration limit for the subsector peer group, in USD."

  # ---- CRM, onboarding & KYC ----------------------------------------------------------------------------
  crm_account_plan:
    plan_line_id: "CRM account-plan line id: plan_id plus a product-family code (e.g. AP-2026-CRM-000001-CA = Cash); one row per plan and product family."
    plan_id: "CRM account-plan id (AP-<fiscal year>-<crm_account_id>); one plan per client group and fiscal year, shared by its product-family lines."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) holding the group plan, normally the group lead's account."
    group_ref: "Global client-group id (SYN-G-xxxx) from the group master; the plan covers the whole group."
    fiscal_year: "Japanese fiscal year (Apr-Mar) of the plan, named by its start year (2026 = Apr-2026 to Mar-2027). Values: 2023, 2024, 2025, 2026."
    fiscal_year_label: "Fiscal year label (FY2026 = Apr-2026 to Mar-2027). Values: FY2023, FY2024, FY2025, FY2026."
    product_family: "Product family of the plan line. Values: Corporate Lending, Cash, Liquidity, Payments, Trade Finance, Supply Chain Finance, FX."
    prior_year_actual_usd: "Group's actual revenue in the prior fiscal year for this product family, the base for the target (USD); estimated where that year predates revenue history (e.g. FY2023-FY2024 plans)."
    plan_optimism: "Uplift applied to the prior-year actual to set the target (fraction 0.08-0.12, i.e. 8-12%)."
    planned_revenue_usd: "Original revenue target for the line (USD) = prior_year_actual_usd x (1 + plan_optimism)."
    revised_target_usd: "Revenue target for the line after the mid-year revision (USD); null if the plan was not revised."
    mid_year_revision: "True when the plan's targets were revised during the year (applies to every line of the plan); see revision_date and revision_reason."
    revision_date: "Date the plan's targets were revised mid-year; null if not revised."
    revision_reason: "Mid-year revision reason (null if none): 'H1 refresh: revenue run-rate below plan; targets lowered', 'H1 refresh: new mandates ahead of plan; targets raised', or a client-specific reset."
    actual_revenue_usd: "Group's actual revenue for the plan year and product family (USD); year-to-date (Apr-Sep) for FY2026; null where the year predates revenue history (e.g. FY2023)."
    plan_status: "Plan status. Values: Active (current year), Revised (current year, targets revised), Closed (fiscal year ended)."
    approved_date: "Date the account plan was approved, around the 1 April fiscal-year start."
    owner_rm: "RM code (RM001-RM120) of the account's primary RM when the plan was approved."
    strategic_priority: "Plan priority from the group's relationship tier (Strategic = High, Core = Medium, Transactional = Low). Values: High, Medium, Low."
    wallet_share_target: "Target SMBC share of the group's wallet for this product family (fraction 0-1); null where no wallet estimate exists (e.g. FY2023)."
    plan_objective: "Plan objective text: the fiscal year plus objectives of its two largest product families, e.g. 'FY2026: defend lending share at refinancing; win a larger share of FX hedging.'"
  crm_account_plan_initiative:
    initiative_id: "CRM account-plan initiative id (API-xxxxxx); one row per initiative."
    plan_id: "Account plan the initiative belongs to (AP-<fiscal year>-<crm_account_id>); joins to crm_account_plan.plan_id."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) holding the plan."
    group_ref: "Global client-group id (SYN-G-xxxx) from the group master; the plan's client group."
    fiscal_year: "Japanese fiscal year (Apr-Mar) of the plan, named by its start year (2026 = Apr-2026 to Mar-2027). Values: 2023, 2024, 2025, 2026."
    product_family: "Product family the initiative targets. Values: Corporate Lending, Cash, Liquidity, Payments, Trade Finance, Supply Chain Finance, FX, Sustainable Finance."
    initiative_name: "Short initiative title, e.g. 'Refinance maturing facilities ahead of maturity' or 'Win a larger share of FX hedging'."
    description: "One-line summary: initiative name, client short name and target revenue, e.g. '<initiative> for <client>; target revenue USD 1.2m in FY2026.'"
    target_revenue_usd: "Revenue the initiative aims to deliver in the plan year (USD)."
    status: "Initiative status. Values: Not Started, In Progress, At Risk, Delayed, Completed, Not Achieved, Cancelled; the first four are open."
    due_date: "Target completion date, normally a fiscal-quarter end within the plan year."
    completed_date: "Date the initiative was completed; null unless status is Completed."
    owner_employee_id: "Staff id (SYN-P-xxxx) of the owner: the TB Sales member for Cash, Liquidity, Payments, Trade Finance and Supply Chain Finance initiatives where assigned, else the primary RM."
    owner_rm: "RM code (RM001-RM120) of the account's primary RM at the due date, or at the as-of date if not yet due."
    priority: "Initiative priority from the group's relationship tier. Values: High, Medium, Low."
    linked_opportunity_id: "Pipeline opportunity that delivers the initiative; joins to crm_opportunity.opportunity_id. Null if none."
    created_date: "Date the initiative was created (the plan's approval date)."
  crm_account_team_history:
    assignment_id: "CRM coverage-team assignment id (TMA-xxxxxx); one row per member, role and validity period."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) the team covers."
    team_role: "Role on the coverage team. Values: Primary RM, Secondary RM, Credit Analyst, TB Sales (transaction banking sales)."
    employee_id: "Staff id (SYN-P-xxxx) of the team member; for RMs, SYN-P-0001 to SYN-P-0120 correspond to RM001 to RM120."
    rm_code: "RM code (RM001-RM120) for Primary and Secondary RM rows; null for Credit Analyst and TB Sales."
    member_name: "Full name of the team member."
    member_office: "Coverage office of the team member (country code, e.g. SG, HK, AU)."
    is_primary: "True when the row is a Primary RM assignment."
    valid_from: "Date the assignment started."
    valid_to: "Last day of the assignment; null while still current."
    is_current: "True when the assignment is in force at the as-of date (valid_to is null)."
    change_reason: "Why the assignment began; for RM changes, why the previous RM was replaced. Values: Initial assignment, RM rotation, RM departure, Coverage realignment."
  crm_activity:
    activity_id: "CRM activity id (ACT-xxxxxxx); one row per RM interaction with a client."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) of the client."
    activity_date: "Date the interaction took place."
    activity_type: "Interaction channel. Values: Meeting, Call, Video Call, Email, Site Visit."
    rm_code: "RM code (RM001-RM120) of the RM who held the interaction (the account's primary RM on that date)."
    contact_id: "Client contact involved (CON-xxxxxx); joins to crm_contact.contact_id."
    purpose: "Purpose of the interaction. Values: Relationship Review, Product Discussion, Service Review, Credit Review, Market Update, Account Planning, Courtesy Visit, Signal Follow-up, Deal Progress."
    subject: "Short subject line, e.g. 'USD/SGD market update', 'Follow-up: Deposit surplus', 'Term Loan opportunity - kick-off'."
    product_discussed: "Product discussed, e.g. Term Loan, FX Forward Programme, Cash Management Mandate, Time Deposit; null if no specific product."
    product_family: "Product family of product_discussed. Values: Corporate Lending, Cash, Liquidity, Trade Finance, Supply Chain Finance, FX, Rates, Sustainable Finance; null if none."
    note_text: "Short RM note on the interaction (<= 40 words)."
    raw_tone: "Tone of the interaction as recorded with the note. Values: Positive, Neutral, Negative."
    sentiment_score: "Sentiment score of the note, from -1 (very negative) to 1 (very positive); consistent with raw_tone."
    action_required: "True when the interaction has a follow-up action (next_action)."
    next_action: "Agreed follow-up action, e.g. Send indicative terms, Prepare proposal, Schedule next quarterly review; null if none."
    next_action_due_date: "Due date of the follow-up action; null if none."
    next_action_status: "Follow-up status. Values: Completed (RM back in touch later), Open (not yet due), Overdue (past due); null if no action."
    related_signal_id: "Signal followed up in this activity; joins to crm_signal.signal_id. Null otherwise."
    related_opportunity_id: "Opportunity discussed in this activity; joins to crm_opportunity.opportunity_id. Null otherwise."
    duration_minutes: "Length of the interaction in minutes; null for emails."
  crm_contact:
    contact_id: "CRM contact id (CON-xxxxxx); one row per client contact."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) the contact belongs to."
    first_name: "Contact's given name."
    last_name: "Contact's family name."
    full_name: "Contact's full name (given and family name)."
    job_title: "Contact's job title, e.g. Chief Financial Officer, Group Treasurer, Head of Procurement, Finance Manager."
    function: "Business function of the contact, e.g. Finance, Treasury, Executive, Procurement, Operations, Risk."
    contact_role: "Standard CRM contact role. Values: CFO, Treasurer, CEO, Procurement Head, Other."
    seniority: "Seniority of the contact. Values: C-Suite, Head, Manager."
    is_primary: "True when this is the account's primary contact (one per account)."
    email: "Contact's business email address."
    preferred_channel: "Contact's preferred channel. Values: Email, Phone, Meeting."
    relationship_strength: "Strength of the RM relationship with the contact, from their share of the account's RM activities (Strong >= 30%, Medium >= 10%). Values: Strong, Medium, Weak."
    created_date: "Date the contact was created in the CRM."
    is_active: "True when the contact is still active; false once marked inactive (see inactive_since)."
    inactive_since: "Date the contact was marked inactive; null while active."
  crm_nbp_score:
    crm_account_id: "CRM platform account id (CRM-xxxxxx) of the client scored."
    score_month: "Month-end date of the scoring run; covers the last six months, 2026-04-30 to 2026-09-30."
    product: "Product scored, e.g. Term Loan, Trade Finance Line, FX Forward Programme, Cash Pooling."
    product_family: "Product family of the product. Values: Corporate Lending, Cash, Liquidity, Trade Finance, Supply Chain Finance, FX, Rates, Sustainable Finance."
    propensity: "Modelled propensity that the client takes up the product (0-1 score)."
    rank: "Product's rank for the client in that month by propensity (1 = highest); top three kept. Values: 1, 2, 3."
    top_drivers: "Top score drivers (up to three, separated by ' | '), e.g. '25% of Insurance peers hold FX', a recent signal, credit health or group size."
    expected_revenue_usd: "Expected revenue if the client takes up the product (USD), based on a typical deal size for the client and the product's yield."
    model_version: "Next-best-product model version. Values: NBP-3.1."
    owner_rm: "RM code (RM001-RM120) of the account's primary RM at the score month-end."
  crm_next_best_product:
    crm_account_id: "CRM platform account id (CRM-xxxxxx) of the client; up to three recommendations per account."
    owner_rm: "RM code (RM001-RM120) of the account's primary RM."
    rank: "Recommendation rank for the client (1 = highest propensity). Values: 1, 2, 3."
    recommended_product: "Product recommended, e.g. Term Loan, Trade Finance Line, Supply Chain Finance, Cash Pooling."
    product_family: "Product family of the recommended product. Values: Corporate Lending, Cash, Liquidity, Trade Finance, Supply Chain Finance, FX, Rates, Sustainable Finance."
    rationale: "Main driver of the recommendation (first of crm_nbp_score.top_drivers), e.g. '25% of Insurance peers hold FX' or 'Deposit surplus (Aug-2026)'."
    propensity_score: "Modelled propensity that the client takes up the product (0-1 score)."
    expected_revenue_usd: "Expected revenue if the client takes up the product (USD), based on a typical deal size for the client and the product's yield."
    segment: "Client segment. Values: Japanese Corporate, Non-Japanese Large Corporate, Financial Institution, Sponsor & Structured Finance, Public Sector."
    score_month: "Month-end of the scoring run the picks come from (latest run). Values: 2026-09-30."
    model_version: "Next-best-product model version. Values: NBP-3.1."
  crm_opportunity:
    opportunity_id: "CRM opportunity id (OPP-xxxxxx); one row per pipeline opportunity."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) of the client."
    owner_rm: "RM code (RM001-RM120) owning the opportunity: the account's primary RM at close, or currently if open."
    product: "Product being sold, e.g. Term Loan, Revolving Credit Facility, FX Forward Programme, Supply Chain Finance, Green Loan."
    product_family: "Product family of the product. Values: Corporate Lending, Cash, Liquidity, Trade Finance, Supply Chain Finance, FX, Rates, Sustainable Finance."
    stage: "Sales stage. Values: Prospecting, Qualification, Proposal, Negotiation, Won, Lost."
    status: "Pipeline status. Values: Open, Won, Lost."
    win_probability: "Stage-based win probability (fraction 0-1): Prospecting 0.1, Qualification 0.25, Proposal 0.45, Negotiation 0.7, Won 1, Lost 0. Weighted pipeline = amount_usd x win_probability."
    amount_usd: "Deal size (USD): facility limit, notional or programme size."
    expected_revenue_usd: "Expected revenue from the deal if won (USD), from amount_usd and the product's typical yield; not probability-weighted."
    created_date: "Date the opportunity was opened in the CRM."
    expected_close_date: "Expected close date; equals actual_close_date once closed, and may be past for slipped open deals."
    actual_close_date: "Date the opportunity was won or lost; null while open."
    lost_reason: "Why the deal was lost (null unless Lost). Values: Pricing, Lost to Competitor, Client Deferred, Structure / Terms, Credit Declined."
    source_type: "How the opportunity originated. Values: RM Originated, Signal, Client Request, Referral."
    source_signal_id: "Signal the opportunity was converted from; joins to crm_signal.signal_id. Null unless source_type is Signal."
    segment: "Client segment. Values: Japanese Corporate, Non-Japanese Large Corporate, Financial Institution, Sponsor & Structured Finance, Public Sector."
    relationship_tier: "Client relationship tier. Values: Strategic, Core, Transactional."
    booking_country: "Client's booking country code, e.g. SG, HK, AU, IN."
  crm_signal:
    signal_id: "CRM opportunity-signal id (SIG-xxxxxx); one row per signal."
    crm_account_id: "CRM platform account id (CRM-xxxxxx) of the client the signal is about."
    signal_code: "Signal type code. Values: FX_FLOW_VIA_OTHER_BANK, LOAN_SERVICE_TO_OTHER_BANK, TRADE_CORRIDOR_GROWTH, SCF_ANCHOR_CANDIDATE, DEPOSIT_SURPLUS, FACILITY_MATURING_12M, SLL_ELIGIBLE, PRODUCT_GAP_VS_PEERS, CAPEX_NEWS, MA_NEWS."
    signal_name: "Readable name of the signal type, e.g. FX flow via other bank, Deposit surplus, Facility maturing in 12 months, M&A news."
    signal_category: "Signal category. Values: Wallet Leakage, Peer Gap, Growth, Liquidity, Refinancing, Sustainability, News."
    polarity: "Signal polarity; every signal here is an opportunity. Values: Opportunity."
    source_quadrant: "Customer 360 quadrant of the evidence. Values: Internal Quantitative (bank transactions, balances, facilities), External Qualitative (news)."
    detected_date: "Date the signal was detected."
    strength: "Signal strength (0-1 score); higher means larger or clearer evidence."
    confidence: "Confidence that the signal reflects a real opportunity (0-1 score); for news signals, the article's relevance."
    estimated_revenue_usd: "Estimated annual revenue opportunity if the signal converts (USD)."
    observed_amount_usd: "Observed amount behind the signal (USD), e.g. annual flows via other banks, 6-month corridor trade, deposit surplus, maturing facility limit or reported deal size; null if none."
    metric_value: "Signal-specific measure: YoY corridor growth, deposit surplus vs 6-month average or peer adoption share (fractions), loan repayment count, or news sentiment; null if unused."
    currency_pair: "Currency pair of FX flows routed via other banks (e.g. USD/VND); FX_FLOW_VIA_OTHER_BANK signals only, else null."
    corridor_origin: "Origin country code of the trade corridor (e.g. CN); TRADE_CORRIDOR_GROWTH signals only, else null."
    corridor_destination: "Destination country code of the trade corridor (e.g. VN); TRADE_CORRIDOR_GROWTH signals only, else null."
    related_ref: "Source record: facility id (FAC-..., credit_facility_terms) for FACILITY_MATURING_12M / SLL_ELIGIBLE, news id (NWS-..., ext_news) for CAPEX_NEWS / MA_NEWS; else null."
    recommended_product: "Product the signal suggests offering, e.g. FX Forward Programme, Time Deposit, Trade Finance Line, Term Loan, Supply Chain Finance."
    signal_detail: "Short evidence text (<= 240 characters), e.g. flows, balances or maturities observed; news signals quote the headline."
    owner_rm: "RM code (RM001-RM120) of the account's primary RM when the signal was detected."
    status: "Follow-up status. Values: New (not yet actioned), Actioned (followed up, outcome pending), Converted (opportunity opened), Dismissed."
    status_date: "Date the signal reached its current status (the detection date while New)."
    actioned_date: "Date the RM first acted on the signal (follow-up or dismissal); null if never actioned."
    actioned_by: "RM code (RM001-RM120) of the RM who acted on the signal; null if never actioned."
    dismissed_reason: "Why the signal was dismissed (null unless Dismissed), e.g. Expired - no RM action, No opportunity after follow-up, Below materiality, Client not interested."
    linked_opportunity_id: "Opportunity opened from the signal; joins to crm_opportunity.opportunity_id. Null unless converted."
    detection_engine: "System that raised the signal. Values: signal_engine (client behaviour analytics), news_alerts (news monitoring)."
  crm_wallet_estimate:
    wallet_id: "CRM wallet-estimate id (WAL-xxxxxx); one row per client group, fiscal year and product family."
    group_ref: "Global client-group id (SYN-G-xxxx) from the group master; wallets are estimated per group."
    crm_account_id: "CRM account (CRM-xxxxxx) the group's wallet is recorded on, normally the group lead's; null when the group has no CRM account."
    fiscal_year: "Japanese fiscal year (Apr-Mar) of the estimate, named by its start year (2026 = Apr-2026 to Mar-2027). Values: 2024, 2025, 2026."
    fiscal_year_label: "Fiscal year label (FY2026 = Apr-2026 to Mar-2027). Values: FY2024, FY2025, FY2026."
    product_family: "Product family of the wallet. Values: Corporate Lending, Cash, Liquidity, Payments, Trade Finance, Supply Chain Finance, FX."
    estimated_wallet_usd: "Estimated total annual revenue the group pays all banks for this product family (USD, full-year basis)."
    smbc_revenue_usd: "SMBC's actual revenue from the group in this product family (USD): full year, or H1 year-to-date for FY2026 (see smbc_revenue_basis)."
    smbc_revenue_basis: "Period behind smbc_revenue_usd. Values: Full Year, H1 YTD (FY2026, Apr-Sep)."
    share_of_wallet: "SMBC's share of the group's wallet for the family (fraction 0-1, full-year basis); 0 where the family is not banked with SMBC."
    top_competitor_bank: "Largest competitor bank in this wallet. Values: Nordlys Bank, Astra Union Bank, Blue Harbour Bank, Garuda Commercial Bank, Meridian Pacific Bank, Solaris Bank, Everest Mercantile Bank, Cathay Delta Bank."
    top_competitor_share: "Estimated share of the wallet held by the top competitor bank (fraction 0-1)."
    estimation_method: "How the wallet was sized. Values: Bottom-up from client flows, Peer benchmark (family not banked with SMBC), Treasury FX wallet estimate."
    estimate_date: "Date of the estimate: 30 April after year-end for closed fiscal years, 2026-09-30 for FY2026. Values: 2025-04-30, 2026-04-30, 2026-09-30."
  kyc_case:
    case_id: "Onboarding case id (ONB-xxxxx) from the KYC platform; one row per case."
    applicant_id: "Applicant (prospect) id (APP-xxxxx) issued by the KYC platform at intake; one per case."
    kyc_id: "KYC platform customer id (KYC-xxxxxx), assigned once the client is onboarded; null for applicants that never went live."
    applicant_name: "Legal name of the applicant entity."
    booking_country: "Country code where the client is to be booked, e.g. SG, HK, AU, IN."
    segment: "Client segment of the applicant. Values: Japanese Corporate, Non-Japanese Large Corporate, Financial Institution, Sponsor & Structured Finance, Public Sector."
    products_requested: "Products requested, separated by '; ', e.g. 'Current Account; Payments; Time Deposit'."
    primary_product: "Main product requested (first in products_requested). Values: Current Account, Correspondent Account (financial institutions)."
    request_date: "Date the onboarding request was received (case start)."
    current_stage: "Stage the case is in, or ended in if withdrawn or rejected; Complete once live and transacting. Values: Complete, KYC Docs, Screening, Risk Assessment, Credit/Product Approval, Account Open."
    status: "Case status. Values: Open (in progress), Live (onboarded), Withdrawn, Rejected."
    status_date: "Date the case reached its status: go-live (first account opened) for Live, withdrawal or rejection date otherwise; null while Open."
    blocker_reason: "Open-case blocker (null otherwise). Values: Awaiting Client Documents, UBO Verification Pending, Screening Hit Under Review, Enhanced Due Diligence, Credit Approval Pending, Account Setup in Progress, Workflow Migration Backlog."
    outcome_reason: "Withdrawal or rejection reason (null otherwise). Values: Client Withdrew - Timeline, Client Withdrew - Pricing, Documents Not Provided, Mandate Awarded to Another Bank, Screening True Match, Outside Risk Appetite, Credit Declined."
    documents_outstanding: "Number of requested KYC documents still outstanding (count)."
    owner_id: "Staff id (SYN-P-xxxx) of the onboarding officer who owns the case."
    rm_code: "RM code (RM001-RM120) of the relationship manager sponsoring the onboarding."
    intake_group_match: "True when intake linked the applicant to an existing client group; false for new groups or links missed at intake."
    intake_group_ref: "Global client-group id (SYN-G-xxxx) matched at intake; null if no match."
  kyc_case_stage:
    case_id: "Onboarding case (ONB-xxxxx); joins to kyc_case.case_id."
    stage_no: "Stage order, 1 (Request) to 7 (First Transaction); stages 1-6 make up days to go-live."
    stage_name: "Onboarding stage. Values: Request, KYC Docs, Screening, Risk Assessment, Credit/Product Approval, Account Open, First Transaction (go-live to first transaction)."
    entered_date: "Date the case entered the stage."
    exited_date: "Date the case left the stage; null while the case is still in it."
    days_in_stage: "Days spent in the stage, counted to the as-of date if not yet exited."
    sla_days: "Service-level target for the stage in days: Request 2, KYC Docs 10, Screening 5, Risk Assessment 5, Credit/Product Approval 7, Account Open 3, First Transaction 30."
    is_sla_met: "True when days_in_stage is within sla_days (so far, for a stage still in progress)."
    is_current: "True when the case is currently in this stage (not yet exited)."
    actor_id: "Staff id (SYN-P-xxxx) of the onboarding officer handling the stage."
    kyc_id: "KYC platform customer id of the case (added by silver from kyc_case); null for applicants without a KYC record."
  kyc_document:
    document_id: "Document request id: case_id plus sequence (e.g. ONB-00001-D01); one row per document requested."
    case_id: "Onboarding case (ONB-xxxxx) the document is for; joins to kyc_case.case_id."
    document_type: "Type of KYC document, e.g. Certificate of Incorporation, UBO Declaration, Board Resolution, Audited Financial Statements, Banking Licence (financial institutions)."
    is_mandatory: "True when the document is mandatory for the case (every type except Group Structure Chart)."
    requested_date: "Date the document was requested from the client (start of the KYC Docs stage)."
    received_date: "Date the document was received; null if not received."
    status: "Document status. Values: Received, Outstanding (still awaited), Waived, Cancelled (case ended before receipt)."
    kyc_id: "KYC platform customer id of the case (added by silver from kyc_case); null for applicants without a KYC record."
  kyc_feedback:
    feedback_id: "Onboarding survey response id (FBK-xxxxx); one row per response."
    case_id: "Onboarding case surveyed (ONB-xxxxx); joins to kyc_case.case_id."
    kyc_id: "KYC platform customer id (KYC-xxxxxx) of the newly onboarded client."
    survey_date: "Date the client answered the post-go-live survey (14-45 days after go-live)."
    score: "Satisfaction score from 1 (very poor) to 5 (excellent). Values: 1, 2, 3, 4, 5."
    comment_text: "Client's short free-text comment on the onboarding experience (<= 40 words)."
    theme: "Main theme of the comment. Values: Turnaround Time, Document Requests, Communication, Digital Portal, Relationship Manager, Account Setup."
  kyc_review:
    review_id: "KYC review id (KYR-<KYC number>-<sequence>, e.g. KYR-000001-01); one row per review."
    kyc_id: "KYC platform customer id (KYC-xxxxxx) of the client reviewed."
    review_type: "Review type. Values: Onboarding, Periodic (every 1/2/3 years for High/Medium/Low risk), Trigger (event-driven)."
    trigger_reason: "Event behind a trigger review (null otherwise). Values: Adverse Media, Ownership Change, Screening Alert, Credit Deterioration, Regulatory Request."
    due_date: "Date the review is due."
    completed_date: "Date the review was completed; null if still open."
    status: "Review status at the as-of date. Values: Completed, Overdue (past due, open), Due Soon (due within 90 days), Scheduled (due later)."
    days_overdue: "Days past due: for completed reviews, days completed late (0 if on time); for open reviews, days overdue at the as-of date (0 if not yet due)."
    risk_before: "KYC risk rating going into the review. Values: Low, Medium, High; null for onboarding reviews."
    risk_after: "KYC risk rating set by the review. Values: Low, Medium, High; null until completed."
    reviewer_id: "Staff id (SYN-P-xxxx) of the KYC officer assigned to the review."
  kyc_screening:
    screening_id: "Name-screening hit id (SCR-xxxxxxx) from the KYC platform; one row per hit."
    subject_ref: "Party screened: KYC platform customer id (KYC-xxxxxx) for clients, or applicant id (APP-xxxxx, kyc_case.applicant_id) for applicants without one."
    case_id: "Onboarding case (ONB-xxxxx) for onboarding hits; joins to kyc_case.case_id. Null for ongoing screening."
    screening_context: "When the hit arose. Values: Onboarding (during an onboarding case), Ongoing (re-screening of existing clients)."
    screening_date: "Date the screening hit was raised."
    list_name: "Watchlist that produced the hit. Values: Adverse Media, PEP Database, US OFAC SDN, UN Sanctions, EU Sanctions, UK HMT Sanctions, Local Regulator Watchlist, Internal Watchlist."
    hit_type: "How the name matched the list entry. Values: Exact Name Match, Fuzzy Name Match, Partial Name Match, Alias Match."
    is_true_match: "True when the hit was confirmed as a genuine match rather than a false positive."
    resolution_hours: "Hours taken to resolve the hit."
    disposition: "Outcome of the hit review. Values: False Positive - Cleared, True Match - Escalated, True Match - EDD Applied, True Match - Rejected."
    resolved_by: "Staff id (SYN-P-xxxx) of the officer who resolved the hit."

  # ---- trade, SCF, FX -----------------------------------------------------------------------------------
  trade_event:
    event_id: "Lifecycle event id issued by the trade platform: txn_id plus suffix E01, E02, ...; one row per instrument event."
    txn_id: "Trade-platform instrument id the event belongs to; joins to trade_finance_txn.txn_id."
    event_seq: "Order of the event within the instrument's lifecycle, starting at 1 (always the Issue event)."
    event_type: "Lifecycle event type. Values: Issue, Amend, Present, Accept, Claim, Pay, Expire."
    event_date: "Date the lifecycle event occurred."
    event_detail: "Event sub-type, e.g. LC Issued, Guarantee Issued, Increase Amount, Documents Presented, Accepted - 60 Days Usance, Payment Effected, Loan Repaid, Undrawn Balance Lapsed, Guarantee Expired."
    amount_usd: "Unsigned event amount in USD (amount issued, amended, presented, accepted, paid, claimed or lapsed); 0 for amendments that do not change the amount."
    outstanding_after_usd: "Instrument outstanding in USD after the event: Issue and amount increases add; Pay, Expire and decreases subtract; Present, Accept and Claim leave it unchanged."
    presentation_id: "Trade-platform presentation id the event relates to; joins to trade_presentation.presentation_id. Set for LC presentation, acceptance and payment events, null otherwise."
    party_id: "Trade-platform party id of the instrument's client (added by silver from trade_finance_txn); the identity the row resolves through."
  trade_finance_txn:
    txn_id: "Trade-finance instrument id issued by the trade platform; one row per instrument. Joins to trade_event and trade_presentation."
    party_id: "Trade-platform party id of the SMBC client on the instrument; resolves to golden_client_id through entity resolution."
    txn_date: "Issue (booking) date of the instrument. FY2023 dates cover only instruments still open on 1-Apr-2024."
    product_type: "Trade-finance product. Values: Import LC, Export LC, Guarantee / SBLC, Documentary Collection, Trade Loan, Receivables Purchase."
    direction: "Client's side of the underlying trade. Values: Import, Export."
    origin_country: "ISO country code the goods ship from: the counterparty's country for imports, the client's booking country for exports."
    destination_country: "ISO country code the goods ship to: the counterparty's country for exports; for imports usually the booking location, but Singapore-booked hub LCs may ship to VN or IN."
    counterparty_country: "ISO country code of the client's trade counterparty (supplier on imports, buyer on exports)."
    counterparty_bank_country: "ISO country code of the counterparty's bank; usually the counterparty's country, otherwise a hub (SG, HK, US or GB)."
    beneficiary_country: "ISO country code of the instrument's beneficiary: the counterparty's country for imports and all guarantees / SBLCs, otherwise the client's booking country."
    commodity: "Goods category financed, e.g. Electronics, Machinery, Auto Parts, Mineral Fuels, Palm Oil & Fats; maps one-to-one to hs_chapter."
    hs_chapter: "Two-digit Harmonized System chapter of the goods, stored as text, e.g. 85 electrical equipment, 87 vehicles and parts, 27 mineral fuels."
    currency: "ISO currency of the instrument (of amount_ccy). Values: USD, CNY, EUR, JPY, GBP."
    amount_ccy: "Face amount in the instrument currency; equals amount_usd converted at the issue-date FX rate."
    amount_usd: "Original face amount at issue in USD (excludes later amendments)."
    tenor_days: "Tenor in days from txn_date to maturity_date."
    maturity_date: "Contractual maturity or expiry date of the instrument (txn_date plus tenor_days)."
    status: "Lifecycle status at 30-Sep-2026. Values: Issued (open), Negotiated (documents accepted, payment pending), Settled (closed after payment), Expired (closed without any payment)."
    closed_date: "Date the instrument closed (final payment or expiry reduced outstanding to zero); null while open."
    outstanding_usd: "Outstanding amount at 30-Sep-2026 in USD after amendments, payments and lapses; 0 once closed. Matches the latest outstanding_after_usd in trade_event."
    fee_bps: "Fee rate in basis points of amount_usd: per annum for Trade Loan and Guarantee / SBLC, flat per instrument for other products."
    commission_usd: "Fee and commission income on the instrument in USD: amount_usd x fee_bps / 10,000, pro-rated by tenor for Trade Loan and Guarantee / SBLC."
    is_sustainable_trade: "True when the instrument is tagged as sustainable trade finance."
    booking_location: "ISO country code of the SMBC APAC office booking the instrument (the client entity's booking country)."
  trade_presentation:
    presentation_id: "Document presentation id issued by the trade platform: txn_id plus suffix P1-P4; one row per LC presentation."
    txn_id: "Trade-platform id of the import or export LC the documents were presented under; joins to trade_finance_txn.txn_id."
    presentation_no: "Sequence number of the presentation under the LC (1-4), counting re-presentations."
    is_re_presentation: "True when the documents are re-presented after an earlier presentation was refused as discrepant."
    received_ts: "Timestamp trade operations received the documents."
    checked_ts: "Timestamp document examination was completed; null while still pending at 30-Sep-2026."
    turnaround_hours: "Elapsed hours from receipt to completed examination (checked_ts minus received_ts); null while pending."
    sla_hours: "Examination turnaround target in hours; always 24."
    is_over_sla: "True when turnaround_hours exceeds sla_hours; null while pending examination."
    is_discrepant: "True when examination found one or more discrepancies; null while pending examination."
    discrepancy_count: "Number of distinct discrepancy types found (0-3); 0 for complying or pending presentations."
    discrepancy_types: "Semicolon-separated list of all discrepancy types found (e.g. Late Shipment; Missing Document); null when none."
    primary_discrepancy_type: "First discrepancy type recorded, e.g. Inconsistent Data Between Documents, Late Shipment, Late Presentation, Missing Document; null when none."
    decision: "Examination outcome. Values: Complying, Discrepant - Waived, Discrepant - Refused, Pending Examination."
    amount_usd: "Amount drawn under the presentation (value of documents presented), USD."
    ops_team: "Trade operations team examining the documents, by booking location, e.g. SG Trade Ops Hub (also covers MY and PH), HK Trade Ops, VN Trade Ops."
    party_id: "Trade-platform party id of the instrument's client (added by silver from trade_finance_txn); the identity the row resolves through."
  trade_scf_invoice:
    invoice_id: "Invoice id issued by the SCF platform; one row per approved supplier invoice."
    programme_id: "SCF-platform programme id the invoice is uploaded to; joins to scf_programme.programme_id."
    supplier_id: "SCF-platform id of the supplier that issued the invoice; joins to scf_supplier.supplier_id."
    anchor_party_id: "Trade-platform party id of the programme's anchor client; resolves to golden_client_id."
    supplier_invoice_no: "Supplier's own invoice reference number, e.g. 00001-2412-0000."
    invoice_date: "Date the supplier issued the invoice."
    approval_date: "Date the anchor approved the invoice on the SCF platform, making it eligible for early payment."
    due_date: "Date the invoice falls due for payment by the anchor (invoice_date plus payment terms)."
    currency: "Invoice currency; always USD."
    invoice_amount_usd: "Approved invoice amount in USD."
    is_financed: "True when the supplier took early payment (financing) on the invoice."
    financing_date: "Date the early payment was disbursed to the supplier; null when not financed."
    financed_amount_usd: "Amount advanced to the supplier in USD (invoice_amount_usd x advance_rate); 0 when not financed."
    advance_rate: "Share of the invoice amount advanced, fraction 0-1: 1.0 on payables finance, 0.9 on receivables finance programmes; null when not financed."
    discount_rate_pct: "Annualised discount rate charged, % (USD benchmark plus the supplier's margin, scf_supplier.discount_rate_bps); null when not financed."
    days_financed: "Days from financing_date to due_date; null when not financed."
    discount_amount_usd: "Discount charged in USD: financed_amount_usd x discount_rate_pct / 100 x days_financed / 360; 0 when not financed."
    net_proceeds_usd: "Cash paid to the supplier in USD: financed_amount_usd minus discount_amount_usd; null when not financed."
    status: "Invoice status at 30-Sep-2026. Values: Approved (unfinanced, not yet due), Financed (financed, not yet due), Settled (financed, anchor paid at due date), Paid at Maturity (unfinanced, paid when due)."
  scf_programme:
    programme_id: "Supply-chain-finance programme id issued by the SCF platform; one row per programme."
    anchor_party_id: "Trade-platform party id of the anchor client sponsoring the programme; resolves to golden_client_id."
    programme_type: "SCF programme structure. Values: Payables Finance, Receivables Finance."
    launch_date: "Date the programme went live."
    currency: "Programme currency; always USD."
    limit_usd: "Programme financing limit in USD."
    drawn_usd: "Financed outstanding at 30-Sep-2026 in USD; equals the sum of scf_supplier.financed_amount_usd for the programme."
    utilisation: "Utilisation at 30-Sep-2026: drawn_usd / limit_usd, fraction 0-1."
    n_suppliers_total: "Total suppliers recorded for the programme at programme level (count); may differ from the number of its rows in scf_supplier."
    primary_corridor: "Anchor's main trade-corridor counterparty country (ISO code). Values: CN, DE, IN."
  scf_supplier:
    supplier_id: "Supplier id issued by the SCF platform; one row per programme supplier, onboarded or prospective."
    programme_id: "SCF-platform programme id the supplier belongs to; joins to scf_programme.programme_id."
    anchor_party_id: "Trade-platform party id of the programme's anchor client; resolves to golden_client_id."
    supplier_name: "Supplier legal name."
    supplier_country: "ISO country code of the supplier."
    is_onboarded: "True when the supplier is onboarded to the programme and can finance invoices; false marks a prospective supplier (onboarding opportunity)."
    onboarded_date: "Date the supplier was onboarded; null for prospective suppliers."
    n_invoices_financed: "Invoices financed in the 12 months to 30-Sep-2026 (count); 0 for prospective suppliers."
    financed_amount_usd: "Financed outstanding at 30-Sep-2026 in USD; sums to the programme's drawn_usd; 0 for prospective suppliers."
    avg_days_paid_early: "Average days before the due date the supplier is paid through financing; 0 for prospective suppliers."
    discount_rate_bps: "Supplier's discount margin over the USD benchmark rate, in bps; 0 for prospective suppliers."
    routes_to_other_bank: "True when the supplier's wider banking still routes to another bank (cross-sell opportunity)."
  tsy_fx_deal:
    deal_id: "FX deal id issued by the treasury system; one row per SMBC-booked deal."
    cpty_id: "Treasury-system counterparty id of the client; resolves to golden_client_id through entity resolution."
    deal_date: "Trade date the deal was booked."
    product_type: "FX product. Values: FX Spot, FX Forward, FX Swap."
    ccy_pair: "Currency pair as BASE/QUOTE, e.g. USD/SGD, USD/CNY, EUR/USD; usually the client's local pair against USD, otherwise a major pair."
    direction: "Client's side of the deal against USD. Values: Client Buys USD, Client Sells USD."
    notional_usd: "Deal notional in USD."
    margin_bps: "Treasury sales margin on the deal, in bps of notional; about double on emerging-market currency pairs."
    revenue_usd: "Sales revenue on the deal in USD: notional_usd x margin_bps / 10,000."
    hedge_type: "Purpose of the deal for the client. Values: Hedge (covers commercial exposure), Trading."
    tenor_days: "Days from deal_date to value_date; 2 for spot."
    value_date: "Value (settlement) date of the deal: deal_date plus tenor_days."
    booking_location: "ISO country code of the SMBC APAC office booking the deal (the client entity's booking country)."
  tsy_fx_wallet_estimate:
    cpty_id: "Treasury-system counterparty id of the client; resolves to golden_client_id. One row per counterparty and fiscal quarter with SMBC deals."
    fiscal_year: "Japanese fiscal year (April-March) of the quarter; 2026 = Apr-2026 to Mar-2027."
    fiscal_quarter: "Fiscal quarter number 1-4 (Q1 = Apr-Jun, Q4 = Jan-Mar)."
    fiscal_quarter_label: "Fiscal quarter label in the form FY2026-Q2 (= Jul-Sep 2026)."
    est_total_wallet_usd: "Estimated total FX turnover of the client with all banks in the quarter, USD."
    smbc_volume_usd: "FX notional booked with SMBC in the quarter, USD (sum of tsy_fx_deal.notional_usd)."
    n_deals: "Number of SMBC FX deals with the client in the quarter."
    wallet_share: "SMBC share of the client's FX wallet: smbc_volume_usd / est_total_wallet_usd, capped at 1, fraction 0-1."
    competitor_volume_usd: "Estimated FX volume done with other banks: est_total_wallet_usd minus smbc_volume_usd, floored at 0, USD."
    revenue_captured_usd: "SMBC FX revenue earned in the quarter, USD (sum of tsy_fx_deal.revenue_usd)."
    revenue_opportunity_usd: "Recapture opportunity: revenue SMBC would earn on competitor_volume_usd at its notional-weighted average margin for the client and quarter, USD."

  # ---- Delta Sharing (shared) + refresh monitoring ------------------------------------------------------
  dq_share_refresh_log:
    log_date: "Date of the daily freshness check; one row per shared table per day."
    checked_at: "Timestamp of the freshness check, 09:00 Singapore time (UTC+8)."
    provider_region: "Lakehouse publishing the share. Values: JP (Tokyo head office), EMEA, AMER."
    share_name: "Delta Share containing the table. Values: jp_head_office_share, emea_regional_share, amer_regional_share."
    table_name: "Shared table checked: one of the 11 share_* tables, e.g. share_jp_parent_rating."
    scheduled_refresh_at: "Scheduled time (SGT) of the provider's latest refresh run due before the check."
    refresh_status: "Outcome of that latest scheduled run. Values: Success, Late (published after schedule), Failed (not refreshed)."
    refreshed_at: "Publish time (SGT) of the latest successful refresh visible at the check."
    provider_version: "Provider's Delta table version for the latest refresh visible at the check."
    lag_hours: "Data age in hours at the check: checked_at minus refreshed_at."
    is_stale: "True when lag_hours exceeds sla_hours (24)."
    sla_hours: "Freshness SLA in hours; always 24."
    row_count: "Rows in the shared table at provider_version."
    schema_version: "Table schema version at the check: 1 = original, 2 = after the provider's additive column change."
    schema_drift_flag: "True when the latest visible refresh introduced a schema change (see schema_change)."
    schema_change: "DDL of the schema change in that refresh; null otherwise. Values: ADD COLUMN ifrs9_stage INT, ADD COLUMN naics_code STRING, ADD COLUMN ghg_scope12_kt DOUBLE."
    error_message: "Provider error text when the latest scheduled run failed (JP HO Obon maintenance outage or job start-up timeout); null otherwise."
  share_jp_group_master:
    global_group_id: "Tokyo HO global group id, the bank's group-master key; one row per client group. Joins every share_* table."
    group_name_global: "Client group name as mastered by Tokyo HO."
    jp_parent_id: "Tokyo HO id of the group's Japanese parent company; null when the group has no JP parent."
    jp_parent_legal_name: "Legal name of the JP parent company; null when no JP parent."
    jp_parent_lei: "LEI-format identifier of the JP parent; null when no JP parent."
    jp_parent_city: "Head-office city of the JP parent. Values: Tokyo, Osaka, Nagoya; null when no JP parent."
    hq_country: "ISO country code of the group's headquarters."
    hq_region: "Region of the group's headquarters. Values: JP, APAC."
    global_segment: "Global client segment. Values: Japanese Corporate, Non-Japanese Corporate, Financial Institutions, Sponsor Coverage, Public Sector."
    global_industry: "Group industry as classified by Tokyo HO, e.g. Electronics, Shipping, Energy, Securities, Renewables."
    global_tier: "Global relationship tier. Values: Global Strategic, Global Core, Global Standard."
    global_relationship_owner_region: "Region owning the global relationship. Values: JP (Tokyo HO, Japanese corporates), APAC."
    global_rm_code: "Global RM code: Tokyo HO RM (JPHO-RM-nnn) for JP-owned groups, APAC lead RM (RMnnn) for APAC-owned groups; null when none recorded."
    global_rm_name: "Name of the Tokyo HO global RM; null for APAC-owned groups."
    global_coverage_unit: "Owning coverage unit. Values: APAC Coverage (Singapore), APAC Financial Institutions (Singapore), Tokyo HO Global Corporate Banking Dept 1-5 (1 Automotive, 2 Electronics, 3 Trading, 4 Materials, 5 Consumer)."
    relationship_since: "Date the bank's relationship with the group began, as recorded by Tokyo HO."
    n_subsidiaries_emea: "Number of active EMEA subsidiaries of the group (see share_emea_entity_master)."
    n_subsidiaries_amer: "Number of active Americas subsidiaries of the group (see share_amer_entity_master)."
    master_status: "Status of the group-master record; always Active."
  share_jp_parent_exposure_monthly:
    jp_counterparty_id: "Tokyo HO counterparty id: JPP-nnnn for a JP parent (= share_jp_group_master.jp_parent_id), JPC-nnnn for a JP-booked entity of a non-Japanese group."
    jp_counterparty_name: "Counterparty legal name as recorded by Tokyo HO."
    counterparty_type: "Values: JP Parent, Group Entity (JP-booked); the latter is a non-Japanese group's entity with Tokyo-booked lending."
    global_group_id: "Tokyo HO global group id; joins to share_jp_group_master."
    month_end_date: "Month-end date: balances as at that date, revenue for that month."
    product_family: "Product family. Values: Corporate Lending, Structured Lending, Sustainable Finance, Trade Finance, Cash, Liquidity, Payments, FX, Rates."
    booking_office: "Japan office booking the business. Values: Tokyo, Osaka, Nagoya."
    currency: "Currency of the _lcy columns. Values: JPY (JP parents), USD (JP-booked group entities)."
    committed_lcy: "Committed facility amount at month-end in the row's currency; lending and Trade Finance families only, 0 otherwise."
    committed_usd: "Committed facility amount at month-end in USD (month-end FX rate); lending and Trade Finance families only, 0 otherwise."
    drawn_lcy: "Drawn (utilised) balance at month-end in the row's currency; lending and Trade Finance families only, 0 otherwise."
    drawn_usd: "Drawn (utilised) balance at month-end in USD (month-end FX rate); lending and Trade Finance families only, 0 otherwise."
    deposits_lcy: "Deposit balances at month-end in the row's currency; Cash and Liquidity only, 0 otherwise."
    deposits_usd: "Deposit balances at month-end in USD (month-end FX rate); Cash and Liquidity only, 0 otherwise."
    revenue_lcy: "Revenue booked in the month in the row's currency (interest margin, fees or trading revenue)."
    revenue_usd: "Revenue booked in the month in USD (month-end FX rate)."
  share_jp_parent_financials:
    jp_parent_id: "Tokyo HO JP parent id; joins to share_jp_group_master.jp_parent_id. One row per parent and fiscal year."
    global_group_id: "Tokyo HO global group id of the parent's group."
    fiscal_year: "Japanese fiscal year of the results (April-March); 2025 = year ended 31-Mar-2026."
    fiscal_year_label: "Fiscal year label, e.g. FY2025."
    fiscal_year_end: "Fiscal year-end date, 31 March of fiscal_year + 1."
    accounting_standard: "Accounting standard of the consolidated accounts. Values: J-GAAP, IFRS."
    currency: "Reporting currency of the _jpy figures; always JPY."
    revenue_jpy: "Consolidated revenue for the fiscal year, JPY."
    operating_income_jpy: "Consolidated operating income for the fiscal year, JPY."
    ebitda_jpy: "Consolidated EBITDA for the fiscal year, JPY."
    net_income_jpy: "Consolidated net income for the fiscal year, JPY."
    interest_expense_jpy: "Interest expense for the fiscal year, JPY."
    total_assets_jpy: "Total assets at fiscal year-end, JPY."
    total_debt_jpy: "Total borrowings (gross debt) at fiscal year-end, JPY."
    cash_jpy: "Cash and equivalents at fiscal year-end, JPY."
    net_debt_jpy: "Net debt (total debt minus cash) at fiscal year-end, JPY."
    equity_jpy: "Total equity at fiscal year-end, JPY."
    revenue_usd: "Consolidated revenue for the fiscal year, USD at the fiscal-year-end FX rate."
    operating_income_usd: "Consolidated operating income for the fiscal year, USD at the fiscal-year-end FX rate."
    ebitda_usd: "Consolidated EBITDA for the fiscal year, USD at the fiscal-year-end FX rate."
    net_income_usd: "Consolidated net income for the fiscal year, USD at the fiscal-year-end FX rate."
    interest_expense_usd: "Interest expense for the fiscal year, USD at the fiscal-year-end FX rate."
    total_assets_usd: "Total assets at fiscal year-end, USD at the fiscal-year-end FX rate."
    total_debt_usd: "Total borrowings (gross debt) at fiscal year-end, USD at the fiscal-year-end FX rate."
    cash_usd: "Cash and equivalents at fiscal year-end, USD at the fiscal-year-end FX rate."
    net_debt_usd: "Net debt (total debt minus cash) at fiscal year-end, USD at the fiscal-year-end FX rate."
    equity_usd: "Total equity at fiscal year-end, USD at the fiscal-year-end FX rate."
    net_debt_to_ebitda: "Leverage: net debt / EBITDA, times (x)."
    interest_coverage: "Interest cover: operating income / interest expense, times (x)."
    equity_ratio: "Equity / total assets, fraction 0-1."
    roe: "Return on equity: net income / equity, fraction (0.10 = 10%)."
    operating_margin: "Operating income / revenue, fraction (0.10 = 10%)."
    n_consolidated_subsidiaries: "Number of consolidated subsidiaries in the group accounts."
    audit_opinion: "External auditor's opinion on the accounts; always Unqualified."
    results_published_date: "Date the parent published its fiscal-year results."
    ghg_scope12_kt: "Scope 1+2 greenhouse-gas emissions for the fiscal year, kilotonnes CO2e; added Jun-2026, not back-filled, so null on rows shared before then."
  share_jp_parent_rating:
