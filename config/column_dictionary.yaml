    outlook: "Rating outlook after the action. Values: Stable, Positive, Negative."
    rating_reason: "Free-text rationale for the rating action."
    next_review_date: "Scheduled date of the parent's next annual review."
    valid_to: "Date the record was superseded by the next rating action; null for the current rating."
    is_current: "True when this is the parent's latest (current) rating record."
