    global_group_id: "Tokyo HO global group id of the parent's group."
    rating_date: "Date the rating action was taken."
    rating_action: "Values: Initial, Affirm, Upgrade (grade number falls), Downgrade (grade number rises)."
    review_type: "Values: Annual Review (after the March fiscal-year results), Event-Driven (out-of-cycle action)."
    grade_from: "Internal grade before the action, 1 (best) to 10 (worst); null for Initial ratings."
    grade_to: "Internal grade after the action, 1 (best) to 10 (worst)."
