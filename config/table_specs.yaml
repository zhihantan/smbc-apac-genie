# Silver table specs (Phase 4b; PLAN §6; DECISIONS D11, D13, D22, D25) — read by smbc_genie_lib.silver / .dq.
#
# One entry per bronze / shared fact or reference table (identity masters are resolved by entity
# resolution: silver.client_source_record / xref_client_source / client_golden_identity).
#   source    bronze.<t> | shared.<t>            silver table = silver.<same name>
#   keys      business key: rows are de-duplicated on it (survivor: original delivery, earliest ingest)
#   client    identity key -> golden_client_id via silver.xref_client_source; `system` defaults from
#             conform.identity_keys, `via` resolves through a lookup (adds the looked-up id column),
#             `system_column` names a per-row source system; required: false = rows without a key
#             carry no golden client; scope = SQL predicate for the rows the key must resolve on
#   group     group-master key -> client_group_id (checked against conform.group_master)
#   date      business date (history start, freshness)
#   columns   silver types: string | code (trimmed, upper-cased) | date | timestamp | int | bigint |
#             double | boolean | decimal(p,s). Strings are trimmed, blanks become NULL; ISO strings
#             parse to DATE / TIMESTAMP with try_cast. Bronze columns not listed are carried through.
#   checks    generate the DQ rules (smbc_genie_lib.dq): required, enum, enum_ref, range (bounds may
#             be '@as_of'), date_order, fk (+ fk_blocking: orphans quarantined), not_future (business
#             dates after the as-of date are quarantined), fresh {lag_days | min}
version: 1
conform:
  xref: silver.xref_client_source
  golden: silver.client_golden_identity
  group_master: shared.share_jp_group_master.global_group_id   # Tokyo HO global group master (D27)
  identity_keys:            # identity column -> ER source system (bronze identity master)
    cust_no: core_customer
    obligor_id: credit_obligor
    crm_account_id: crm_account
    kyc_id: kyc_customer
    party_id: trade_party
    cpty_id: tsy_counterparty
    company_id: ext_company_master
  lookups:                  # rows keyed by a child id resolve through the parent's identity column
    account: {table: bronze.core_account, key: account_id, identity: cust_no, system: core_customer}
    facility: {table: bronze.credit_facility_terms, key: facility_id, identity: obligor_id, system: credit_obligor}
    trade_txn: {table: bronze.trade_finance_txn, key: txn_id, identity: party_id, system: trade_party}
    kyc_case: {table: bronze.kyc_case, key: case_id, identity: kyc_id, system: kyc_customer}
    issuer: {table: bronze.ext_issuer, key: issuer_id, identity: parent_company_id}   # -> client group
  reprocessed_batch_pattern: "_R$"   # replayed / reprocessed files rank after the original delivery
  dedup_order: ["_ingest_ts ASC", "_batch_id ASC"]
# "all core sources" for golden-record coverage (brief §5.11 Clients in All Core Sources %)
core_sources: [core_customer, crm_account, kyc_customer]
# golden attribute completeness (silver.golden_attribute_completeness): attribute -> where it is read.
#   as: output column; golden: silver.client_golden_identity column; records: silver.client_source_record
#   column (highest-priority record holding it, ER source priority); facts: silver <table>.<column> on the
#   client's rows (latest by the table's date); group_fallback: else the value most often held in the
#   client's group. Order: golden, records, facts, group.
attribute_sources:
  legal_name: {as: legal_name, golden: legal_name}
  lei: {as: lei_like_id, golden: lei_like_id}
  tax_id: {as: tax_id, records: tax_id_as_recorded}
  country: {as: country_of_incorporation, golden: country_of_incorporation}
  group: {as: client_group_id, golden: client_group_id}
  segment: {as: segment, records: segment_label, facts: [crm_opportunity.segment, fin_relationship_pnl.segment], group_fallback: true}
  tier: {as: relationship_tier, facts: [crm_opportunity.relationship_tier, fin_relationship_pnl.relationship_tier], group_fallback: true}
  rm: {as: primary_rm_code, records: rm_code}
  rating: {as: internal_rating_grade, records: internal_grade, facts: [core_rating_history.internal_grade]}
  kyc_risk: {as: kyc_risk_rating, records: kyc_risk_rating}
# UC tags on every silver table (DECISIONS D37: smbc_-prefixed keys, as Phase 2 set on the schemas)
tags:
  fixed: {smbc_domain: customer360, smbc_layer: silver, smbc_pii: "false", smbc_synthetic: "true"}
  quadrant_by_prefix:       # brief §3.2 / §6.1 four quadrants
    core_: internal_quantitative
    pay_: internal_quantitative
    trade_: internal_quantitative
    scf_: internal_quantitative
    tsy_: internal_quantitative
    crm_: internal_quantitative
    credit_: internal_quantitative
    kyc_: internal_quantitative
    ews_: internal_quantitative
    fin_: internal_quantitative
    cf_: internal_quantitative
    ext_: external_quantitative
    share_: internal_quantitative
    ref_: reference
    fx_: reference
    dq_: platform
  quadrant_overrides:
    crm_activity: internal_qualitative
    credit_review: internal_qualitative
    kyc_feedback: internal_qualitative
    credit_financial_statement: external_quantitative
    credit_ratio: external_quantitative
    ext_news: external_qualitative
  source_region_by_prefix: {share_jp_: JP, share_emea_: EMEA, share_amer_: AMER}
  source_region_default: APAC
tables:
  cf_actual_monthly:
    source: bronze.cf_actual_monthly
    domain: cashflow
    comment: >-
      Monthly cash-flow actuals per core-banking customer, derived from the payments hub: inflows, outflows,
      net flow and payment count (USD). Grain: cust_no x month.
    keys: [cust_no, month]
    client: {key: cust_no}
    date: month
    columns:
      cust_no: string
      month: date
      inflows_usd: double
      outflows_usd: double
      net_cf_usd: double
      n_payments: bigint
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      range: {inflows_usd: [0, null], outflows_usd: [0, null], n_payments: [0, null]}
      fresh: {lag_days: 31}
  cf_event:
    source: bronze.cf_event
    domain: cashflow
    comment: >-
      Liquidity-need events raised by the cash-flow forecasting service: predicted shortfalls / surpluses with
      RCF headroom and the action taken (RCF drawdown, TD placement). Grain: one event.
    keys: [event_id]
    client: {key: cust_no}
    date: event_date
    columns:
      event_id: string
      cust_no: string
      event_type: string
      event_date: date
      forecast_run_date: date
      forecast_target_month: date
      model_version: string
      horizon_days: int
      forecast_inflows_usd: double
      expected_outflows_usd: double
      predicted_net_usd: double
      predicted_amount_usd: double
      severity_ratio: double
      has_rcf: boolean
      undrawn_rcf_usd: double
      action_taken: string
      action_date: date
      days_to_action: int
      action_amount_usd: double
      linked_facility_id: string
      linked_schedule_event_id: string
      est_action_revenue_usd: double
      event_status: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {event_type: [Predicted Surplus, Predicted Shortfall], model_version: [v1, v2], action_taken: [None, RCF Drawdown, TD Placed], event_status: [Open, Actioned, Closed - No Action]}
      date_order: [[forecast_run_date, event_date], [event_date, action_date]]
      fk: {linked_facility_id: silver.credit_facility_terms.facility_id, linked_schedule_event_id: silver.core_loan_schedule.schedule_event_id}
  cf_forecast:
    source: bronze.cf_forecast
    domain: cashflow
    comment: >-
      Monthly cash-inflow forecasts per customer and model version (v1 until May-2026, v2 from Jun-2026)
      against the realised inflows, with absolute percentage error. Grain: cust_no x run date x target month x
      model.
    keys: [cust_no, forecast_run_date, target_month, model_version]
    client: {key: cust_no}
    date: forecast_run_date
    columns:
      cust_no: string
      forecast_run_date: date
      target_month: date
      model_version: string
      forecast_inflows_usd: double
      actual_inflows_usd: double
      abs_pct_error: double
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {model_version: [v1, v2]}
      range: {abs_pct_error: [0, 1], forecast_inflows_usd: [0, null]}
      date_order: [[forecast_run_date, target_month]]
      fresh: {lag_days: 62}
  cf_projection:
    source: bronze.cf_projection
    domain: cashflow
    comment: >-
      Forward six-month inflow projection by client segment (seasonal method) with lower / upper bounds, USD.
      Grain: segment x target month x method.
    keys: [segment, target_month, method]
    date: target_month
    columns:
      segment: string
      target_month: date
      projected_inflows_usd: double
      lower_usd: double
      upper_usd: double
      method: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {segment: [Japanese Corporate, Non-Japanese Large Corporate, Financial Institution, Sponsor & Structured Finance, Public Sector]}
      date_order: [[lower_usd, upper_usd]]
  core_account:
    source: bronze.core_account
    domain: deposits
    comment: >-
      Core-banking deposit accounts (current, savings, time deposit, money market) with currency, open date
      and status. Grain: one account.
    keys: [account_id]
    client: {key: cust_no}
    date: open_date
    columns:
      cust_no: string
      account_id: string
      account_type: string
      currency: code
      open_date: date
      status: string
      _source_system: string
      _source_file: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      required: [account_type, currency, open_date, status]
      enum: {account_type: [Current Account, Savings Account, Time Deposit, Money Market Deposit], status: [ACTIVE, DORMANT, CLOSED]}
      enum_ref: {currency: silver.ref_currency.currency_code}
      range: {open_date: [null, '@as_of']}
  core_deposit_balance_daily:
    source: bronze.core_deposit_balance_daily
    domain: deposits
    comment: >-
      Daily end-of-day deposit balances per account for the bounded daily window (Dec-2025 to the as-of date),
      local currency and USD, CASA vs TD class. Grain: account x date.
    keys: [account_id, balance_date]
    client: {key: cust_no}
    date: balance_date
    columns:
      account_id: string
      cust_no: string
      balance_date: date
      currency: code
      balance_lcy: double
      balance_usd: double
      deposit_class: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {deposit_class: [CASA, TD]}
      enum_ref: {currency: silver.ref_currency.currency_code}
      range: {balance_usd: [0, null], balance_lcy: [0, null]}
      fk: {account_id: silver.core_account.account_id}
      fk_blocking: [account_id]
      not_future: [balance_date]
      fresh: {lag_days: 3}
  core_deposit_balance_monthly:
    source: bronze.core_deposit_balance_monthly
    domain: deposits
    comment: >-
      Month-end deposit balances per account (local currency and USD) with the month's average balance and
      CASA / TD class. Point-in-time: never sum across months. Grain: account x month-end.
    keys: [account_id, balance_date]
    client: {key: cust_no}
    date: balance_date
    columns:
      account_id: string
      cust_no: string
      balance_date: date
      currency: code
      balance_lcy: double
      balance_usd: double
      avg_balance_usd: double
      deposit_class: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {deposit_class: [CASA, TD]}
      enum_ref: {currency: silver.ref_currency.currency_code}
      range: {balance_usd: [0, null], balance_lcy: [0, null], avg_balance_usd: [0, null]}
      fk: {account_id: silver.core_account.account_id}
      fk_blocking: [account_id]
      not_future: [balance_date]
      fresh: {lag_days: 0}
  core_dpd:
    source: bronze.core_dpd
    domain: credit_risk
    comment: >-
      Daily days-past-due records for facilities in arrears: overdue amount, DPD bucket, arrears episode, due
      and cure dates. Grain: facility x date.
    keys: [facility_id, dpd_date]
    client: {key: obligor_id}
    date: dpd_date
    columns:
      facility_id: string
      obligor_id: string
      dpd_date: date
      days_past_due: int
      dpd_bucket: string
      overdue_amount_lcy: double
      overdue_amount_usd: double
      currency: code
      arrears_episode_id: string
      due_date: date
      cure_date: date
      is_cured: boolean
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {dpd_bucket: [1-29, 30-59, 60-89, 90+]}
      range: {days_past_due: [1, null], overdue_amount_usd: [0, null], cure_date: [null, '@as_of']}
      enum_ref: {currency: silver.ref_currency.currency_code}
      date_order: [[due_date, dpd_date]]
      fk: {facility_id: silver.credit_facility_terms.facility_id}
      fk_blocking: [facility_id]
      not_future: [dpd_date]
  core_facility_balance_monthly:
    source: bronze.core_facility_balance_monthly
    domain: lending
    comment: >-
      Month-end lending balances per facility: limit, drawn (USD and local currency) and utilisation. Point-
      in-time: never sum across months. Grain: facility x month-end.
    keys: [facility_id, balance_date]
    client: {key: obligor_id}
    date: balance_date
    columns:
      facility_id: string
      obligor_id: string
      balance_date: date
      currency: code
      limit_usd: double
      drawn_usd: double
      drawn_lcy: double
      utilisation_pct: double
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum_ref: {currency: silver.ref_currency.currency_code}
      range: {limit_usd: [0, null], drawn_usd: [0, null], utilisation_pct: [0, 1.1]}
      fk: {facility_id: silver.credit_facility_terms.facility_id}
      fk_blocking: [facility_id]
      not_future: [balance_date]
      fresh: {lag_days: 0}
  core_liquidity_structure:
    source: bronze.core_liquidity_structure
    domain: liquidity
    comment: >-
      Cash-management liquidity structures (notional / physical pooling, sweeps, interest optimisation):
      header customer and account, pooling currency, sweep frequency, fees. Grain: one structure.
    keys: [structure_id]
    client: {key: header_cust_no, system: core_customer}
    date: start_date
    columns:
      structure_id: string
      structure_name: string
      structure_type: string
      group_master_id: string
      header_cust_no: string
      header_account_id: string
      header_country: code
      pooling_currency: code
      sweep_frequency: string
      is_cross_border: boolean
      interest_benefit_bps: double
      monthly_fee_usd: double
      start_date: date
      end_date: date
      status: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {structure_type: [Notional Pooling, Physical Pooling, Interest Optimisation, Sweep], status: [Active, Terminated]}
      enum_ref: {pooling_currency: silver.ref_currency.currency_code}
      date_order: [[start_date, end_date]]
      fk: {header_account_id: silver.core_account.account_id}
  core_liquidity_structure_participant:
    source: bronze.core_liquidity_structure_participant
    domain: liquidity
    comment: >-
      Accounts participating in each liquidity structure with role (header / participant), sweep direction,
      target balance and join / leave dates. Grain: structure x participant account.
    keys: [structure_id, participant_account_id]
    client: {key: participant_cust_no, system: core_customer}
    date: join_date
    columns:
      structure_id: string
      participant_account_id: string
      participant_cust_no: string
      participant_country: code
      participant_currency: code
      role: string
      sweep_direction: string
      target_balance_lcy: double
      join_date: date
      leave_date: date
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {role: [Header, Participant]}
      date_order: [[join_date, leave_date]]
      fk: {structure_id: silver.core_liquidity_structure.structure_id, participant_account_id: silver.core_account.account_id}
      fk_blocking: [structure_id]
  core_loan_schedule:
    source: bronze.core_loan_schedule
    domain: lending
    comment: >-
      Loan drawdown, repayment, prepayment and maturity events per facility (settled and scheduled), with the
      drawn balance after each event. Grain: one schedule event.
    keys: [schedule_event_id]
    client: {key: obligor_id}
    date: event_date
    columns:
      schedule_event_id: string
      facility_id: string
      obligor_id: string
      event_type: string
      event_date: date
      amount_lcy: double
      amount_usd: double
      currency: code
      drawn_after_usd: double
      is_contractual: boolean
      status: string
      purpose: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {event_type: [Drawdown, Repayment, Prepayment, Maturity], status: [Settled, Scheduled]}
      range: {amount_usd: [0, null], drawn_after_usd: [0, null]}
      enum_ref: {currency: silver.ref_currency.currency_code}
      fk: {facility_id: silver.credit_facility_terms.facility_id}
      fk_blocking: [facility_id]
  core_rating_history:
    source: bronze.core_rating_history
    domain: credit_risk
    comment: >-
      Internal rating actions per credit obligor: grade (1-10), rating equivalent, IFRS 9 stage, action
      (Initial / Affirm / Upgrade / Downgrade), reason and approver. Grain: one rating event.
    keys: [rating_event_id]
    client: {key: obligor_id}
    date: effective_date
    columns:
      rating_event_id: string
      obligor_id: string
      effective_date: date
      rating_action: string
      previous_grade: int
      internal_grade: int
      notch_change: int
      rating_equivalent: string
      origination_grade: int
      ifrs9_stage: int
      previous_stage: int
      action_reason: string
      rating_model: string
      review_id: string
      approver_id: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {rating_action: [Initial, Affirm, Upgrade, Downgrade]}
      range: {internal_grade: [1, 10], previous_grade: [1, 10], ifrs9_stage: [1, 3], effective_date: [null, '@as_of']}
      fk: {review_id: silver.credit_review.review_id}
      fresh: {lag_days: 31}
  core_time_deposit:
    source: bronze.core_time_deposit
    domain: deposits
    comment: >-
      Time-deposit placements: placement and maturity dates, tenor, principal (local currency and USD), rate,
      maturity instruction and funding source. Grain: one placement.
    keys: [placement_id]
    client: {key: cust_no}
    date: placement_date
    columns:
      placement_id: string
      account_id: string
      cust_no: string
      currency: code
      placement_date: date
      maturity_date: date
      tenor_months: int
      principal_lcy: double
      principal_usd: double
      interest_rate_pct: double
      interest_at_maturity_lcy: double
      maturity_instruction: string
      funding_source: string
      funding_account_id: string
      status: string
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {tenor_months: [1, 3, 6, 12], status: [Active, Matured]}
      range: {principal_usd: [0, null], interest_rate_pct: [0, 15], placement_date: [null, '@as_of']}
      enum_ref: {currency: silver.ref_currency.currency_code}
      date_order: [[placement_date, maturity_date]]
      fk: {account_id: silver.core_account.account_id}
      fk_blocking: [account_id]
  credit_collateral:
    source: bronze.credit_collateral
    domain: credit
    comment: >-
      Collateral items securing credit facilities: type, appraised value (USD), last valuation date and loan-
      to-value. Grain: one collateral item.
    keys: [collateral_id]
    client: {key: facility_id, via: facility}
    date: last_valuation_date
    columns:
      _batch_id: string
      _ingest_ts: timestamp
      _source_system: string
      appraised_value_usd: double
      collateral_id: string
      collateral_type: string
      facility_id: string
      last_valuation_date: date
      ltv_pct: double
    checks:
      enum: {collateral_type: [Fixed Assets, Real Estate, Receivables, Inventory, Cash]}
      range: {appraised_value_usd: [0, null], ltv_pct: [0, 1.5], last_valuation_date: [null, '@as_of']}
  credit_covenant_test:
    source: bronze.credit_covenant_test
    domain: credit
    comment: >-
      Financial covenant tests per facility (Net Debt/EBITDA, ICR): actual vs threshold, headroom, breach and
      waiver flags, latest-test flag. Grain: facility x covenant x test date.
    keys: [facility_id, covenant_type, test_date]
    client: {key: obligor_id}
    date: test_date
    columns:
      _batch_id: string
      _ingest_ts: timestamp
      _source_system: string
      actual: double
      breached: boolean
      covenant_type: string
      facility_id: string
      headroom_pct: double
      is_latest_test: boolean
      obligor_id: string
      test_basis: string
      test_date: date
      threshold: double
      waiver: boolean
    checks:
      enum: {covenant_type: [Net Debt/EBITDA, ICR]}
      range: {threshold: [0, null]}
      fk: {facility_id: silver.credit_facility_terms.facility_id}
      fk_blocking: [facility_id]
      fresh: {lag_days: 92}
  credit_facility_terms:
    source: bronze.credit_facility_terms
    domain: lending
    comment: >-
      Credit facility terms: type, limit (USD), currency, margin, origination / maturity dates, guarantor and
      security type, status. Grain: one facility.
    keys: [facility_id]
    client: {key: obligor_id}
    date: origination_date
    columns:
      _batch_id: string
      _ingest_ts: timestamp
      _source_system: string
      closed_date: date
      currency: code
      facility_id: string
      facility_type: string
      guarantor_type: string
      has_covenant: boolean
      limit_usd: double
      margin_bps: int
      maturity_date: date
      obligor_id: string
      origination_date: date
      security_type: string
      status: string
    checks:
      required: [facility_type, limit_usd, currency, origination_date, maturity_date, status]
      enum: {facility_type: [Term Loan, Revolving Credit Facility, Bilateral Loan, Syndicated Loan, Overdraft, Trade Loan], guarantor_type: [None, Parent Guarantee, Corporate Guarantee, Keepwell, Sponsor Support], status: [Active, Matured, Prepaid, Cancelled]}
      range: {limit_usd: [0, null], margin_bps: [0, 1000]}
      enum_ref: {currency: silver.ref_currency.currency_code}
      date_order: [[origination_date, maturity_date], [origination_date, closed_date]]
  credit_financial_statement:
    source: bronze.credit_financial_statement
    domain: credit
    comment: >-
      Spread financial statements per obligor and fiscal year in long format (balance sheet, P&L, cash flow
      line items; USD and local currency; audited and spread flags). Grain: obligor x FY x statement x line
      item.
    keys: [obligor_id, fiscal_year, statement_type, line_item]
    client: {key: obligor_id}
    date: fiscal_year
    columns:
      obligor_id: string
      fiscal_year: int
      fiscal_year_label: string
      fiscal_year_end: string
      statement_type: string
      line_item: string
      amount_usd: double
      amount_lcy: double
      currency: code
      is_audited: boolean
      is_spread: boolean
      spread_date: date
      _source_system: string
      _batch_id: string
      _ingest_ts: timestamp
    checks:
      enum: {statement_type: [Balance Sheet, P&L, Cash Flow]}
      range: {fiscal_year: [2019, 2026]}
