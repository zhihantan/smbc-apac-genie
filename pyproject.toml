[project]
name = "smbc-genie-lib"
version = "0.1.0"
description = "Shared library for the SMBC APAC Genie Customer 360 + Genie Agents build"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed on the serverless jobs (and locally for integration tests / Genie API calls).
# pyspark is intentionally absent — serverless provides it; never ship it.
build = [
    "databricks-sdk>=0.145",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "databricks-sdk>=0.145",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smbc_genie_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure-python tests, no workspace",
    "integration: needs a live Databricks warehouse",
]
