# Space 11, Customer 360 Data Foundation (WP8f). Daily freshness of the tables received over Delta Sharing from the
# JP / EMEA / AMER lakehouses: lag averages / maxima and stale-day counts are over the selected days (flows); row
# counts and "stale on the latest day" are point-in-time (window last over Date).
# Answers: metrics/_answers/customer360_data_foundation.sql.
view: mv_delta_sharing_freshness
space: customer360_data_foundation
comment: >-
  Delta Sharing freshness of the 11 tables shared by the JP (Tokyo head office), EMEA and AMER lakehouses,
  daily Apr-2024 to Sep-2026: average and maximum lag since the last provider refresh (hours, SLA 24h), stale
  table-days and stale tables (lag > 24h), share of days within SLA, failed refreshes, schema drift events,
  the longest stale run and the shared row count. Storyline 13: share_jp_parent_rating was not refreshed
  11-15 Aug 2026 (5 stale days, lag up to 125h). Lag and stale counts cover the selected days; Row Count and
  Tables Stale Latest Day are point-in-time (last day of the selection).
grain: one row per shared table per day (gold.fact_delta_share_freshness_daily)
source: ${catalog}.gold.fact_delta_share_freshness_daily
client_block_exempt: >-
  Freshness is measured per shared table and provider region, not per client.
blocks:
  calendar: {date: source.log_date, grain: day, what: the freshness check}
dimensions:
  - name: Provider Region
    expr: source.provider_region
    display_name: Provider Region
    comment: "Lakehouse publishing the share: JP (Tokyo head office), EMEA or AMER - \"from Japan\" means JP."
    synonyms: [provider region, region, provider, Japan, JP, EMEA, AMER, publishing region, data provider]
  - name: Share
    expr: source.share_name
    display_name: Delta Share
    comment: "Delta Share the table arrives in: jp_head_office_share, emea_regional_share or amer_regional_share."
    synonyms: [share, delta share, share name, data share, sharing channel]
  - name: Shared Table
    expr: source.table_name
    display_name: Shared Table
    comment: >-
      Shared table, e.g. share_jp_parent_rating, share_jp_group_master, share_jp_support_letters,
      share_emea_exposure_monthly, share_amer_entity_master.
    synonyms: [table, shared table, dataset, share table, data set, feed table]
  - name: Refresh Status
    expr: source.refresh_status
    display_name: Refresh Status
    comment: "Outcome of the provider's scheduled daily refresh: Success, Late or Failed."
    synonyms: [refresh status, status, refresh result, load status, sync status]
  - name: Is Stale
    expr: source.is_stale
    display_name: Is Stale (lag > 24h)
    comment: True when the lag since the last provider refresh exceeds the 24-hour SLA that day.
    synonyms: [stale, is stale, out of date, outdated, behind SLA, not refreshed, late data]
measures:
  - name: Average Lag Hours
    expr: AVG(source.lag_hours)
    display_name: Average Lag (hours)
    comment: Average hours since the last provider refresh across the selected tables and days.
    synonyms: [average lag, lag hours, freshness lag, data age, latency, hours behind, delay]
    format: &hours {type: number, decimal_places: {type: max, places: 1}}
  - name: Max Lag Hours
    expr: MAX(source.lag_hours)
    display_name: Maximum Lag (hours)
    comment: Largest lag in hours over the selected tables and days (124.6h for share_jp_parent_rating on 15-Aug-2026).
    synonyms: [max lag, maximum lag, worst lag, peak lag, longest delay, oldest data]
    format: *hours
  - name: Stale Table-Days
    expr: COUNT(1) FILTER (WHERE source.is_stale)
    display_name: Stale Table-Days
    comment: Table-days with lag above 24 hours (stale days) over the selection - a flow.
    synonyms: [stale days, stale table days, days stale, SLA breaches, freshness breaches, stale count]
    format: &count {type: number, decimal_places: {type: exact, places: 0}}
  - name: Tables Stale
    expr: COUNT(DISTINCT CASE WHEN source.is_stale THEN source.table_name END)
    display_name: Tables Stale (> 24h) in the Period
    comment: Shared tables stale on at least one day of the selection.
    synonyms: [stale tables, tables stale, out of date tables, tables behind SLA, tables not refreshed]
    format: *count
  - name: Tables Monitored
    expr: COUNT(DISTINCT source.table_name)
    display_name: Shared Tables Monitored
    comment: Shared tables with a freshness check in the selection.
    synonyms: [tables monitored, shared tables, number of tables, tables checked]
    format: *count
  - name: Freshness SLA Met %
    expr: COUNT(1) FILTER (WHERE NOT source.is_stale) / NULLIF(COUNT(1), 0)
    display_name: Freshness SLA Met
    comment: Share of table-days refreshed within the 24-hour SLA (fraction).
    synonyms: [SLA met, freshness SLA, on-time rate, within SLA, freshness rate, timeliness rate]
    format: {type: percentage, decimal_places: {type: max, places: 2}}
  - name: Failed Refreshes
    expr: COUNT(1) FILTER (WHERE source.refresh_status = 'Failed')
    display_name: Failed Refreshes
    comment: Days on which the provider's scheduled refresh failed.
    synonyms: [failed refreshes, refresh failures, load failures, sync failures, failed loads]
    format: *count
  - name: Schema Drift Events
    expr: COUNT(1) FILTER (WHERE source.schema_drift_flag)
    display_name: Schema Drift Events
    comment: Days on which the provider changed a shared table's schema.
    synonyms: [schema drift, schema changes, schema drift events, structure changes, column changes]
    format: *count
  - name: Longest Stale Run Days
    expr: MAX(source.consecutive_stale_days)
    display_name: Longest Run of Consecutive Stale Days
    comment: Longest run of consecutive stale days of a table within the selection (5 for share_jp_parent_rating in Aug-2026).
    synonyms: [longest stale run, consecutive stale days, outage length, longest outage, stale streak]
    format: *count
  - name: Row Count
    expr: SUM(source.row_count)
    display_name: Shared Row Count (latest day)
    comment: Rows in the shared tables at the check on the last day of the selection - point-in-time.
    synonyms: [row count, rows, record count, table size, shared rows, volume]
    format: *count
    window: &eod
      - {order: Date, range: current, semiadditive: last}
  - name: Tables Stale Latest Day
    expr: COUNT(DISTINCT CASE WHEN source.is_stale THEN source.table_name END)
    display_name: Tables Stale on the Latest Day
    comment: Shared tables stale on the last day of the selection (today = 30-Sep-2026) - point-in-time.
    synonyms: [stale today, currently stale, stale now, tables stale today, current staleness]
    format: *count
    window: *eod
validate:
  dims: [Month, Provider Region]
reconcile:
  - name: jp_parent_rating_stale_days_aug26
    measure: Stale Table-Days
    where: "`Shared Table` = 'share_jp_parent_rating' AND `Month` = DATE'2026-08-01'"
    gold: >-
      SELECT count(*) FROM ${catalog}.gold.fact_delta_share_freshness_daily WHERE table_name = 'share_jp_parent_rating'
      AND is_stale AND log_date BETWEEN DATE'2026-08-01' AND DATE'2026-08-31'
  - name: max_lag_by_table_jp_aug26
    measure: Max Lag Hours
    by: [Shared Table]
    where: "`Provider Region` = 'JP' AND `Month` = DATE'2026-08-01'"
    gold: >-
      SELECT table_name, max(lag_hours) FROM ${catalog}.gold.fact_delta_share_freshness_daily
      WHERE provider_region = 'JP' AND month = DATE'2026-08-01' GROUP BY 1
  - name: sla_met_by_region_last_30d
    measure: Freshness SLA Met %
    by: [Provider Region]
    where: "`Date` > DATE'2026-08-31'"
    gold: >-
      SELECT provider_region, avg(CASE WHEN is_stale THEN 0.0 ELSE 1.0 END) FROM ${catalog}.gold.fact_delta_share_freshness_daily
      WHERE is_last_30d GROUP BY 1
  - name: row_count_by_region_sep30
    measure: Row Count
    by: [Provider Region]
    where: "`Date` = DATE'2026-09-30'"
    gold: >-
      SELECT provider_region, sum(row_count) FROM ${catalog}.gold.fact_delta_share_freshness_daily
      WHERE log_date = DATE'2026-09-30' GROUP BY 1
  - name: average_lag_by_region_fy2025
    measure: Average Lag Hours
    by: [Provider Region]
    where: "`Fiscal Year` = 'FY2025'"
    gold: >-
      SELECT provider_region, avg(lag_hours) FROM ${catalog}.gold.fact_delta_share_freshness_daily
      WHERE log_date BETWEEN DATE'2025-04-01' AND DATE'2026-03-31' GROUP BY 1
  - name: tables_stale_latest_day_aug15
    measure: Tables Stale Latest Day
    where: "`Date` = DATE'2026-08-15'"
    gold: SELECT count(DISTINCT table_name) FROM ${catalog}.gold.fact_delta_share_freshness_daily WHERE log_date = DATE'2026-08-15' AND is_stale
glossary:
  caveats:
    - >-
      Lag, stale and failure measures cover the selected days; Row Count and Tables Stale Latest Day are
      point-in-time. The EWS override audit flags overrides that relied on stale JP data (fact_ews_score_daily).
