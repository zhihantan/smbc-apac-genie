# Space 6, Client Onboarding & KYC (WP9b / WP8d). The onboarding funnel over the record_type union gold.mvb_onboarding
# (D13): Case rows (one per onboarding case - is_primary_row), Product Request rows, Document rows and Feedback rows.
# Date = the case's request date on every row (request cohorts). Case measures read Case rows, document / feedback /
# product measures their own rows, so counts never double. Statuses (open, live, outstanding) are as of 30-Sep-2026.
view: mv_onboarding_funnel
space: client_onboarding_kyc
comment: >-
  Client onboarding funnel of SMBC APAC, requests Apr-2024 to Sep-2026: cases opened, open, live, withdrawn,
  rejected, conversion to live, cases matched to an existing client group (at intake or only after account
  opening), open cases over SLA or stuck in KYC Docs, documents outstanding by type, products requested, new
  clients that transacted within 60 days of go-live, and post-onboarding satisfaction. Date = request date
  (cohort by request); statuses are as of 30-Sep-2026. Applicants that never went live have no client record:
  use Booking Country and Request Segment (not Coverage Office / Segment) to include them.
grain: one row per onboarding case, case x product requested, KYC document or survey response (gold.mvb_onboarding)
source: ${catalog}.gold.mvb_onboarding
blocks:
  calendar: {date: source.request_date, grain: day, what: the onboarding request}
  client: {key: source.golden_client_sk}
joins:
  - name: own
    source: ${catalog}.gold.dim_employee
    'on': source.owner_id = own.employee_id
overrides:
  Date:
    comment: >-
      Request date of the onboarding case (on every row type, so documents and surveys follow their case's request
      cohort); "this fiscal year" requests = Fiscal Year FY2026. Today is 30-Sep-2026 (never CURRENT_DATE).
    synonyms: [request date, application date, request day, submitted date, onboarding request date]
  Segment:
    comment: >-
      Segment of the onboarded client (live cases only - applicants that never went live have none); use Request
      Segment to include every request.
    synonyms: [client segment, onboarded client segment, segment of client, customer segment]
  Coverage Office:
    comment: >-
      Coverage office of the onboarded client (live cases only); use Booking Country for every request.
    synonyms: [coverage office, client office, coverage country, client booking country]
dimensions:
  - name: Booking Country
    expr: source.booking_country
    display_name: Booking Country
    comment: Booking location of the onboarding request (ISO-2, e.g. SG, HK, TH) - every case, including applicants.
    synonyms: [booking country, country, booking location, booking entity, onboarding country, branch]
  - name: Request Segment
    expr: source.segment
    display_name: Request Segment
    comment: >-
      Segment of the requesting entity on the case (Japanese Corporate, Non-Japanese Large Corporate, Financial
      Institution, Sponsor & Structured Finance, Public Sector) - every case, including applicants.
    synonyms: [segment, request segment, applicant segment, case segment, client type]
  - name: Primary Product
    expr: source.primary_product
    display_name: Primary Product Requested
    comment: Anchor product of the request - Current Account (corporates) or Correspondent Account (financial institutions).
    synonyms: [primary product, main product, anchor product, first product, product]
  - name: Product Requested
    expr: source.product_requested
    display_name: Product Requested
    comment: "Product Request rows: one requested product (e.g. Current Account, Payments, Time Deposit, Trade Finance, FX, Liquidity Sweeping)."
    synonyms: [product requested, products, requested product, product line, service requested]
  - name: Current Stage
    expr: source.current_stage
    display_name: Current Stage
    comment: >-
      Stage the case is in or ended in: Request, KYC Docs, Screening, Risk Assessment, Credit/Product Approval,
      Account Open, First Transaction, or Complete (live and transacted).
    synonyms: [stage, current stage, funnel stage, onboarding stage, where stuck, step]
  - name: Case Status
    expr: source.case_status
    display_name: Case Status
    comment: "Case status at 30-Sep-2026: Open, Live, Withdrawn or Rejected."
    synonyms: [status, case status, onboarding status, outcome, live or open]
  - name: Blocker Reason
    expr: source.blocker_reason
    display_name: Blocker Reason
    comment: Why an open case is stuck (e.g. Workflow Migration Backlog, Awaiting Client Documents, UBO Verification Pending).
    synonyms: [blocker, blocker reason, reason stuck, impediment, hold reason, delay reason]
  - name: Owner
    expr: own.employee_name
    display_name: Onboarding Owner
    comment: Onboarding officer owning the case.
    synonyms: [owner, case owner, onboarding officer, handler, KYC officer, assigned to]
  - name: Match Timing
    expr: source.match_timing
    display_name: Group Match Timing
    comment: >-
      When the new entity was matched to an existing client group: At Intake, After Account Opening (found later by
      entity resolution, e.g. Meridian's Thai subsidiary) or New Group (no existing group identified).
    synonyms: [match timing, group match, matched to group, entity resolution match, existing group match, when matched]
  - name: Go-Live Fiscal Year
    expr: CONCAT('FY', source.go_live_fiscal_year)
    display_name: Go-Live Fiscal Year
    comment: Japanese fiscal year of the go-live (account opening) of live cases, e.g. FY2026 = onboarded Apr-2026 or later.
    synonyms: [go-live year, onboarded in, onboarding year, live fiscal year, year onboarded]
  - name: Stuck in KYC Docs 15D
    expr: source.case_stuck_in_kyc_docs_15d
    display_name: Case Stuck in KYC Docs (> 15 days)
    comment: True on every row of an open case that has been in the KYC Docs stage for more than 15 days (dim_threshold KYC_DOCS_STUCK_DAYS).
    synonyms: [stuck in KYC docs, stuck cases, KYC docs over 15 days, waiting for documents, document backlog]
  - name: Document Type
    expr: source.document_type
    display_name: Document Type
    comment: "Document rows: KYC document requested (e.g. UBO Declaration, Board Resolution, Audited Financial Statements, AML/CTF Questionnaire)."
    synonyms: [document type, document, KYC document, missing document, CDD document, paperwork]
  - name: Feedback Theme
    expr: source.feedback_theme
    display_name: Feedback Theme
    comment: "Feedback rows: comment theme - Turnaround Time, Relationship Manager, Account Setup, Digital Portal, Communication, Document Requests."
    synonyms: [feedback theme, comment theme, theme, complaint theme, satisfaction driver, topic]
measures:
  - name: Cases Opened
    expr: COUNT(1) FILTER (WHERE source.is_primary_row)
    display_name: Cases Opened
    comment: Onboarding requests (cases) in the selection.
    synonyms: [cases, cases opened, requests, onboarding requests, applications, new cases]
    format: &count {type: number, decimal_places: {type: exact, places: 0}}
  - name: Open Cases
    expr: COUNT(1) FILTER (WHERE source.is_open)
    display_name: Open Cases
    comment: Cases still in progress at 30-Sep-2026.
    synonyms: [open cases, in progress, pending cases, work in progress, pipeline cases]
    format: *count
  - name: Cases Live
    expr: COUNT(1) FILTER (WHERE source.is_live)
    display_name: Cases Live
    comment: Cases that went live (client onboarded).
    synonyms: [live, cases live, onboarded, go-lives, completed onboardings, new clients]
    format: *count
  - name: Cases Withdrawn
    expr: COUNT(1) FILTER (WHERE source.is_withdrawn)
    display_name: Cases Withdrawn
    comment: Cases withdrawn by the client or RM.
    synonyms: [withdrawn, cancelled, dropped, abandoned cases]
    format: *count
  - name: Cases Rejected
    expr: COUNT(1) FILTER (WHERE source.is_rejected)
    display_name: Cases Rejected
    comment: Cases rejected (screening, risk or credit).
    synonyms: [rejected, declined, refused, rejected cases]
    format: *count
  - name: Closed Cases
    expr: COUNT(1) FILTER (WHERE source.is_primary_row AND NOT source.is_open)
    display_name: Closed Cases
    comment: Cases no longer open (live, withdrawn or rejected) - the denominator of the conversion rate.
    synonyms: [closed cases, decided cases, completed cases, finished cases]
    format: *count
  - name: Conversion to Live %
    expr: MEASURE(`Cases Live`) / NULLIF(MEASURE(`Closed Cases`), 0)
    display_name: Conversion to Live
    comment: Live cases / closed cases (fraction) - open cases are excluded until decided.
    synonyms: [conversion, conversion rate, live rate, success rate, pull-through, onboarding conversion]
    format: &pct {type: percentage, decimal_places: {type: max, places: 1}}
  - name: Matched to Existing Group
    expr: COUNT(1) FILTER (WHERE source.matched_existing_group)
    display_name: Cases Matched to an Existing Group
    comment: Cases belonging to an existing client group (matched at intake or after account opening).
    synonyms: [matched to group, existing group cases, group matches, matched cases]
    format: *count
  - name: Matched to Existing Group %
    expr: MEASURE(`Matched to Existing Group`) / NULLIF(MEASURE(`Cases Opened`), 0)
    display_name: Matched to Existing Group
    comment: Share of cases matched to an existing client group (fraction).
    synonyms: [matched share, existing group share, group match rate, match rate, percent matched]
    format: *pct
  - name: Matched After Account Opening
    expr: COUNT(1) FILTER (WHERE source.is_primary_row AND source.match_timing = 'After Account Opening')
    display_name: Matched Only After Account Opening
    comment: Cases not linked to their group at intake and matched only after account opening (entity resolution).
    synonyms: [matched after opening, late match, missed at intake, found after account opening, ER late match]
    format: *count
  - name: Cases Over SLA
    expr: COUNT(1) FILTER (WHERE source.is_primary_row AND source.case_over_sla)
    display_name: Open Cases Over SLA
    comment: Open cases whose current stage has run longer than its SLA at 30-Sep-2026 (over SLA right now).
    synonyms: [over SLA, SLA breaches, late cases, overdue cases, breaching SLA, cases past SLA]
    format: *count
  - name: Cases Stuck in KYC Docs
    expr: COUNT(1) FILTER (WHERE source.is_primary_row AND source.case_stuck_in_kyc_docs_15d)
    display_name: Cases Stuck in KYC Docs (> 15 days)
    comment: Open cases in the KYC Docs stage for more than 15 days.
    synonyms: [stuck in KYC docs, stuck cases, KYC docs backlog, waiting for documents, document delays]
    format: *count
  - name: Documents Outstanding
    expr: COUNT(1) FILTER (WHERE source.is_document_outstanding)
    display_name: Documents Outstanding
    comment: KYC documents still outstanding at 30-Sep-2026 (Document rows).
    synonyms: [documents outstanding, missing documents, outstanding docs, pending documents, awaited documents]
    format: *count
  - name: Product Requests
    expr: COUNT(1) FILTER (WHERE source.record_type = 'Product Request')
    display_name: Product Requests
    comment: Products requested across the selected cases (one per case x product).
    synonyms: [product requests, products requested, requested products, product demand]
    format: *count
  - name: Transacted Within 60D
    expr: COUNT(1) FILTER (WHERE source.transacted_within_60d)
    display_name: Live Clients Transacting Within 60 Days
    comment: Live cases whose first transaction came within 60 days of go-live.
    synonyms: [transacted within 60 days, activated, active within 60 days, early activation]
    format: *count
  - name: Not Transacted Within 60D
    expr: COUNT(1) FILTER (WHERE source.is_live AND NOT source.transacted_within_60d)
    display_name: Live Clients Not Transacting Within 60 Days
    comment: Live cases without a first transaction within 60 days of go-live (slow activation).
    synonyms: [not transacted, dormant new clients, not activated, slow activation, inactive new clients]
    format: *count
  - name: Activation Within 60D %
    expr: MEASURE(`Transacted Within 60D`) / NULLIF(MEASURE(`Cases Live`), 0)
    display_name: Activation Within 60 Days
    comment: Live cases transacting within 60 days of go-live / live cases (fraction).
    synonyms: [activation rate, 60 day activation, transacted share, activation within 60 days]
    format: *pct
  - name: Average First Transaction Lag Days
    expr: AVG(source.first_transaction_lag_days)
    display_name: Average Days to First Transaction
    comment: Average days from go-live to the client's first transaction (live cases that have transacted).
    synonyms: [first transaction lag, activation lag, days to first transaction, time to activate, activation time]
    format: {type: number, decimal_places: {type: max, places: 1}}
  - name: Survey Responses
    expr: COUNT(1) FILTER (WHERE source.record_type = 'Feedback')
    display_name: Survey Responses
    comment: Post-onboarding survey responses (Feedback rows).
    synonyms: [responses, survey responses, feedback count, surveys]
    format: *count
  - name: Average Satisfaction
    expr: AVG(source.satisfaction_score)
    display_name: Average Satisfaction (1-5)
    comment: Average post-onboarding satisfaction score 1-5 (5 = very satisfied).
    synonyms: [satisfaction, CSAT, average score, client satisfaction, NPS-like score, survey score]
    format: {type: number, decimal_places: {type: max, places: 2}}
  - name: Negative Responses
    expr: COUNT(1) FILTER (WHERE source.is_negative_feedback)
    display_name: Negative Responses
    comment: Survey responses scoring 1-2 (negative); group by Feedback Theme for the common negative themes.
    synonyms: [negative feedback, complaints, detractors, unhappy clients, negative comments]
    format: *count
validate:
  dims: [Fiscal Year, Case Status]
reconcile:
  - name: cases_by_match_timing
    measure: Cases Opened
    by: [Match Timing]
    gold: SELECT match_timing, count(*) FROM ${catalog}.gold.fact_onboarding_case GROUP BY 1
  - name: matched_share_all_cases
    measure: Matched to Existing Group %
    gold: SELECT avg(CASE WHEN matched_existing_group THEN 1.0 ELSE 0.0 END) FROM ${catalog}.gold.fact_onboarding_case
  - name: conversion_by_request_fy
    measure: Conversion to Live %
    by: [Fiscal Year]
    gold: >-
      SELECT request_fiscal_year_label, count_if(is_live) / count_if(NOT is_open) FROM ${catalog}.gold.fact_onboarding_case GROUP BY 1
  - name: outstanding_docs_stuck_cases_by_type
    measure: Documents Outstanding
    by: [Document Type]
    where: "`Current Stage` = 'KYC Docs'"
    gold: >-
      SELECT document_type, count_if(is_outstanding) FROM ${catalog}.gold.fact_kyc_document
      WHERE case_current_stage = 'KYC Docs' GROUP BY 1
  - name: not_transacted_fy2026
    measure: Not Transacted Within 60D
    where: "`Go-Live Fiscal Year` = 'FY2026'"
    gold: >-
      SELECT count(*) FROM ${catalog}.gold.fact_onboarding_case WHERE is_live AND go_live_fiscal_year = 2026 AND NOT transacted_within_60d
  - name: satisfaction_by_booking_country
    measure: Average Satisfaction
    by: [Booking Country]
    gold: SELECT booking_country, avg(satisfaction_score) FROM ${catalog}.gold.fact_onboarding_feedback GROUP BY 1
glossary:
  caveats:
    - >-
      Date is the request date for every row type (cohort view); statuses are as of 30-Sep-2026. Applicants that
      never went live have no golden client: client-block fields are null for them.
